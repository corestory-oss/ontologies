name: Validate ontologies

on:
  push:
    branches-ignore: [site]
  pull_request:
    branches-ignore: [site]

permissions:
  contents: read

jobs:
  rdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
      - run: nix flake check --print-build-logs
