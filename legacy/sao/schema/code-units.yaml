      abstract_method:
        description: "Abstract method declaration."
      virtual_method:
        description: "Virtual/overridable method."
      function:
        description: "Function (procedural or functional programming)."
      procedure:
        description: "Procedure/subroutine."
      subroutine:
        description: "Subroutine."
      paragraph:
        description: COBOL paragraph
      section:
