name: Validate ontologies

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs
      - name: Collect static site
        run: |
          mkdir -p public
          cp -R result/. public/
      - uses: actions/upload-artifact@v4
        with:
          name: ontology-site
          path: public/
  legacy-sao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
      - run: uv sync --locked --group legacy
      - run: uv run --group legacy linkml-lint --validate-only legacy/sao/sao.yml
      - run: uv run --group legacy python scripts/migration/sao/check_schema.py
      - run: uv run --group legacy python -m unittest discover -s legacy/sao/tests
      - name: Validate legacy modules and generators
        run: |
          for module in legacy/sao/schema/*.yaml; do
            uv run --group legacy linkml-lint --validate-only "$module"
          done
          uv run --group legacy gen-json-schema legacy/sao/sao.yml > /tmp/sao.schema.json
          uv run --group legacy gen-doc --render-imports --directory /tmp/sao-reference legacy/sao/sao.yml
      - run: uv run --group legacy linkml-validate --exit-on-first-failure -s legacy/sao/sao.yml -C System examples/sao/system.yaml
      - run: uv run --group legacy linkml-validate --exit-on-first-failure -s legacy/sao/sao.yml -C Aggregate examples/sao/aggregate.yaml
      - run: uv run --group legacy linkml-validate --exit-on-first-failure -s legacy/sao/sao.yml -C Integration examples/sao/integration.yaml
