      closure:
        description: "Closure."
      higher_order_function:
        description: "Higher-order function."
      curried_function:
        description: "Curried function."
      functor:
        description: "Functor."
      event_handler:
        description: "Event handler."
      callback:
        description: "Callback function."
      delegate:
        description: "Delegate."
      signal_handler:
        description: "Signal handler."
      stored_procedure:
        description: "Database stored procedure."
      stored_function:
        description: "Database function."
      trigger_body:
        description: "Trigger implementation."
      cursor:
        description: "Database cursor."
      coroutine:
        description: "Coroutine."
      generator:
        description: "Generator function."
      async_function:
        description: "Async/await function."
      thread_entry:
        description: "Thread entry point."
      task:
        description: "Task/future/promise."
      test_case:
        description: "Unit test case."
      test_fixture:
        description: "Test fixture/setup method."
      mock:
        description: "Mock function."
      macro:
        description: "Preprocessor macro."
      template:
        description: Template function (C++)
      generic_method:
        description: "Generic method."
      main_entry:
        description: "Main entry point."
      interrupt_handler:
        description: "Interrupt service routine."
      exception_handler:
        description: "Exception handler."
      finalizer:
        description: "Finalizer/cleanup method."
      factory_method:
        description: "Factory method."
      extension_method:
        description: "Extension method."
      script_function:
        description: "Script function."
      command:
        description: "Command/action function."
      other:
        description: "Other callable types."
      rpg_subprocedure:
        description: "RPG subprocedure."
      pli_entry:
        description: PL/I ENTRY point
      assembler_entry:
        description: Assembler entry point
      rpg_subroutine:
        description: "RPG subroutine."

  DataStructureType:
    description: Types of data structures across different paradigms
    permissible_values:
      class_data:
        description: "Data members of a class."
      inner_class:
        description: "Inner/nested class."
      anonymous_class:
        description: "Anonymous class."
      struct:
        description: "C/C++ struct."
      record:
        description: "Pascal/Ada record or COBOL record."
      union:
