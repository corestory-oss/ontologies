      module:
        description: Functional module (Haskell, OCaml, F#)
      namespace:
        description: "Namespace grouping."
      package:
        description: Package (Ada, Go)
      library:
        description: "Library module."
      object:
        description: JavaScript/prototype-based object
      component:
