      interface:
        description: "Interface or contract definition."
      abstract_class:
        description: "Abstract base class."
      trait:
        description: Trait (Rust, Scala) or mixin
      enum_class:
        description: "Enumeration class."
      record_class:
        description: Record or data class (Java records, Python dataclass)
      singleton:
        description: "Singleton pattern implementation."
      program:
