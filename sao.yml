      jump:
        description: Unconditional jump
      return:
        description: Return from callable
      throw:
        description: Exception throw
      yield:
        description: Yield/generator control

  DataFlowType:
    description: Types of data flow
    permissible_values:
      read:
        description: Read data element
      write:
        description: Write data element
      modify:
        description: Modify data element
      define:
        description: Define data element
      use:
        description: Use data element

  StorageClass:
    description: Storage classes for data elements
    permissible_values:
      automatic:
        description: Automatic/stack storage
      static:
        description: Static/global storage
      heap:
        description: Heap/dynamic storage
      register:
        description: Register storage hint
      thread_local:
        description: Thread-local storage
      external:
        description: External linkage

  PersistenceType:
    description: How a data structure is persisted
    permissible_values:
      transient:
        description: Not persisted (in-memory only)
      database_table:
        description: Persisted as database table
      database_view:
        description: Represented as database view
      file_record:
        description: File record (VSAM, sequential, etc.)
      serialized:
        description: Serialized to file/stream
      cached:
        description: Cached in memory with backing store
      distributed_cache:
        description: Distributed cache (Redis, Memcached)
      message_queue:
        description: Persisted in message queue
      object_store:
        description: Object/blob storage
      document_store:
        description: Document database (MongoDB, etc.)
      key_value_store:
        description: Key-value store
      graph_database:
        description: Graph database node/edge

  DatabaseType:
    description: Types of database management systems
    permissible_values:
      oracle:
        description: Oracle Database
      postgresql:
        description: PostgreSQL
      sql_server:
        description: Microsoft SQL Server
      mysql:
        description: MySQL/MariaDB
      db2:
        description: IBM DB2
      teradata:
        description: Teradata
      sybase:
        description: Sybase
      informix:
        description: IBM Informix
      mongodb:
        description: MongoDB (NoSQL)
      cassandra:
        description: Apache Cassandra

  LinkageType:
    description: Types of callable linkage
    permissible_values:
      static:
        description: Statically linked
      dynamic:
        description: Dynamically linked
      inline:
        description: Inlined at compile time
      late_binding:
        description: Late/runtime binding

  SecurityType:
    description: Database security context types
    permissible_values:
      definer:
        description: Execute with definer's privileges
      invoker:
        description: Execute with invoker's privileges

  StructureLayout:
    description: Memory layout strategies for structures
    permissible_values:
      sequential:
        description: Sequential layout (default)
      explicit:
        description: Explicit field offsets
      auto:
        description: Compiler-optimized layout
      packed:
        description: Packed layout (no padding)

  EqualitySemantics:
    description: How equality is determined for value types
    permissible_values:
      by_value:
        description: Compare all field values
      by_reference:
        description: Compare object references
      by_identity:
        description: Compare unique identifiers
      custom:
        description: Custom equality logic

  MessageFormat:
    description: Message serialization formats
    permissible_values:
      json:
        description: JSON format
      xml:
        description: XML format
      protobuf:
        description: Protocol Buffers
      avro:
        description: Apache Avro
      thrift:
        description: Apache Thrift
      msgpack:
        description: MessagePack
      custom_binary:
        description: Custom binary format

# =============================================================================
# TYPE DEFINITIONS
# =============================================================================
types:
  SemanticVersion:
    typeof: string
    description: Semantic version string (e.g., 1.2.3)
    pattern: "^\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9]+)?$"

  URI:
    typeof: uriorcurie
    description: Universal Resource Identifier

  Timestamp:
    typeof: datetime
    description: ISO 8601 timestamp

# =============================================================================
# ABSTRACT BASE CLASSES
# =============================================================================
classes:
  # ---------------------------------------------------------------------------
  # Named Entity Base
  # ---------------------------------------------------------------------------
  NamedEntity:
    abstract: true
    description: >-
      Abstract base class for all named entities in the ontology
    attributes:
      id:
        identifier: true
        range: string
        required: true
        description: Unique identifier for the entity
      name:
        range: string
        required: true
        description: Human-readable name
      description:
        range: string
        description: Detailed description of the entity
      tags:
        range: string
        multivalued: true
        description: Classification tags
      metadata:
        range: Metadata
        inlined: true
        description: Additional metadata

  Metadata:
    description: Common metadata for entities
    attributes:
      created_at:
        range: Timestamp
      updated_at:
        range: Timestamp
      created_by:
        range: string
        description: User or system that created this entity
      version:
        range: SemanticVersion

  # ---------------------------------------------------------------------------
  # Versionable Mixin
  # ---------------------------------------------------------------------------
  Versionable:
    mixin: true
    description: Mixin for entities that support versioning
    attributes:
      version:
        range: SemanticVersion
        description: Semantic version
      effective_from:
        range: Timestamp
        description: When this version became effective
      effective_to:
        range: Timestamp
        description: When this version was superseded
      is_current:
        range: boolean
        description: Whether this is the current version

  # ---------------------------------------------------------------------------
  # Auditable Mixin
  # ---------------------------------------------------------------------------
  Auditable:
    mixin: true
    description: Mixin for entities requiring audit trails
    attributes:
      audit_log:
        range: AuditLog
        description: Associated audit log

  # =============================================================================
  # SECTION 1: STRUCTURAL FOUNDATION
  # =============================================================================

  # ---------------------------------------------------------------------------
  # System
  # ---------------------------------------------------------------------------
  System:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      Top-level container representing a software product, platform, or application
    slots:
      - contains_bounded_contexts
      - has_integrations
      - enforces_policies
      - must_comply_with
      - assessed_by
      - exposes_interfaces
    slot_usage:
      contains_bounded_contexts:
        inlined_as_list: true

  # ---------------------------------------------------------------------------
  # Bounded Context
  # ---------------------------------------------------------------------------
  BoundedContext:
    is_a: NamedEntity
    description: >-
      A semantic boundary within which a domain model applies consistently.
      Corresponds to DDD bounded context concept.
    slots:
      - contained_in_system
      - contains_modules
      - upstream_from
      - downstream_from
      - contains_aggregates
    attributes:
      ubiquitous_language:
        range: string
        multivalued: true
        description: Key terms in the ubiquitous language for this context
      context_map_relationship:
        range: string
        description: Relationship pattern (e.g., Customer-Supplier, Partnership)
    slot_usage:
      contains_modules:
        inlined_as_list: true
      contains_aggregates:
        inlined_as_list: true

  # ---------------------------------------------------------------------------
  # Module
  # ---------------------------------------------------------------------------
  Module:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A deployable, cohesive unit of functionality within a bounded context
    slots:
      - contained_in_context
      - contains_components
      - depends_on_module
      - depended_on_by_module
      - provides_capabilities
      - runs_as_services
    attributes:
      dependencies:
        range: Dependency
        multivalued: true
        inlined_as_list: true
        description: Module dependencies
      is_optional:
        range: boolean
        description: Whether this module is optional
      required_features:
        range: string
        multivalued: true
        description: Features required to enable this module
    slot_usage:
      contains_components:
        inlined_as_list: true

  # ---------------------------------------------------------------------------
  # Component
  # ---------------------------------------------------------------------------
  Component:
    is_a: NamedEntity
    description: >-
      A logical building block within a module (class, function group, etc.)
    slots:
      - contained_in_module
      - exposes_operations
      - emits_events
    attributes:
      component_type:
        range: string
        description: Type of component (e.g., class, service, handler)
      language:
        range: string
        description: Implementation language
      source_location:
        range: string
        description: Path to source code
      dependencies:
        range: Dependency
        multivalued: true
        inlined_as_list: true
        description: Component dependencies
      emits_metrics:
        range: Metric
        multivalued: true
        description: Metrics emitted by this component
      generates_logs:
        range: Log
        multivalued: true
        description: Logs generated by this component

  # ===========================================================================
  # CODE STRUCTURE CLASSES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Physical Structure (Files and Storage)
  # ---------------------------------------------------------------------------
  CodeContainer:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A physical container of source code - may be a file, member in a library,
      or other storage unit depending on the platform.
    attributes:
      container_path:
        range: string
        required: true
        description: Path or identifier for this container
      container_type:
        range: CodeContainerType
        description: Type of container (file, library member, module, etc.)
      format:
        range: string
        description: Format or language (COBOL, Java, Python, SQL, etc.)
      size_bytes:
        range: integer
        description: Size in bytes
      line_count:
        range: integer
        description: Number of lines
      encoding:
        range: string
        description: Character encoding
      checksum:
        range: string
        description: Content hash for version tracking
    slots:
      - contained_in_storage_location
      - contains_encapsulation_units
      - references_containers
      - referenced_by_containers
      - includes_definitions
      - included_in_containers
      - implements_component

  StorageLocation:
    is_a: NamedEntity
    description: >-
      A logical or physical location for storing code containers.
      Maps to: directory (Unix/Windows), PDS/PDSE (mainframe),
      package (Java), namespace (C#), module path (Python).
    attributes:
      location_path:
        range: string
        required: true
        description: Path or identifier
      location_type:
        range: StorageLocationType
        description: Type of storage location
    slots:
      - parent_location
      - contains_locations
      - contains_containers
      - maps_to_module

  # ---------------------------------------------------------------------------
  # Logical Structure (Code Organization)
  # ---------------------------------------------------------------------------
  EncapsulationUnit:
    is_a: NamedEntity
    abstract: true
    description: >-
      A logical boundary that groups related code and data.
      Maps to: Class (OOP), Program (COBOL), Module (functional),
      Package (Java), Namespace (C#), Record module (ML).
    attributes:
      encapsulation_type:
        range: EncapsulationType
        required: true
        description: The paradigm-specific type of this encapsulation unit
      visibility:
        range: VisibilityType
        description: Access control level
      is_reusable:
        range: boolean
        description: Whether this unit can be reused/instantiated
      is_abstract:
        range: boolean
        description: Whether this is an abstract unit (abstract class, interface, etc.)
      is_final:
        range: boolean
        description: Whether this unit can be extended/inherited
      qualified_name:
        range: string
        description: Fully qualified name including namespace/package
      line_start:
        range: integer
        description: Starting line in container
      line_end:
        range: integer
        description: Ending line in container
      stereotype:
        range: string
        description: Additional stereotype or pattern (e.g., Service, Repository, DTO)
    slots:
      - defined_in_container
      - contains_callable_units
      - contains_data_structures
      - contains_data_elements
      - extends_units
      - implements_contracts
      - uses_definitions
      - implements_component

  CallableUnit:
    is_a: NamedEntity
    description: >-
      A named, invocable unit of code that performs a specific task.
      Maps to: Method (OOP), Function (procedural/functional),
      Paragraph (COBOL), Procedure (SQL), Subroutine (Fortran),
      Lambda (functional).
    attributes:
      callable_type:
        range: CallableType
        required: true
        description: The paradigm-specific type of this callable unit
      visibility:
        range: VisibilityType
        description: Access control level
      callable_category:
        range: CallableCategory
        description: Category of callable (constructor, destructor, normal, etc.)
      return_type:
        range: string
        description: Return type/output description
      is_async:
        range: boolean
        description: Whether execution is asynchronous
      is_pure:
        range: boolean
        description: Whether function is pure (no side effects)
      is_static:
        range: boolean
        description: Whether this is a static/class-level callable
      is_virtual:
        range: boolean
        description: Whether this can be overridden
      is_override:
        range: boolean
        description: Whether this overrides a parent callable
      is_recursive:
        range: boolean
        description: Whether this calls itself (directly or indirectly)
      is_inline:
        range: boolean
        description: Whether this should be inlined (hint to compiler)
      calling_convention:
        range: string
        description: Calling convention (cdecl, stdcall, fastcall, etc.)
      line_start:
        range: integer
        description: Starting line
      line_end:
        range: integer
        description: Ending line in container
      entry_point_type:
        range: EntryPointType
        description: Type of entry point if applicable
      documentation:
        range: string
        description: Documentation/comments
      complexity_score:
        range: integer
        description: Cyclomatic complexity or similar metric
    slots:
      - contained_in_unit
      - defined_in_container
      - has_parameters
      - invokes_callables
      - invoked_by_callables
      - accesses_data_elements
      - modifies_data_elements
      - implements_operation
      - raises_exceptions
      - handles_exceptions
      - overrides_callable
      - overridden_by_callables

  DataStructure:
    is_a: NamedEntity
    description: >-
      A composite data type grouping related data elements.
      Maps to: Struct (C), Record (Pascal/COBOL), Class data (OOP),
      Type (Haskell), Dictionary (Python), Hash (Ruby).
    attributes:
      structure_type:
        range: DataStructureType
        required: true
        description: The paradigm-specific type of this data structure
      structure_category:
        range: DataStructureCategory
        description: Category of structure (composite, collection, etc.)
      visibility:
        range: VisibilityType
        description: Access control level
      is_mutable:
        range: boolean
        description: Whether structure can be modified after creation
      is_nested:
        range: boolean
        description: Whether this is nested within another structure
      nesting_level:
        range: integer
        description: Nesting depth (for hierarchical structures like COBOL)
      is_packed:
        range: boolean
        description: Whether structure uses packed storage
      alignment:
        range: integer
        description: Memory alignment requirement in bytes
      size_bytes:
        range: integer
        description: Total size in bytes (if known)
      is_serializable:
        range: boolean
        description: Whether structure can be serialized
      persistence_type:
        range: PersistenceType
        description: How this structure is persisted
      line_start:
        range: integer
      line_end:
        range: integer
    slots:
      - contained_in_unit
      - defined_in_container
      - contains_data_elements
      - parent_structure
      - child_structures
      - maps_to_domain_entity
      - maps_to_value_object
      - persisted_in_collection

  DataElement:
    is_a: NamedEntity
    description: >-
      An individual data field or variable.
      Maps to: Field (OOP), Variable (procedural), Column (database),
      Data item (COBOL), Property (C#), Attribute (Python).
    attributes:
      data_type:
        range: string
        required: true
        description: Data type (language-specific or abstract)
      element_category:
        range: DataElementCategory
        description: Category of data element
      visibility:
        range: VisibilityType
        description: Access control
      is_constant:
        range: boolean
        description: Whether value is immutable
      is_nullable:
        range: boolean
        description: Whether can be null/nil
      default_value:
        range: string
        description: Default/initial value
      size_specification:
        range: string
        description: Size/length specification (e.g., COBOL PIC, array dimensions)
      storage_class:
        range: StorageClass
        description: Storage class (static, automatic, register, etc.)
      classification:
        range: DataClassificationType
        description: Security/privacy classification
      line_number:
        range: integer
        description: Line where defined
    slots:
      - contained_in_structure
      - contained_in_unit
      - parent_element
      - child_elements
      - maps_to_attribute

  Parameter:
    is_a: DataElement
    description: >-
      An input/output parameter for a callable unit.
      Maps to: Parameter (most languages), Argument (some contexts),
      USING clause (COBOL), Formal parameter (functional).
    attributes:
      direction:
        range: ParameterDirection
        description: Input, output, or both
      position:
        range: integer
        description: Position in parameter list
      passing_mechanism:
        range: PassingMechanism
        description: How parameter is passed (by value, reference, etc.)

  # ---------------------------------------------------------------------------
  # Code Semantics
  # ---------------------------------------------------------------------------
  CodeBlock:
    is_a: NamedEntity
    description: >-
      A logical grouping of statements within a callable unit.
      Maps to: Block (C/Java), Section (COBOL), Scope (general),
      Let binding (functional).
    attributes:
      block_type:
        range: CodeBlockType
        description: Type of block
      line_start:
        range: integer
      line_end:
        range: integer
    slots:
      - contained_in_callable
      - contains_statements
      - parent_block
      - child_blocks

  Statement:
    is_a: NamedEntity
    description: >-
      A single executable instruction or declaration.
      Maps to: Statement (imperative), Expression (functional),
      Sentence (COBOL), Query (SQL).
    attributes:
      statement_category:
        range: StatementCategory
        description: Category of statement
      line_number:
        range: integer
        description: Line number
      is_conditional:
        range: boolean
        description: Whether statement is conditional
      text:
        range: string
        description: Source text of statement
    slots:
      - contained_in_block
      - operates_on_elements
      - invokes_callable
      - transfers_control_to

  DefinitionReference:
    is_a: NamedEntity
    description: >-
      A reference from one code container to shared definitions.
      Maps to: Import (Python/Java), Include (C/C++), COPY (COBOL),
      Using (C#), Require (Ruby), Use (Rust).
    attributes:
      reference_type:
        range: ReferenceType
        description: Type of reference
      reference_path:
        range: string
        description: Path or identifier of referenced definition
      alias:
        range: string
        description: Alias or local name
      is_wildcard:
        range: boolean
        description: Whether this imports all symbols
      scope:
        range: string
        description: Scope of import (global, local, etc.)
    slots:
      - referencing_container
      - referenced_container
      - imports_symbols

  ControlFlow:
    is_a: NamedEntity
    description: >-
      Represents control flow between code elements.
      Maps to: Call graph edges, PERFORM (COBOL), GOTO,
      Function calls, Method invocations.
    attributes:
      flow_type:
        range: ControlFlowType
        description: Type of control transfer
      is_conditional:
        range: boolean
        description: Whether flow is conditional
      condition:
        range: string
        description: Condition expression if applicable
    slots:
      - source_callable
      - target_callable
      - source_statement
      - target_statement

  DataFlow:
    is_a: NamedEntity
    description: >-
      Represents data flow between code elements.
    attributes:
      flow_type:
        range: DataFlowType
        description: Type of data flow (read, write, modify)
    slots:
      - source_element
      - target_element
      - through_callable
      - through_statement

  # ---------------------------------------------------------------------------
  # Platform-Specific Extensions
  # ---------------------------------------------------------------------------
  PlatformExtension:
    is_a: NamedEntity
    abstract: true
    description: >-
      Base class for platform-specific extensions that don't map
      cleanly to universal concepts.
    attributes:
      platform:
        range: string
        description: Platform this extension applies to

  ExecutionEnvironmentDirective:
    is_a: PlatformExtension
    description: >-
      Platform-specific execution directives.
      Maps to: JCL (mainframe), Docker Compose, Kubernetes manifests,
      Shell scripts, Makefiles, Ant/Maven/Gradle build files.
    attributes:
      directive_type:
        range: string
        description: Type of directive
      configuration:
        range: string
        description: Configuration content
    slots:
      - orchestrates_units
      - defines_execution_order
      - allocates_resources

  Annotation:
    is_a: NamedEntity
    description: >-
      Metadata attached to code elements.
      Maps to: Annotations (Java), Decorators (Python),
      Attributes (C#), Pragmas (C/C++), Compiler directives.
    attributes:
      annotation_syntax:
        range: string
        description: Annotation syntax/name
      parameters:
        range: string
        multivalued: true
        description: Annotation parameters
    slots:
      - annotates_element
      - affects_behavior_of

  # ---------------------------------------------------------------------------
  # Capability
  # ---------------------------------------------------------------------------
  Capability:
    is_a: NamedEntity
    description: >-
      A discrete business or technical ability the system provides
    slots:
      - realizes_features
      - requires_permissions

  # ---------------------------------------------------------------------------
  # Feature
  # ---------------------------------------------------------------------------
  Feature:
    is_a: NamedEntity
    description: >-
      A user-facing manifestation of one or more capabilities
    slots:
      - enabled_by_capabilities
      - controlled_by_configs
      - accessible_by_roles
    attributes:
      category:
        range: FeatureCategory
        description: Feature category

  # ---------------------------------------------------------------------------
  # Interface
  # ---------------------------------------------------------------------------
  Interface:
    is_a: NamedEntity
    abstract: true
    description: >-
      A contract-defined boundary through which interaction occurs
    slots:
      - defined_by_contract
    attributes:
      category:
        range: InterfaceCategory
        description: Interface category
      authentication_required:
        range: boolean
        description: Whether authentication is required
      rate_limit:
        range: integer
        description: Requests per minute limit

  UserInterface:
    is_a: Interface
    description: User-facing interface
    attributes:
      ui_type:
        range: UserInterfaceType
        description: Type of user interface
      screens:
        range: Screen
        multivalued: true
        inlined_as_list: true
        description: Screens in this interface

  Screen:
    is_a: UserInterface
    description: A single screen or view in a user interface
    slots:
      - offers_operations
    attributes:
      route:
        range: string
        description: URL route or navigation path

  ProgrammaticInterface:
    is_a: Interface
    description: Machine-to-machine interface
    slots:
      - has_endpoints
    attributes:
      api_type:
        range: APIType
        description: Type of API
      base_url:
        range: URI
        description: Base URL for the API
    slot_usage:
      has_endpoints:
        inlined_as_list: true

  EventInterface:
    is_a: Interface
    description: Event-driven interface
    slots:
      - has_subscriptions
    attributes:
      event_type:
        range: EventInterfaceType
        description: Type of event interface
      topics:
        range: string
        multivalued: true
        description: Event topics or channels

  # ---------------------------------------------------------------------------
  # Service
  # ---------------------------------------------------------------------------
  Service:
    is_a: NamedEntity
    description: >-
      An independently deployable runtime unit
    slots:
      - exposes_endpoints
      - depends_on_service
      - depended_on_by_service
      - deployed_as
    attributes:
      service_type:
        range: ServiceType
        description: Type of service
      health_checks:
        range: HealthCheck
        multivalued: true
        inlined_as_list: true
        description: Health check definitions
      emits_metrics:
        range: Metric
        multivalued: true
        description: Metrics emitted
    slot_usage:
      exposes_endpoints:
        inlined_as_list: true

  Endpoint:
    is_a: NamedEntity
    description: >-
      A specific addressable entry point on a service
    slots:
      - exposed_by_service
      - belongs_to_interface
    attributes:
      path:
        range: string
        description: URL path or route
      method:
        range: string
        description: HTTP method or operation type
      operations:
        range: Operation
        multivalued: true
        description: Operations at this endpoint
      protocol:
        range: ProtocolType
        description: Communication protocol
      port:
        range: integer
        description: Port number

  # ---------------------------------------------------------------------------
  # Dependency
  # ---------------------------------------------------------------------------
  Dependency:
    is_a: NamedEntity
    description: >-
      A required relationship between components or services
    attributes:
      dependency_type:
        range: DependencyType
        description: Type of dependency
      target:
        range: NamedEntity
        description: Target of the dependency
      version_constraint:
        range: string
        description: Version constraint expression
      is_optional:
        range: boolean
        description: Whether this dependency is optional

  # =============================================================================
  # SECTION 2: ACTORS AND IDENTITY
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Actor
  # ---------------------------------------------------------------------------
  Actor:
    is_a: NamedEntity
    abstract: true
    description: >-
      Any entity that can initiate actions
    slots:
      - has_identities
    attributes:
      category:
        range: ActorCategory
        description: Actor category

  HumanActor:
    is_a: Actor
    description: A human user of the system
    attributes:
      actor_type:
        range: HumanActorType
        description: Type of human actor
      email:
        range: string
        description: Contact email

  SystemActor:
    is_a: Actor
    description: A system or automated actor
    attributes:
      actor_type:
        range: SystemActorType
        description: Type of system actor
      service_account:
        range: string
        description: Service account identifier

  # ---------------------------------------------------------------------------
  # Identity
  # ---------------------------------------------------------------------------
  Identity:
    is_a: NamedEntity
    description: >-
      A verified representation of an actor
    slots:
      - has_roles
      - belongs_to_tenant
      - member_of_organizations
    attributes:
      identity_type:
        range: string
        description: Type of identity (user, service, device)
      credentials:
        range: Credential
        multivalued: true
        inlined_as_list: true
        description: Associated credentials

  Credential:
    is_a: NamedEntity
    description: >-
      Authentication material proving an identity claim
    attributes:
      credential_type:
        range: CredentialType
        description: Type of credential
      expires_at:
        range: Timestamp
        description: Expiration timestamp
      is_active:
        range: boolean
        description: Whether the credential is active

  # ---------------------------------------------------------------------------
  # Tenant and Organization
  # ---------------------------------------------------------------------------
  Tenant:
    is_a: NamedEntity
    description: >-
      An organizational boundary for multi-tenant systems
    attributes:
      organizations:
        range: Organization
        multivalued: true
        inlined_as_list: true
        description: Organizations within this tenant
      settings:
        range: Configuration
        multivalued: true
        description: Tenant-specific configuration

  Organization:
    is_a: NamedEntity
    description: >-
      A logical grouping of users and resources within a tenant
    attributes:
      parent:
        range: Organization
        description: Parent organization for hierarchical structures
      children:
        range: Organization
        multivalued: true
        description: Child organizations

  # =============================================================================
  # SECTION 3: AUTHORIZATION AND POLICY
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Role
  # ---------------------------------------------------------------------------
  Role:
    is_a: NamedEntity
    description: >-
      A named collection of permissions assignable to actors
    slots:
      - grants_permissions
      - assigned_to_identities
      - inherits_from_role
    attributes:
      is_system_role:
        range: boolean
        description: Whether this is a built-in system role

  # ---------------------------------------------------------------------------
  # Permission
  # ---------------------------------------------------------------------------
  Permission:
    is_a: NamedEntity
    description: >-
      A specific allowed action on a resource type or instance
    slots:
      - allows_actions
      - granted_by_roles
      - applies_to_resource_types
      - limited_by_scope
    attributes:
      constraints:
        range: Constraint
        multivalued: true
        inlined_as_list: true
        description: Conditions for this permission

  # ---------------------------------------------------------------------------
  # Policy
  # ---------------------------------------------------------------------------
  Policy:
    is_a: NamedEntity
    description: >-
      A rule set governing access decisions
    slots:
      - evaluates_permissions
    attributes:
      policy_type:
        range: PolicyType
        description: Type of policy
      rules:
        range: Rule
        multivalued: true
        inlined_as_list: true
        description: Rules within this policy
      priority:
        range: integer
        description: Evaluation priority

  # ---------------------------------------------------------------------------
  # Scope
  # ---------------------------------------------------------------------------
  Scope:
    is_a: NamedEntity
    description: >-
      A boundary limiting where a permission applies
    attributes:
      scope_type:
        range: ScopeType
        description: Type of scope
      resource_pattern:
        range: string
        description: Pattern matching resources in scope

  # ---------------------------------------------------------------------------
  # Constraint
  # ---------------------------------------------------------------------------
  Constraint:
    is_a: NamedEntity
    description: >-
      A condition that must be satisfied for authorization
    attributes:
      constraint_type:
        range: ConstraintType
        description: Type of constraint
      expression:
        range: string
        description: Constraint expression
      parameters:
        range: string
        multivalued: true
        description: Constraint parameters

  # =============================================================================
  # SECTION 4: DOMAIN MODELING
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Aggregate
  # ---------------------------------------------------------------------------
  Aggregate:
    is_a: NamedEntity
    description: >-
      A cluster of domain entities treated as a single transactional unit.
      Corresponds to DDD aggregate concept.
    slots:
      - aggregates_entities
      - has_root_entity
      - enforced_by_invariant_rules
      - persisted_in_stores
    attributes:
      value_objects:
        range: ValueObject
        multivalued: true
        inlined_as_list: true
        description: Value objects within the aggregate
    slot_usage:
      aggregates_entities:
        inlined_as_list: true

  # ---------------------------------------------------------------------------
  # DomainEntity
  # ---------------------------------------------------------------------------
  DomainEntity:
    is_a: NamedEntity
    mixins:
      - Auditable
    description: >-
      A uniquely identifiable object within the domain
    slots:
      - aggregated_by
      - exposes_as_resource
      - governed_by_lifecycle
      - in_state
      - governed_by_rules
    attributes:
      attributes:
        range: Attribute
        multivalued: true
        inlined_as_list: true
        description: Attributes of this entity
      classifications:
        range: DataClassificationType
        multivalued: true
        description: Data classifications applied

  # ---------------------------------------------------------------------------
  # ValueObject
  # ---------------------------------------------------------------------------
  ValueObject:
    is_a: NamedEntity
    description: >-
      An immutable domain object defined by its attributes
    attributes:
      attributes:
        range: Attribute
        multivalued: true
        inlined_as_list: true
        description: Attributes defining this value object

  # ---------------------------------------------------------------------------
  # Attribute
  # ---------------------------------------------------------------------------
  Attribute:
    is_a: NamedEntity
    description: >-
      A named property of an entity or value object
    slots:
      - validated_by_rules
    attributes:
      category:
        range: AttributeCategory
        description: Attribute category
      data_type:
        range: string
        required: true
        description: Data type of the attribute
      is_identifier:
        range: boolean
        description: Whether this is an identifier
      is_indexed:
        range: boolean
        description: Whether this attribute is indexed
      default_value:
        range: string
        description: Default value
      classification:
        range: DataClassificationType
        description: Data classification

  # ---------------------------------------------------------------------------
  # Resource and ResourceType
  # ---------------------------------------------------------------------------
  Resource:
    is_a: NamedEntity
    description: >-
      A domain entity or value object exposed for external interaction
    slots:
      - represents_entity
      - classified_as_type

  ResourceType:
    is_a: NamedEntity
    description: >-
      A classification of resources sharing common structure and behavior
    slots:
      - structured_by_schema

  # ---------------------------------------------------------------------------
  # State and Lifecycle
  # ---------------------------------------------------------------------------
  State:
    is_a: NamedEntity
    description: >-
      A discrete condition in an entity's lifecycle
    slots:
      - allows_actions_in_state
    attributes:
      is_initial:
        range: boolean
        description: Whether this is the initial state
      is_terminal:
        range: boolean
        description: Whether this is a terminal state

  Transition:
    is_a: NamedEntity
    description: >-
      A valid movement between states
    slots:
      - transitions_from_state
      - transitions_to_state
      - triggered_by_events
      - guarded_by_rules
      - executes_actions_on_transition

  Lifecycle:
    is_a: NamedEntity
    description: >-
      The complete set of states and transitions for an entity type
    slots:
      - starts_with_state
    attributes:
      states:
        range: State
        multivalued: true
        inlined_as_list: true
        description: States in this lifecycle
      transitions:
        range: Transition
        multivalued: true
        inlined_as_list: true
        description: Transitions between states

  # =============================================================================
  # SECTION 5: BEHAVIOR AND WORKFLOW
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Action
  # ---------------------------------------------------------------------------
  Action:
    is_a: NamedEntity
    abstract: true
    description: >-
      An atomic operation that can be performed
    slots:
      - allowed_by_permissions
      - performed_by_actor
      - targets_resources
      - emits_events_from_action
      - validated_by_action_rules
      - executes_in_transaction
    attributes:
      category:
        range: ActionCategory
        description: Action category

  Query:
    is_a: Action
    description: A read-only action that retrieves data
    attributes:
      filters:
        range: string
        multivalued: true
        description: Query filters
      projections:
        range: string
        multivalued: true
        description: Fields to return

  Command:
    is_a: Action
    description: An action that changes system state
    attributes:
      command_type:
        range: CommandType
        description: Type of command
      idempotency_key:
        range: string
        description: Key for idempotent execution

  # ---------------------------------------------------------------------------
  # Operation
  # ---------------------------------------------------------------------------
  Operation:
    is_a: NamedEntity
    description: >-
      A named, invocable unit of behavior exposed via an interface
    slots:
      - exposed_by_component
      - executes_operation_actions
      - accepts_input_schema
      - produces_output_schema
    attributes:
      errors:
        range: string
        multivalued: true
        description: Possible error responses

  # ---------------------------------------------------------------------------
  # Workflow
  # ---------------------------------------------------------------------------
  Workflow:
    is_a: NamedEntity
    description: >-
      A coordinated sequence of actions achieving a business goal
    slots:
      - triggered_by_workflow_events
    attributes:
      workflow_type:
        range: WorkflowType
        description: Type of workflow
      steps:
        range: Step
        multivalued: true
        inlined_as_list: true
        description: Steps in the workflow

  Step:
    is_a: NamedEntity
    description: >-
      A discrete stage within a workflow
    slots:
      - executes_actions_in_step
      - followed_by_steps
      - compensated_by_step
    attributes:
      order:
        range: integer
        description: Execution order
      condition:
        range: string
        description: Condition for execution
      timeout_seconds:
        range: integer
        description: Step timeout

  # ---------------------------------------------------------------------------
  # Rule
  # ---------------------------------------------------------------------------
  Rule:
    is_a: NamedEntity
    description: >-
      A declarative constraint or trigger governing behavior
    attributes:
      category:
        range: RuleCategory
        description: Rule category
      condition:
        range: string
        description: Rule condition expression
      action:
        range: string
        description: Action when rule fires
      priority:
        range: integer
        description: Evaluation priority
      is_active:
        range: boolean
        description: Whether rule is active

  # ---------------------------------------------------------------------------
  # Event and Subscription
  # ---------------------------------------------------------------------------
  Event:
    is_a: NamedEntity
    description: >-
      A notification that something occurred
    slots:
      - emitted_by_component
      - event_structured_by_schema
    attributes:
      category:
        range: EventCategory
        description: Event category
      correlation_id:
        range: string
        description: Correlation identifier

  DomainEvent:
    is_a: Event
    description: A significant occurrence in the domain
    slots:
      - produced_by_aggregate

  IntegrationEvent:
    is_a: Event
    description: An event for cross-service communication
    slots:
      - targeted_at_services

  Subscription:
    is_a: NamedEntity
    description: >-
      A registration to receive events of a certain type
    slots:
      - subscribes_to_event_types
      - subscribed_by_actor
    attributes:
      filter:
        range: string
        description: Filter expression
      delivery_mode:
        range: string
        description: Delivery mode (push, pull, etc.)

  # ---------------------------------------------------------------------------
  # Transaction
  # ---------------------------------------------------------------------------
  Transaction:
    is_a: NamedEntity
    description: >-
      A unit of work with ACID or BASE guarantees
    attributes:
      transaction_type:
        range: TransactionType
        description: Type of transaction
      isolation_level:
        range: string
        description: Transaction isolation level
      timeout_seconds:
        range: integer
        description: Transaction timeout

  # =============================================================================
  # SECTION 6: DATA MANAGEMENT
  # =============================================================================

  # ---------------------------------------------------------------------------
  # DataStore
  # ---------------------------------------------------------------------------
  DataStore:
    is_a: NamedEntity
    description: >-
      A persistence mechanism
    slots:
      - hosted_on_infrastructure
    attributes:
      store_type:
        range: DataStoreType
        description: Type of data store
      connection_string:
        range: string
        description: Connection configuration
      collections:
        range: Collection
        multivalued: true
        inlined_as_list: true
        description: Collections/tables in this store

  # ---------------------------------------------------------------------------
  # Collection and Record
  # ---------------------------------------------------------------------------
  Collection:
    is_a: NamedEntity
    description: >-
      A logical grouping of records (table, collection, bucket)
    slots:
      - collection_structured_by_schema
      - governed_by_retention_policy
    attributes:
      indexes:
        range: string
        multivalued: true
        description: Index definitions

  Record:
    is_a: NamedEntity
    description: >-
      A single persisted instance of data
    slots:
      - stored_in_collection
      - conforms_to_schema
      - has_lineage
    attributes:
      classifications:
        range: DataClassificationType
        multivalued: true
        description: Data classifications

  # ---------------------------------------------------------------------------
  # Schema
  # ---------------------------------------------------------------------------
  Schema:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      The structural definition of stored data
    attributes:
      schema_type:
        range: SchemaType
        description: Type of schema
      definition:
        range: string
        description: Schema definition (JSON Schema, DDL, etc.)
      versions:
        range: SchemaVersion
        multivalued: true
        inlined_as_list: true
        description: Schema versions

  SchemaVersion:
    is_a: Schema
    description: >-
      A specific iteration of a schema
    attributes:
      version:
        range: SemanticVersion
        description: Version number
      definition:
        range: string
        description: Schema definition at this version
      migration_script:
        range: string
        description: Migration from previous version
      is_backward_compatible:
        range: boolean
        description: Whether backward compatible

  # ---------------------------------------------------------------------------
  # Data Classification and Retention
  # ---------------------------------------------------------------------------
  DataClassification:
    is_a: NamedEntity
    description: >-
      A sensitivity or handling category
    attributes:
      classification_type:
        range: DataClassificationType
        description: Classification type
      handling_requirements:
        range: string
        multivalued: true
        description: Required handling procedures
      encryption_required:
        range: boolean
        description: Whether encryption is required

  RetentionPolicy:
    is_a: NamedEntity
    description: >-
      Rules governing data lifecycle and deletion
    attributes:
      retention_days:
        range: integer
        description: Days to retain data
      archive_after_days:
        range: integer
        description: Days before archiving
      deletion_strategy:
        range: string
        description: How data is deleted

  DataLineage:
    is_a: NamedEntity
    description: >-
      The origin, transformation history, and movement of data
    slots:
      - derived_from_records
    attributes:
      source:
        range: string
        description: Original data source
      transformations:
        range: string
        multivalued: true
        description: Transformations applied

  # ---------------------------------------------------------------------------
  # Audit
  # ---------------------------------------------------------------------------
  AuditLog:
    is_a: NamedEntity
    description: >-
      A tamper-evident record of system activities
    slots:
      - auditlog_governed_by_retention
    attributes:
      entries:
        range: AuditEntry
        multivalued: true
        description: Audit entries

  AuditEntry:
    is_a: AuditLog
    description: >-
      A single record within an audit log
    slots:
      - audit_performed_by_actor
      - records_action
      - affects_resource
    attributes:
      timestamp:
        range: Timestamp
        required: true
        description: When the event occurred
      outcome:
        range: string
        description: Result of the action
      details:
        range: string
        description: Additional details

  # =============================================================================
  # SECTION 7: INTEGRATION
  # =============================================================================

  # ---------------------------------------------------------------------------
  # External System
  # ---------------------------------------------------------------------------
  ExternalSystem:
    is_a: NamedEntity
    description: >-
      A system outside this system's boundary
    slots:
      - integrated_via
    attributes:
      system_type:
        range: ExternalSystemType
        description: Type of external system
      owner:
        range: string
        description: System owner
      sla:
        range: string
        description: Service level agreement
      documentation_url:
        range: URI
        description: API documentation URL

  # ---------------------------------------------------------------------------
  # Integration
  # ---------------------------------------------------------------------------
  Integration:
    is_a: NamedEntity
    description: >-
      A configured connection to an external system
    slots:
      - integrates_with_system
      - uses_adapter
      - protected_by_breaker
      - integration_governed_by_contract
    attributes:
      integration_type:
        range: IntegrationType
        description: Type of integration
      protocol:
        range: ProtocolType
        description: Communication protocol
      messages:
        range: Message
        multivalued: true
        inlined_as_list: true
        description: Messages exchanged

  # ---------------------------------------------------------------------------
  # Message
  # ---------------------------------------------------------------------------
  Message:
    is_a: NamedEntity
    description: >-
      A unit of data exchanged in integration
    slots:
      - message_structured_by_schema
      - validated_by_contract
    attributes:
      message_type:
        range: MessageType
        description: Type of message

  # ---------------------------------------------------------------------------
  # Contract
  # ---------------------------------------------------------------------------
  Contract:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A formal specification of integration behavior
    attributes:
      contract_type:
        range: ContractType
        description: Type of contract
      definition:
        range: string
        description: Contract definition
      versions:
        range: ContractVersion
        multivalued: true
        inlined_as_list: true
        description: Contract versions

  ContractVersion:
    is_a: Contract
    description: >-
      A specific iteration of a contract
    attributes:
      version:
        range: SemanticVersion
        description: Version number
      definition:
        range: string
        description: Contract at this version
      breaking_changes:
        range: string
        multivalued: true
        description: Breaking changes from previous

  # ---------------------------------------------------------------------------
  # Adapter and Circuit Breaker
  # ---------------------------------------------------------------------------
  Adapter:
    is_a: Component
    description: >-
      A component that translates between system and external protocols
    attributes:
      source_protocol:
        range: ProtocolType
        description: Source protocol
      target_protocol:
        range: ProtocolType
        description: Target protocol
      transformation:
        range: string
        description: Data transformation logic

  CircuitBreaker:
    is_a: NamedEntity
    description: >-
      A resilience pattern preventing cascade failures
    attributes:
      failure_threshold:
        range: integer
        description: Failures before opening
      reset_timeout_seconds:
        range: integer
        description: Seconds before half-open
      half_open_requests:
        range: integer
        description: Requests allowed in half-open

  # =============================================================================
  # SECTION 8: DEPLOYMENT AND OPERATIONS
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Environment
  # ---------------------------------------------------------------------------
  Environment:
    is_a: NamedEntity
    description: >-
      A runtime context with specific configuration
    slots:
      - hosts_deployments
      - env_configured_by
      - uses_infrastructure
    attributes:
      environment_type:
        range: EnvironmentType
        description: Type of environment

  # ---------------------------------------------------------------------------
  # Deployment
  # ---------------------------------------------------------------------------
  Deployment:
    is_a: NamedEntity
    description: >-
      An instance of a service running in an environment
    slots:
      - deploys_service
      - deployed_in_environment
      - deploys_unit
      - deployment_configured_by
      - deploys_release
    attributes:
      replicas:
        range: integer
        description: Number of replicas

  DeploymentUnit:
    is_a: NamedEntity
    description: >-
      The packaged artifact being deployed
    attributes:
      unit_type:
        range: DeploymentUnitType
        description: Type of deployment unit
      artifact_uri:
        range: URI
        description: Location of the artifact
      checksum:
        range: string
        description: Artifact checksum

  # ---------------------------------------------------------------------------
  # Configuration
  # ---------------------------------------------------------------------------
  Configuration:
    is_a: NamedEntity
    description: >-
      Runtime parameters for a deployment
    attributes:
      config_type:
        range: ConfigurationType
        description: Type of configuration
      value:
        range: string
        description: Configuration value
      is_secret:
        range: boolean
        description: Whether this is sensitive
      source:
        range: string
        description: Configuration source

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  Infrastructure:
    is_a: NamedEntity
    description: >-
      The underlying compute, storage, and network resources
    attributes:
      infra_type:
        range: InfrastructureType
        description: Type of infrastructure
      provider:
        range: string
        description: Cloud or infrastructure provider
      region:
        range: string
        description: Geographic region
      specifications:
        range: string
        description: Resource specifications

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  Release:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A versioned, deployable package of changes
    attributes:
      version:
        range: SemanticVersion
        description: Release version
      changelog:
        range: string
        description: Release notes
      artifacts:
        range: DeploymentUnit
        multivalued: true
        description: Deployment artifacts

  # =============================================================================
  # SECTION 9: OBSERVABILITY
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Metric
  # ---------------------------------------------------------------------------
  Metric:
    is_a: NamedEntity
    description: >-
      A quantitative measurement over time
    slots:
      - metric_emitted_by_component
    attributes:
      metric_type:
        range: MetricType
        description: Type of metric
      unit:
        range: string
        description: Unit of measurement
      labels:
        range: string
        multivalued: true
        description: Metric labels

  # ---------------------------------------------------------------------------
  # Log
  # ---------------------------------------------------------------------------
  Log:
    is_a: NamedEntity
    description: >-
      A timestamped record of discrete events
    slots:
      - log_governed_by_retention
    attributes:
      log_type:
        range: LogType
        description: Type of log
      entries:
        range: LogEntry
        multivalued: true
        description: Log entries

  LogEntry:
    is_a: Log
    description: >-
      A single record within a log
    attributes:
      timestamp:
        range: Timestamp
        description: Entry timestamp
      level:
        range: string
        description: Log level
      message:
        range: string
        description: Log message
      context:
        range: string
        description: Additional context

  # ---------------------------------------------------------------------------
  # Trace
  # ---------------------------------------------------------------------------
  Trace:
    is_a: NamedEntity
    description: >-
      A causal chain of operations across services
    slots:
      - starts_with_span
    attributes:
      trace_id:
        range: string
        description: Unique trace identifier
      spans:
        range: Span
        multivalued: true
        inlined_as_list: true
        description: Spans in this trace

  Span:
    is_a: Trace
    description: >-
      A single unit of work within a trace
    slots:
      - child_of_span
    attributes:
      span_id:
        range: string
        description: Unique span identifier
      operation_name:
        range: string
        description: Operation being traced
      start_time:
        range: Timestamp
        description: Start timestamp
      end_time:
        range: Timestamp
        description: End timestamp
      status:
        range: string
        description: Span status
      attributes:
        range: string
        multivalued: true
        description: Span attributes

  # ---------------------------------------------------------------------------
  # Alert
  # ---------------------------------------------------------------------------
  Alert:
    is_a: NamedEntity
    description: >-
      A notification triggered by metric thresholds or anomalies
    slots:
      - triggered_by_rule
    attributes:
      severity:
        range: string
        description: Alert severity
      triggered_at:
        range: Timestamp
        description: When triggered
      acknowledged_at:
        range: Timestamp
        description: When acknowledged
      resolved_at:
        range: Timestamp
        description: When resolved

  AlertRule:
    is_a: Rule
    description: >-
      The condition that triggers an alert
    slots:
      - monitors_metrics
    attributes:
      condition:
        range: string
        description: Alert condition expression
      threshold:
        range: float
        description: Threshold value
      duration_seconds:
        range: integer
        description: Duration before alerting
      notification_channels:
        range: string
        multivalued: true
        description: Where to send alerts

  # ---------------------------------------------------------------------------
  # Incident
  # ---------------------------------------------------------------------------
  Incident:
    is_a: NamedEntity
    description: >-
      A tracked degradation or outage event
    slots:
      - escalated_from_alerts
      - affects_services
    attributes:
      severity:
        range: string
        description: Incident severity
      status:
        range: string
        description: Current status
      started_at:
        range: Timestamp
        description: Incident start time
      resolved_at:
        range: Timestamp
        description: Resolution time
      root_cause:
        range: string
        description: Root cause analysis
      postmortem_url:
        range: URI
        description: Link to postmortem

  # ---------------------------------------------------------------------------
  # Health Check
  # ---------------------------------------------------------------------------
  HealthCheck:
    is_a: NamedEntity
    description: >-
      A probe verifying service availability
    attributes:
      check_type:
        range: HealthCheckType
        description: Type of health check
      endpoint:
        range: string
        description: Health check endpoint
      interval_seconds:
        range: integer
        description: Check interval
      timeout_seconds:
        range: integer
        description: Check timeout
      success_threshold:
        range: integer
        description: Successes before healthy
      failure_threshold:
        range: integer
        description: Failures before unhealthy

  # =============================================================================
  # SECTION 10: GOVERNANCE AND COMPLIANCE
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Compliance Requirement
  # ---------------------------------------------------------------------------
  ComplianceRequirement:
    is_a: NamedEntity
    description: >-
      A regulatory or policy obligation
    attributes:
      framework:
        range: ComplianceFramework
        description: Compliance framework
      controls:
        range: Control
        multivalued: true
        inlined_as_list: true
        description: Controls implementing this requirement
      effective_date:
        range: Timestamp
        description: When requirement became effective

  # ---------------------------------------------------------------------------
  # Control
  # ---------------------------------------------------------------------------
  Control:
    is_a: NamedEntity
    description: >-
      A measure implementing a compliance requirement
    slots:
      - owned_by_actor
    attributes:
      control_id:
        range: string
