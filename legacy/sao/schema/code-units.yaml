      service:
        description: "Service class."
      controller:
        description: Controller (MVC pattern)
      stored_procedure:
        description: "Database stored procedure package."
      function_package:
        description: PL/SQL or T-SQL package
      trigger:
        description: "Database trigger."
      view:
        description: Database view definition
      script:
        description: "Script module."
      batch_program:
        description: "Batch processing program."
      online_program:
        description: Online transaction program (CICS, IMS)
      copybook:
        description: COBOL copybook or include file
      composite:
        description: "Composite structure."
      other:
        description: "Other encapsulation types."
      rpg_module:
        description: "RPG module."
      rpg_service_program:
        description: "RPG service program."
      pli_procedure:
        description: "PL/I procedure."
      pli_package:
        description: "PL/I package."
      assembler_csect:
        description: Assembler control section

  CallableType:
