# TYPE DEFINITIONS
types:
  SemanticVersion:
    typeof: string
    description: Semantic version string (e.g., 1.2.3)
    pattern: "^\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9]+)?$"

  URI:
    typeof: uriorcurie
    description: Universal Resource Identifier

  Timestamp:
    typeof: datetime
    description: ISO 8601 timestamp

# CLASSES
classes:
  # ABSTRACT BASE CLASSES

  NamedEntity:
    abstract: true
    description: >-
      Abstract base class for all named entities in the ontology
    attributes:
      id:
        description: "Unique identifier."
        identifier: true
        range: string
        required: true
      name:
        description: "Human-readable name."
        range: string
        required: true
      description:
        description: "Free-text description."
        range: string
      tags:
        description: "Freeform tags."
        range: string
        multivalued: true
      metadata:
        description: "Created/updated timestamps and version."
        range: Metadata
        inlined: true

  Metadata:
    description: Common metadata for entities
    attributes:
      created_at:
        range: Timestamp
      updated_at:
        range: Timestamp
      created_by:
        range: string
      version:
        range: SemanticVersion

  Versionable:
    mixin: true
    description: Mixin for entities that support versioning
    attributes:
      version:
        description: "Semantic version."
        range: SemanticVersion
      effective_from:
        description: "Version start date."
        range: Timestamp
      effective_to:
        description: "Version end date."
        range: Timestamp
      is_current:
        description: "Whether this is the current version."
        range: boolean

  Auditable:
    mixin: true
    description: Mixin for entities requiring audit trails
    attributes:
      audit_log:
        range: AuditLog

  # SECTION 1: STRUCTURAL FOUNDATION

  System:
    comments:
      - "The system is the root entity that encapsulates its bounded contexts, integrations, policies, and compliance requirements."
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      Top-level container representing a software product, platform, or application
    attributes:
      contains_bounded_contexts:
        description: "Bounded contexts within the system."
        range: BoundedContext
        multivalued: true
        inlined_as_list: true
        inverse: contained_in_system
      has_integrations:
        description: "Integrations with external systems."
        range: Integration
        multivalued: true
        inverse: belongs_to_system
      enforces_policies:
        description: "Policies that govern access control."
        range: Policy
        multivalued: true
        inverse: enforced_by_system
      must_comply_with:
        description: "Compliance requirements the system must comply with."
        range: ComplianceRequirement
        multivalued: true
        inverse: applies_to_systems
      assessed_by:
        description: "Risk assessments for the system."
        range: RiskAssessment
        multivalued: true
        inverse: assesses_system
      exposes_interfaces:
        description: "Interfaces exposed to users and other systems."
        range: Interface
        multivalued: true
        inverse: exposed_by_system
      system_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_system

  BoundedContext:
    comments:
      - "Isolates domain models to prevent ambiguity and maintain consistency within a specific business domain or subdomain."
    is_a: NamedEntity
    description: >-
      A semantic boundary within which a domain model applies consistently.
      Corresponds to DDD bounded context concept.
    attributes:
      contained_in_system:
        description: "The parent system."
        range: System
        inverse: contains_bounded_contexts
      contains_modules:
        description: "Modules within this bounded context."
        range: Module
        multivalued: true
        inlined_as_list: true
        inverse: contained_in_context
      upstream_from:
        range: BoundedContext
        multivalued: true
        inverse: downstream_from
        description: Contexts upstream from this one (this context depends on them)
      downstream_from:
        description: "Bounded contexts that depend on this one."
        range: BoundedContext
        multivalued: true
        inverse: upstream_from
      contains_aggregates:
        description: "Aggregates within this bounded context."
        range: Aggregate
        multivalued: true
        inlined_as_list: true
        inverse: contained_in_bounded_context
      ubiquitous_language:
        range: string
        multivalued: true
        description: Key terms in the ubiquitous language for this context
      context_map_relationship:
        range: string
        description: Relationship pattern (e.g., Customer-Supplier, Partnership)
      architectural_patterns:
        range: ArchitecturalPatternType
        multivalued: true
      context_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_bounded_context

  Module:
    comments:
      - "Provides a logical grouping of related components that can be independently versioned and deployed."
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A deployable, cohesive unit of functionality within a bounded context
    attributes:
      contained_in_context:
        description: "The parent bounded context."
        range: BoundedContext
        inverse: contains_modules
      contains_components:
        description: "Components within this module."
        range: Component
        multivalued: true
        inlined_as_list: true
        inverse: contained_in_module
      depends_on_module:
        description: "Other modules this module depends on."
        range: Module
        multivalued: true
        inverse: depended_on_by_module
      depended_on_by_module:
        description: "Modules that depend on this module."
        range: Module
        multivalued: true
        inverse: depends_on_module
      provides_capabilities:
        description: "Capabilities offered by this module."
        range: Capability
        multivalued: true
        inverse: provided_by_modules
      runs_as_services:
        description: "Services that execute this module."
        range: Service
        multivalued: true
        inverse: runs_module
      has_dependencies:
        description: "List of module dependencies with types (runtime, build, optional, dev)."
        range: Dependency
        multivalued: true
      is_optional:
        description: "Whether the module is optional."
        range: boolean
      required_features:
        description: "Features needed to enable this module."
        range: string
        multivalued: true
      mapped_from_directory:
        range: StorageLocation
        inverse: maps_to_module
      module_tested_by_suites:
        description: "Test suites that test this module."
        range: TestSuite
        multivalued: true
        inverse: tests_module
      module_has_coverage:
        description: "Test coverage for this module."
        range: TestCoverage
        inverse: coverage_for_module
      module_managed_by_package_manager:
        description: "The package manager managing this module."
        range: PackageManager
        inverse: manages_dependencies_for_module
      module_has_dependencies:
        description: "Package dependencies."
        range: PackageDependency
        multivalued: true
        inverse: dependency_of_module
      architectural_patterns:
        range: ArchitecturalPatternType
        multivalued: true
      module_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_module

  Component:
    is_a: NamedEntity
    description: >-
      A logical building block within a module (class, function group, etc.)
    slots:
      - implemented_by_code
    attributes:
      contained_in_module:
        description: "The parent module."
        range: Module
        inverse: contains_components
      exposes_operations:
        description: "Operations that can be invoked on this component."
        range: Operation
        multivalued: true
        inverse: exposed_by_component
      emits_events:
        description: "Events produced by this component."
        range: Event
        multivalued: true
        inverse: emitted_by_component
      component_type:
        description: "Type of component, such as a class, service, or handler."
        range: string
      language:
        range: string
        description: Implementation language (DEPRECATED -- use written_in_language on CodeContainer)
      source_location:
        description: "Path to the source code."
        range: string
      has_dependencies:
        description: "Component-level dependencies."
        range: Dependency
        multivalued: true
      emits_metrics:
        description: "Metrics emitted by this component."
        range: Metric
        multivalued: true
      generates_logs:
        description: "Logs generated by this component."
        range: Log
        multivalued: true
      tested_by_suites:
        description: "Test suites that test this component."
        range: TestSuite
        multivalued: true
        inverse: tests_component
      has_coverage:
        description: "Test coverage for this component."
        range: TestCoverage
        inverse: coverage_for_component
      emits_metric:
        description: "Named metric link."
        range: Metric
        multivalued: true
        inverse: metric_emitted_by_component
      component_serves_model:
        description: "ML models served by this component."
        range: MLModel
        multivalued: true
        inverse: model_served_by_component
      component_uses_concurrency_pattern:
        description: "Concurrency patterns used by this component."
        range: ConcurrencyPattern
        multivalued: true
        inverse: pattern_used_by_component
      component_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_component

  # CODE STRUCTURE CLASSES

  CodeContainer:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A physical container of source code - may be a file, member in a library,
      or other storage unit depending on the platform.
    slots:
      - implements_component
      - contains_code_elements
    attributes:
      container_path:
        description: "Path or identifier for the container."
        range: string
        required: true
      container_type:
        description: "Type of container (source_file, library_member, copybook, script, etc.)."
        range: CodeContainerType
      format:
        range: string
        description: >-
          Format or language (DEPRECATED -- use written_in_language relationship)
      size_bytes:
        description: "Size in bytes."
        range: integer
      line_count:
        description: "Number of lines."
        range: integer
      encoding:
        description: "Character encoding."
        range: string
      checksum:
        description: "Content hash for version tracking."
        range: string
      contained_in_storage_location:
        description: "Parent directory or library."
        range: StorageLocation
        inverse: contains_containers
      contains_encapsulation_units:
        description: "Logical units defined in this file."
        range: EncapsulationUnit
        multivalued: true
      references_containers:
        description: "Containers this one references."
        range: CodeContainer
        multivalued: true
        inverse: referenced_by_containers
      referenced_by_containers:
        description: "Containers that reference this one."
        range: CodeContainer
        multivalued: true
        inverse: references_containers
      includes_definitions:
        description: "Included/copied definitions."
        range: CodeContainer
        multivalued: true
        inverse: included_in_containers
      included_in_containers:
        description: "Containers that include this one."
        range: CodeContainer
        multivalued: true
        inverse: includes_definitions
      has_references:
        description: "Import/include statements originating here."
        range: DefinitionReference
        multivalued: true
        inverse: referencing_container
      referenced_via:
        description: "Import/include statements targeting here."
        range: DefinitionReference
        multivalued: true
        inverse: referenced_container
      written_in_language:
        description: "Programming language."
        range: ProgrammingLanguage
        inverse: language_used_by_containers
      has_file_definitions:
        description: "FileDefinition[] associated with this container."
        range: FileDefinition
        multivalued: true
        inverse: file_defined_in_container
      has_screen_definitions:
        description: "ScreenDefinition[] associated with this container."
        range: ScreenDefinition
        multivalued: true
        inverse: screen_defined_in_container
      has_preprocessor_directives:
        description: "PreprocessorDirective[] associated with this container."
        range: PreprocessorDirective
        multivalued: true
        inverse: directive_defined_in_container
      contains_knowledge_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: stored_in_container

  StorageLocation:
    is_a: NamedEntity
    description: >-
      A logical or physical location for storing code containers.
    attributes:
      location_path:
        description: "Path or identifier."
        range: string
        required: true
      location_type:
        description: "Type (directory, library, package, namespace, module_path)."
        range: StorageLocationType
      has_parent_location:
        description: "Parent storage location (hierarchical)."
        range: StorageLocation
        inverse: contains_locations
      contains_locations:
        description: "Child storage locations."
        range: StorageLocation
        multivalued: true
        inverse: has_parent_location
      contains_containers:
        description: "Code containers in this location."
        range: CodeContainer
        multivalued: true
        inverse: contained_in_storage_location
      maps_to_module:
        description: "Corresponding architectural Module."
        range: Module
        inverse: mapped_from_directory

  EncapsulationUnit:
    is_a: NamedEntity
    abstract: true
    description: >-
      A logical boundary that groups related code and data.
      Maps to: Class (OOP), Program (COBOL), Module (functional),
      Package (Java), Namespace (C#), Record module (ML).
    slots:
      - defined_in_container
      - contains_data_elements
      - implements_component
      - annotated_by
      - imported_via
    attributes:
      encapsulation_type:
        description: "**Required.** The paradigm-specific type (see EncapsulationType enum)."
        range: EncapsulationType
        required: true
      visibility:
        description: "Visibility level (public, private, protected, internal, package)."
        range: VisibilityType
      is_reusable:
        description: "Whether designed for reuse."
        range: boolean
      is_abstract:
        description: "Whether this is abstract/incomplete."
        range: boolean
      is_final:
        range: boolean
      qualified_name:
        description: "Fully qualified name (e.g., com.example.UserService)."
        range: string
      line_start:
        description: "Starting line in source."
        range: integer
      line_end:
        description: "Ending line in source."
        range: integer
      stereotype:
        range: string
        description: Additional stereotype or pattern (e.g., Service, Repository, DTO)
      contains_callable_units:
        description: "Callable units (methods, functions, etc.) in this unit."
        range: CallableUnit
        multivalued: true
        inverse: contained_in_unit
      contains_data_structures:
        description: "Data structures in this unit."
        range: DataStructure
        multivalued: true
      extends_units:
        description: "Units this extends/inherits from."
        range: EncapsulationUnit
        multivalued: true
        inverse: extended_by_units
      extended_by_units:
        description: "Subclasses."
        range: EncapsulationUnit
        multivalued: true
        inverse: extends_units
      implements_contracts:
        description: "Contracts (interfaces) this implements."
        range: Contract
        multivalued: true
        inverse: implemented_by_units
      uses_definitions:
        description: "Definition references (imports, includes) used."
        range: DefinitionReference
        multivalued: true
      encapsulation_unit_renders_ui:
        description: "UI component link."
        range: UIComponent
        inverse: ui_implements_encapsulation_unit
      error_model_for_module:
        description: "ErrorModel associated with this unit."
        range: ErrorModel
        inverse: modules_using_error_model
      screen_used_by_programs:
        description: "ScreenDefinition[] used by this unit."
        range: ScreenDefinition
        multivalued: true
        inverse: program_uses_screens
      has_outgoing_ipc_connections:
        description: "IPCConnection[] originating from this unit."
        range: IPCConnection
        multivalued: true
        inverse: has_source_program
      has_incoming_ipc_connections:
        description: "IPCConnection[] targeting this unit."
        range: IPCConnection
        multivalued: true
        inverse: has_target_program
      affected_by_directives:
        description: "PreprocessorDirective[] affecting this unit."
        range: PreprocessorDirective
        multivalued: true
        inverse: directive_affects_encapsulation_units
      memory_model_for_module:
        description: "MemoryModel associated with this unit."
        range: MemoryModel
        inverse: modules_using_memory_model
      executed_by_job_steps:
        description: "JobStep[] that execute this unit."
        range: JobStep
        multivalued: true
        inverse: step_executes_program

  CallableUnit:
    is_a: NamedEntity
    description: >-
      A named, invocable unit of code that performs a specific task.
      Maps to: Method (OOP), Function (procedural/functional),
      Paragraph (COBOL), Procedure (SQL), Subroutine (Fortran),
      Lambda (functional).
    slots:
      - contained_in_unit
      - defined_in_container
      - annotated_by
      - imported_via
    attributes:
      callable_type:
        description: "**Required.** The paradigm-specific type (see CallableType enum)."
        range: CallableType
        required: true
      visibility:
        description: "Visibility level."
        range: VisibilityType
      callable_category:
        description: "`normal`, `operator`, or `main_entry`."
        range: CallableCategory
      return_type:
        description: "Return type (if applicable)."
        range: string
      is_async:
        description: "Whether this is asynchronous."
        range: boolean
      is_pure:
        range: boolean
        description: Whether function is pure (no side effects)
      is_static:
        description: "Whether this is static."
        range: boolean
      is_virtual:
        description: "Whether this is virtual/overridable."
        range: boolean
      is_override:
        description: "Overrides parent."
        range: boolean
      is_recursive:
        description: "Self-referencing."
        range: boolean
      is_inline:
        description: "Inline expansion."
        range: boolean
      calling_convention:
        description: "ABI calling convention."
        range: string
      line_start:
        description: "Starting line."
        range: integer
      line_end:
        description: "Ending line."
        range: integer
      entry_point_type:
        description: "If this is an entry point (main, constructor, handler, etc.)."
        range: EntryPointType
      documentation:
        description: "Docstring or comment."
        range: string
      complexity_score:
        range: integer
        description: Cyclomatic complexity or similar metric
      has_parameters:
        description: "Parameters of this callable."
        range: Parameter
        multivalued: true
        inverse: parameter_of
      invokes_callables:
        description: "Other callables invoked by this one."
        range: CallableUnit
        multivalued: true
        inverse: invoked_by_callables
      invoked_by_callables:
        description: "Inbound callers."
        range: CallableUnit
        multivalued: true
        inverse: invokes_callables
      accesses_data_elements:
        description: "Data elements accessed (read)."
        range: DataElement
        multivalued: true
      modifies_data_elements:
        description: "Data elements modified (written)."
        range: DataElement
        multivalued: true
      implements_operation:
        description: "Architectural Operation this implements."
        range: Operation
        inverse: implemented_by_callables
      raises_exceptions:
        range: string
        multivalued: true
        description: >-
          Exception names that may be raised (DEPRECATED -- use raises_exception_types)
      handles_exceptions:
        range: string
        multivalued: true
        description: >-
          Exception names handled (DEPRECATED -- use handles_exception_types)
      overrides_callable:
        description: "Callable in parent this overrides."
        range: CallableUnit
        inverse: overridden_by_callables
      overridden_by_callables:
        description: "Overriding children."
        range: CallableUnit
        multivalued: true
        inverse: overrides_callable
      contains_blocks:
        description: "Nested code blocks."
        range: CodeBlock
        multivalued: true
        inverse: contained_in_callable
      tested_by_cases:
        description: "Test cases."
        range: TestCase
        multivalued: true
        inverse: tests_callable
      uses_concurrency_primitives:
        description: "Locks, semaphores, etc."
        range: ConcurrencyPrimitive
        multivalued: true
        inverse: used_by_callables
      raises_exception_types:
        description: "ExceptionType[] that may be raised."
        range: ExceptionType
        multivalued: true
        inverse: raised_by_callables
      handles_exception_types:
        description: "ExceptionType[] that are handled."
        range: ExceptionType
        multivalued: true
        inverse: handled_by_callables
      has_return_type:
        description: "TypeExpression for the return type."
        range: TypeExpression
        inverse: return_type_of_callables
      uses_file_definitions:
        description: "FileDefinition[] used by this callable."
        range: FileDefinition
        multivalued: true
        inverse: used_by_callables
      has_file_operations:
        description: "FileOperation[] performed by this callable."
        range: FileOperation
        multivalued: true
        inverse: performed_in_callable
      callable_affected_by_directives:
        description: "PreprocessorDirective[] affecting this callable."
        range: PreprocessorDirective
        multivalued: true
        inverse: directive_affects_callables

  DataStructure:
    is_a: NamedEntity
    description: >-
      A composite data type grouping related data elements.
      Maps to: Struct (C), Record (Pascal/COBOL), Class data (OOP),
      Type (Haskell), Dictionary (Python), Hash (Ruby).
    slots:
      - contained_in_unit
      - defined_in_container
      - contains_data_elements
      - annotated_by
      - imported_via
    attributes:
      structure_type:
        description: "**Required.** The paradigm-specific type (see DataStructureType enum)."
        range: DataStructureType
        required: true
      structure_category:
        description: "`composite`, `collection`, `hierarchical`, `value_type`, `reference_type`, `union`."
        range: DataStructureCategory
      visibility:
        description: "Access level."
        range: VisibilityType
      is_mutable:
        description: "Whether data can be modified."
        range: boolean
      is_nested:
        description: "Whether nested inside another structure."
        range: boolean
      nesting_level:
        range: integer
        description: Nesting depth (for hierarchical structures like COBOL)
      is_packed:
        description: "Packed/compressed layout."
        range: boolean
      alignment:
        description: "Memory alignment in bytes."
        range: integer
      size_bytes:
        description: "Total size."
        range: integer
      is_serializable:
        description: "Whether this can be serialized."
        range: boolean
      persistence_type:
        description: "How this is persisted (transient, database, file, memory, cache)."
        range: PersistenceType
      line_start:
        description: "Starting line."
        range: integer
      line_end:
        description: "Ending line."
        range: integer
      has_parent_structure:
        description: "Parent structure (for nested structures)."
        range: DataStructure
        inverse: has_child_structures
      has_child_structures:
        description: "Child/nested structures."
        range: DataStructure
        multivalued: true
        inverse: has_parent_structure
      maps_to_domain_entity:
        description: "Domain entity this maps to."
        range: DomainEntity
        inverse: mapped_from_structure
      maps_to_value_object:
        description: "Value object this maps to."
        range: ValueObject
        inverse: mapped_from_structure_vo
      persisted_in_collection:
        description: "Collection where this is persisted."
        range: Collection
        inverse: persists_structures
      structure_contains_elements:
        description: "Fields in this structure."
        range: DataElement
        multivalued: true
        inverse: contained_in_structure
      passed_via_ipc:
        description: "IPCConnection[] through which this structure is passed."
        range: IPCConnection
        multivalued: true
        inverse: ipc_passes_data

  DataElement:
    is_a: NamedEntity
    description: >-
      An individual data field or variable.
      Maps to: Field (OOP), Variable (procedural), Column (database),
      Data item (COBOL), Property (C#), Attribute (Python).
    slots:
      - contained_in_unit
      - annotated_by
    attributes:
      data_type:
        range: string
        required: true
        description: >-
          Data type (DEPRECATED for typed analysis -- use declared_type)
      element_category:
        description: "Category of element (field, static_field, local_variable, parameter, constant, global_variable, computed, temporary)."
        range: DataElementCategory
      visibility:
        description: "Visibility level."
        range: VisibilityType
      is_constant:
        description: "Whether this is a constant/immutable."
        range: boolean
      is_nullable:
        description: "Whether this can be null."
        range: boolean
      default_value:
        description: "Default value."
        range: string
      size_specification:
        range: string
        description: Size/length specification (e.g., COBOL PIC, array dimensions)
      storage_class:
        description: "Storage class."
        range: StorageClass
      classification:
        description: "Data sensitivity (PII, PHI, PCI, etc.)."
        range: DataClassificationType
      line_number:
        description: "Source line number."
        range: integer
      contained_in_structure:
        description: "Data structure containing this element."
        range: DataStructure
        inverse: structure_contains_elements
      has_parent_element:
        description: "Parent element (for nested fields)."
        range: DataElement
        inverse: has_child_elements
      has_child_elements:
        description: "Children (nested fields)."
        range: DataElement
        multivalued: true
        inverse: has_parent_element
      maps_to_attribute:
        description: "Domain attribute."
        range: Attribute
        inverse: mapped_from_element
      protected_by_primitive:
        description: "Concurrency guards."
        range: ConcurrencyPrimitive
        multivalued: true
        inverse: protects_data_elements
      declared_type:
        description: "TypeExpression for the declared type."
        range: TypeExpression
        inverse: type_of_data_elements
      has_ownership_annotations:
        description: "OwnershipAnnotation[] for this element."
        range: OwnershipAnnotation
        multivalued: true
        inverse: annotates_data_element
      mapped_from_screen_fields:
        description: "ScreenField[] mapped to this element."
        range: ScreenField
        multivalued: true
        inverse: maps_to_data_element

  Parameter:
    is_a: DataElement
    description: >-
      An input/output parameter for a callable unit.
    attributes:
      direction:
        description: "Direction (range: `ParameterDirection`): `input`, `output`, `input_output`, `return`."
        range: ParameterDirection
      position:
        description: "Position in parameter list."
        range: integer
      passing_mechanism:
        description: "How passed (by_value, by_reference, by_name, by_result)."
        range: PassingMechanism
      parameter_of:
        description: "Owning callable."
        range: CallableUnit
        inverse: has_parameters
      has_type:
        description: "Structured type."
        range: TypeExpression
        inverse: type_of_parameters

  # Code Semantics
  CodeBlock:
    is_a: NamedEntity
    description: >-
      A logical grouping of statements within a callable unit.
    attributes:
      block_type:
        description: "Type (sequential, conditional, loop, try_catch, transaction, critical_section, scope)."
        range: CodeBlockType
      line_start:
        description: "Starting line."
        range: integer
      line_end:
        description: "Ending line."
        range: integer
      contained_in_callable:
        description: "Parent callable."
        range: CallableUnit
        inverse: contains_blocks
      contains_statements:
        description: "Statements in this block."
        range: Statement
        multivalued: true
        inverse: contained_in_block
      has_parent_block:
        description: "Parent block (nesting)."
        range: CodeBlock
        inverse: has_child_blocks
      has_child_blocks:
        description: "Child blocks (nesting)."
        range: CodeBlock
        multivalued: true
        inverse: has_parent_block

  Statement:
    is_a: NamedEntity
    description: >-
      A single executable instruction or declaration.
    attributes:
      statement_category:
        description: "Category (declaration, assignment, invocation, control_transfer, io_operation, data_manipulation, transaction_control, exception_handling)."
        range: StatementCategory
      line_number:
        description: "Source line number."
        range: integer
      is_conditional:
        description: "Whether conditional."
        range: boolean
      text:
        range: string
        description: Source text of statement
      contained_in_block:
        description: "Parent block."
        range: CodeBlock
        inverse: contains_statements
      operates_on_elements:
        description: "Data elements operated on."
        range: DataElement
        multivalued: true
      invokes_callable:
        description: "Callable invoked."
        range: CallableUnit
      transfers_control_to:
        description: "Control transfer target."
        range: Statement

  DefinitionReference:
    is_a: NamedEntity
    description: >-
      A reference from one code container to shared definitions.
      Maps to: Import (Python/Java), Include (C/C++), COPY (COBOL),
      Using (C#), Require (Ruby), Use (Rust).
    slots:
      - imports_symbols
    attributes:
      reference_type:
        description: "`import_module`, `import_symbol`, `include_source`, `inherit`, `implement`."
        range: ReferenceType
      reference_path:
        description: "Path or module name."
        range: string
      alias:
        description: "Import alias."
        range: string
      is_wildcard:
        description: "Wildcard import (e.g., `import *`)."
        range: boolean
      scope:
        description: "Import scope."
        range: string
      referencing_container:
        description: "Source container."
        range: CodeContainer
        inverse: has_references
      referenced_container:
        description: "Target container."
        range: CodeContainer
        inverse: referenced_via

  ControlFlow:
    is_a: NamedEntity
    description: >-
      Represents control flow between code elements.
    attributes:
      flow_type:
        description: "Type (call, async_call, branch, jump, return, throw, yield)."
        range: ControlFlowType
      is_conditional:
        description: "Whether flow is conditional."
        range: boolean
      condition:
        description: "Condition expression."
        range: string
      has_source_callable:
        description: "Source callable."
        range: CallableUnit
      has_target_callable:
        description: "Target callable."
        range: CallableUnit
      has_source_statement:
        description: "Source statement."
        range: Statement
      has_target_statement:
        description: "Target statement."
        range: Statement

  DataFlow:
    is_a: NamedEntity
    description: >-
      Represents data flow between code elements.
    attributes:
      flow_type:
        description: "Type (read, write, modify, define, use)."
        range: DataFlowType
      has_source_element:
        description: "Source data element."
        range: DataElement
      has_target_element:
        description: "Target data element."
        range: DataElement
      has_through_callable:
        description: "Callable where flow occurs."
        range: CallableUnit
      has_through_statement:
        description: "Statement where flow occurs."
        range: Statement

  # Platform-Specific Extensions
  PlatformExtension:
    is_a: NamedEntity
    abstract: true
    description: >-
      Base class for platform-specific extensions
    attributes:
      platform:
        description: "Platform identifier."
        range: string

  ExecutionEnvironmentDirective:
    is_a: PlatformExtension
    description: >-
      Platform-specific execution directives.
      Maps to: JCL (mainframe), Docker Compose, Kubernetes manifests,
      Shell scripts, Makefiles, build files.
    attributes:
      directive_type:
        description: "Type of directive."
        range: string
      configuration:
        description: "Configuration content."
        range: string
      orchestrates_units:
        description: "Units orchestrated."
        range: EncapsulationUnit
        multivalued: true
      defines_execution_order:
        description: "Execution ordering."
        range: CallableUnit
        multivalued: true
      allocates_resources:
        description: "Resources allocated."
        range: Infrastructure
        multivalued: true

  Annotation:
    is_a: NamedEntity
    description: >-
      Metadata attached to code elements.
      Maps to: Annotations (Java), Decorators (Python),
      Attributes (C#), Pragmas (C/C++), Compiler directives.
    slots:
      - annotates_element
      - affects_behavior_of
    attributes:
      annotation_syntax:
        description: "Syntax form (e.g., `@Override`, `#[derive(Debug)]`)."
        range: string
      parameters:
        description: "Annotation parameters."
        range: string
        multivalued: true

  Capability:
    comments:
      - "Represents what the system can do, abstracting the implementation details."
    is_a: NamedEntity
    description: >-
      A discrete business or technical ability the system provides
    attributes:
      realizes_features:
        description: "Features enabled by this capability."
        range: Feature
        multivalued: true
        inverse: realized_by_capabilities
      requires_permissions:
        description: "Permissions needed to use this capability."
        range: Permission
        multivalued: true
        inverse: required_by_capabilities
      provided_by_modules:
        description: "Modules providing this."
        range: Module
        multivalued: true
        inverse: provides_capabilities
      enables_features:
        description: "Features enabled by this capability."
        range: Feature
        multivalued: true
        inverse: enabled_by_capabilities

  Feature:
    comments:
      - "Represents functionality as perceived by end users or consumers of the system."
    is_a: NamedEntity
    description: >-
      A user-facing manifestation of one or more capabilities
    attributes:
      category:
        description: "Feature category: core, optional, experimental, or deprecated."
        range: FeatureCategory
      enabled_by_capabilities:
        description: "Capabilities that enable this feature."
        range: Capability
        multivalued: true
        inverse: enables_features
      controlled_by_configs:
        description: "Configurations that control feature availability."
        range: Configuration
        multivalued: true
        inverse: controls_features
      accessible_by_roles:
        description: "Roles that can access this feature."
        range: Role
        multivalued: true
        inverse: can_access_features
      realized_by_capabilities:
        description: "Capabilities realizing this feature."
        range: Capability
        multivalued: true
        inverse: realizes_features

  # Interfaces
  Interface:
    comments:
      - "Defines how actors and systems interact with the application."
    is_a: NamedEntity
    abstract: true
    description: >-
      A contract-defined boundary through which interaction occurs
    attributes:
      category:
        description: "Interface category: user interface, programmatic interface, or event interface."
        range: InterfaceCategory
      authentication_required:
        description: "Whether authentication is required."
        range: boolean
      rate_limit:
        description: "Requests per minute limit."
        range: integer
      defined_by_contract:
        description: "The contract specifying the interface."
        range: Contract
        inverse: defines_interfaces
      exposed_by_system:
        description: "System exposing this interface."
        range: System
        inverse: exposes_interfaces

  UserInterface:
    comments:
      - "User-facing interface for human interaction."
    is_a: Interface
    description: User-facing interface
    attributes:
      ui_type:
        description: "Type of user-facing interface."
        range: UserInterfaceType
      contains_screens:
        description: "Screens in this interface."
        range: Screen
        multivalued: true
        inverse: part_of_ui

  Screen:
    comments:
      - "Represents a specific UI view that offers operations to users."
    is_a: NamedEntity
    description: A single screen or view in a user interface
    attributes:
      route:
        description: "URL route or navigation path."
        range: string
      part_of_ui:
        description: "The user interface this screen belongs to."
        range: UserInterface
        inverse: contains_screens
      offers_operations:
        description: "Operations available on this screen."
        range: Operation
        multivalued: true
        inverse: offered_on_screens

  ProgrammaticInterface:
    comments:
      - "Machine-to-machine API interface."
    is_a: Interface
    description: Machine-to-machine interface
    attributes:
      api_type:
        description: "Type of machine-to-machine API interface."
        range: APIType
      base_url:
        description: "Base URL for the API."
        range: URI
      has_endpoints:
        description: "Endpoints belonging to this programmatic interface."
        range: Endpoint
        multivalued: true
        inlined_as_list: true
        inverse: belongs_to_interface

  EventInterface:
    comments:
      - "Event-driven asynchronous interface."
    is_a: Interface
    description: Event-driven interface
    attributes:
      event_type:
        description: "Type of event-driven interface."
        range: EventInterfaceType
      topics:
        description: "Event topics or channels."
        range: string
        multivalued: true
      has_subscriptions:
        description: "Subscriptions to this event interface."
        range: Subscription
        multivalued: true
        inverse: subscribes_to_interface

  # Service
  Service:
    comments:
      - "Represents a running process that exposes endpoints and can be deployed independently."
    is_a: NamedEntity
    description: >-
      An independently deployable runtime unit
    attributes:
      service_type:
        description: "Type of independently deployable runtime unit."
        range: ServiceType
      has_health_checks:
        description: "Health check definitions."
        range: HealthCheck
        multivalued: true
      emits_metrics:
        description: "Metrics emitted by the service."
        range: Metric
        multivalued: true
      exposes_endpoints:
        description: "Endpoints exposed by the service."
        range: Endpoint
        multivalued: true
        inlined_as_list: true
        inverse: exposed_by_service
      depends_on_service:
        description: "Services this service depends on."
        range: Service
        multivalued: true
        inverse: depended_on_by_service
      depended_on_by_service:
        description: "Services that depend on this one."
        range: Service
        multivalued: true
        inverse: depends_on_service
      deployed_as:
        description: "Deployments of this service."
        range: Deployment
        multivalued: true
        inverse: deploys_service
      runs_module:
        description: "Module this service runs."
        range: Module
        inverse: runs_as_services
      receives_integration_events:
        description: "Integration events received."
        range: IntegrationEvent
        multivalued: true
        inverse: targeted_at_services
      affected_by_incidents:
        description: "Incidents affecting this service."
        range: Incident
        multivalued: true
        inverse: affects_services
      service_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_service

  Endpoint:
    comments:
      - "Represents a concrete API endpoint or service entry point."
    is_a: NamedEntity
    description: >-
      A specific addressable entry point on a service
    attributes:
      path:
        description: "URL path or route."
        range: string
      method:
        description: "HTTP method or operation type."
        range: string
      has_operations:
        description: "Operations available at this endpoint."
        range: Operation
        multivalued: true
      protocol:
        description: "Communication protocol."
        range: ProtocolType
      port:
        description: "Port number."
        range: integer
      exposed_by_service:
        description: "The parent service."
        range: Service
        inverse: exposes_endpoints
      belongs_to_interface:
        description: "The programmatic interface this endpoint belongs to."
        range: ProgrammaticInterface
        inverse: has_endpoints

  Dependency:
    comments:
      - "Documents dependencies for build, deployment, and runtime management."
    is_a: NamedEntity
    description: >-
      A lightweight dependency reference between components or services
    attributes:
      dependency_type:
        description: "Type of dependency: runtime, build, optional, or dev."
        range: DependencyType
      has_target:
        description: "Target entity of the dependency."
        range: NamedEntity
      version_constraint:
        description: "Version constraint expression."
        range: string
      is_optional:
        description: "Whether the dependency is optional."
        range: boolean

  # SECTION 2: ACTORS AND IDENTITY

  Actor:
    comments:
      - "Provides a unified abstraction for both human users and automated systems that interact with the application."
    is_a: NamedEntity
    abstract: true
    description: >-
      Any entity that can initiate actions
    attributes:
      category:
        description: "Actor category (`human`, `system`)."
        range: ActorCategory
      has_identities:
        description: "One or more `Identity` entities associated with this actor."
        range: Identity
        multivalued: true
        inverse: represents_actor
      performs_actions:
        description: "`Action` entities performed by this actor."
        range: Action
        multivalued: true
        inverse: performed_by_actor
      audit_actions_performed:
        description: "`AuditEntry` entities recording actions by this actor."
        range: AuditEntry
        multivalued: true
        inverse: audit_performed_by_actor
      has_subscriptions:
        description: "`Subscription` entities owned by this actor."
        range: Subscription
        multivalued: true
        inverse: subscribed_by_actor
      owns_controls:
        description: "`Control` entities owned by this actor."
        range: Control
        multivalued: true
        inverse: owned_by_actor
      verifies_evidence:
        description: "`Evidence` entities verified by this actor."
        range: Evidence
        multivalued: true
        inverse: verified_by_actor

  HumanActor:
    is_a: Actor
    description: A human user of the system
    attributes:
      actor_type:
        description: "Type of human actor."
        range: HumanActorType
      email:
        description: "Contact email address."
        range: string

  SystemActor:
    is_a: Actor
    description: A system or automated actor
    attributes:
      actor_type:
        description: "Type of system actor."
        range: SystemActorType
      service_account:
        description: "Service account identifier."
        range: string

  Identity:
    comments:
      - "Represents the authenticated identity of an actor, which can have multiple roles and credentials."
    is_a: NamedEntity
    description: >-
      A verified representation of an actor
    attributes:
      identity_type:
        description: "Type of identity (user, service, device)."
        range: string
      has_credentials:
        description: "List of associated credentials."
        range: Credential
        multivalued: true
        inverse: credential_for_identity
      has_roles:
        description: "`Role` entities assigned to this identity."
        range: Role
        multivalued: true
        inverse: assigned_to_identities
      belongs_to_tenant:
        description: "The `Tenant` this identity belongs to."
        range: Tenant
        inverse: contains_identities
      member_of_organizations:
        description: "`Organization` entities this identity is a member of."
        range: Organization
        multivalued: true
        inverse: has_identity_members
      represents_actor:
        description: "The `Actor` this identity represents."
        range: Actor
        inverse: has_identities

  Credential:
    comments:
      - "Represents the means by which an identity can be authenticated."
    is_a: NamedEntity
    description: >-
      Authentication material proving an identity claim
    attributes:
      credential_type:
        description: "Type of credential."
        range: CredentialType
      expires_at:
        description: "Expiration timestamp."
        range: Timestamp
      is_active:
        description: "Whether the credential is currently active."
        range: boolean
      credential_for_identity:
        range: Identity
        inverse: has_credentials

  Tenant:
    comments:
      - "Isolates data and configuration for different customers or organizational units in a multi-tenant application."
    is_a: NamedEntity
    description: >-
      An organizational boundary for multi-tenant systems
    attributes:
      has_organizations:
        description: "List of organizations within this tenant."
        range: Organization
        multivalued: true
        inverse: organization_in_tenant
      has_settings:
        description: "Tenant-specific configuration."
        range: Configuration
        multivalued: true
        inverse: setting_for_tenant
      contains_identities:
        description: "`Identity` entities within this tenant."
        range: Identity
        multivalued: true
        inverse: belongs_to_tenant

  Organization:
    comments:
      - "Provides hierarchical organization structure within a tenant for managing users, permissions, and resources."
    is_a: NamedEntity
    description: >-
      A logical grouping of users and resources within a tenant
    attributes:
      has_parent:
        description: "Parent organization for hierarchical structures."
        range: Organization
        inverse: has_children
      has_children:
        description: "Child organizations."
        range: Organization
        multivalued: true
        inverse: has_parent
      has_identity_members:
        description: "`Identity` entities that are members of this organization."
        range: Identity
        multivalued: true
        inverse: member_of_organizations
      organization_in_tenant:
        range: Tenant
        inverse: has_organizations

  # SECTION 3: AUTHORIZATION AND POLICY

  Role:
    comments:
      - "Groups permissions into meaningful job functions or responsibilities that can be assigned to identities."
    is_a: NamedEntity
    description: >-
      A named collection of permissions assignable to actors
    attributes:
      is_system_role:
        description: "Whether this is a built-in system role."
        range: boolean
      grants_permissions:
        description: "`Permission` entities included in this role."
        range: Permission
        multivalued: true
        inverse: granted_by_roles
      assigned_to_identities:
        description: "`Identity` entities that have this role."
        range: Identity
        multivalued: true
        inverse: has_roles
      inherits_from_role:
        description: "Parent role for role hierarchy."
        range: Role
        inverse: inherited_by_roles
      inherited_by_roles:
        description: "Child roles that inherit from this role."
        range: Role
        multivalued: true
        inverse: inherits_from_role
      can_access_features:
        description: "`Feature` entities accessible to this role."
        range: Feature
        multivalued: true
        inverse: accessible_by_roles

  Permission:
    comments:
      - "Represents atomic units of access that can be granted or denied."
    is_a: NamedEntity
    description: >-
      A specific allowed action on a resource type or instance
    attributes:
      has_constraints:
        description: "List of conditions that must be satisfied."
        range: Constraint
        multivalued: true
      allows_actions:
        description: "`Action` entities permitted by this permission."
        range: Action
        multivalued: true
        inverse: allowed_by_permissions
      granted_by_roles:
        description: "`Role` entities that grant this permission."
        range: Role
        multivalued: true
        inverse: grants_permissions
      applies_to_resource_types:
        description: "`ResourceType` entities this permission governs."
        range: ResourceType
        multivalued: true
        inverse: governed_by_permissions
      limited_by_scope:
        description: "`Scope` entity defining boundaries."
        range: Scope
        inverse: limits_permissions
      required_by_capabilities:
        description: "`Capability` entities requiring this permission."
        range: Capability
        multivalued: true
        inverse: requires_permissions
      evaluated_by_policies:
        description: "`Policy` entities evaluating this permission."
        range: Policy
        multivalued: true
        inverse: evaluates_permissions

  Policy:
    comments:
      - "Implements complex authorization logic that cannot be expressed through simple role-permission mappings."
    is_a: NamedEntity
    description: >-
      A rule set governing access decisions
    attributes:
      policy_type:
        description: "Type of policy."
        range: PolicyType
      has_rules:
        description: "List of rules within this policy."
        range: Rule
        multivalued: true
      priority:
        description: "Evaluation priority (higher priority policies evaluated first)."
        range: integer
      evaluates_permissions:
        description: "`Permission` entities evaluated by this policy."
        range: Permission
        multivalued: true
        inverse: evaluated_by_policies
      enforced_by_system:
        description: "`System` that enforces this policy."
        range: System
        inverse: enforces_policies
      guards_routes:
        description: "`Route` entities guarded by this policy."
        range: Route
        multivalued: true
        inverse: route_guarded_by

  Scope:
    comments:
      - "Restricts permissions to specific contexts, reducing the blast radius of access grants."
    is_a: NamedEntity
    description: >-
      A boundary limiting where a permission applies
    attributes:
      scope_type:
        description: "Type of scope."
        range: ScopeType
      resource_pattern:
        description: "Pattern matching resources in scope (e.g., regex, glob)."
        range: string
      limits_permissions:
        description: "`Permission` entities limited by this scope."
        range: Permission
        multivalued: true
        inverse: limited_by_scope

  Constraint:
    comments:
      - "Adds contextual or temporal restrictions to permissions."
    is_a: NamedEntity
    description: >-
      A condition that must be satisfied for authorization
    attributes:
      constraint_type:
        description: "Type of constraint."
        range: ConstraintType
      expression:
        description: "Constraint expression (e.g., \"hour >= 9 AND hour <= 17\")."
        range: string
      parameters:
        description: "Constraint parameters."
        range: string
        multivalued: true

  # SECTION 4: DOMAIN MODELING

  Aggregate:
    comments:
      - "Enforces consistency boundaries and transactional integrity within the domain model."
    is_a: NamedEntity
    description: >-
      A cluster of domain entities treated as a single transactional unit.
      Corresponds to DDD aggregate concept.
    attributes:
      has_value_objects:
        description: "List of value objects within the aggregate."
        range: ValueObject
        multivalued: true
        inverse: belongs_to_aggregate
      aggregates_entities:
        description: "`DomainEntity` instances within this aggregate."
        range: DomainEntity
        multivalued: true
        inlined_as_list: true
        inverse: aggregated_by
      has_root_entity:
        description: "The root `DomainEntity` (required, single)."
        range: DomainEntity
        required: true
        inverse: is_root_of_aggregate
      enforced_by_invariant_rules:
        description: "`Rule` entities that enforce aggregate invariants."
        range: Rule
        multivalued: true
        inverse: enforces_aggregate_invariants
      persisted_in_stores:
        description: "`DataStore` entities where this aggregate is persisted."
        range: DataStore
        multivalued: true
        inverse: persists_aggregates
      contained_in_bounded_context:
        description: "Parent `BoundedContext`."
        range: BoundedContext
        inverse: contains_aggregates
      produces_domain_events:
        description: "`DomainEvent` entities produced."
        range: DomainEvent
        multivalued: true
        inverse: produced_by_aggregate
      aggregate_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_aggregate

  DomainEntity:
    comments:
      - "Represents business objects with distinct identity that persists over time."
    is_a: NamedEntity
    mixins:
      - Auditable
    description: >-
      A uniquely identifiable object within the domain
    attributes:
      attributes:
        description: "List of `Attribute` entities."
        range: Attribute
        multivalued: true
        inlined_as_list: true
      classifications:
        description: "Data classification types applied."
        range: DataClassificationType
        multivalued: true
      aggregated_by:
        description: "Parent `Aggregate`."
        range: Aggregate
        inverse: aggregates_entities
      exposes_as_resource:
        description: "`Resource` entities that expose this entity externally."
        range: Resource
        multivalued: true
        inverse: represents_entity
      governed_by_lifecycle:
        description: "`Lifecycle` defining valid states and transitions."
        range: Lifecycle
        inverse: governs_entities
      in_state:
        description: "Current `State` in the lifecycle."
        range: State
        inverse: current_for_entities
      governed_by_rules:
        description: "`Rule` entities governing this entity."
        range: Rule
        multivalued: true
        inverse: governs_domain_entities
      is_root_of_aggregate:
        description: "Aggregate for which this is the root entity."
        range: Aggregate
        inverse: has_root_entity
      mapped_from_structure:
        description: "Code structures."
        range: DataStructure
        multivalued: true
        inverse: maps_to_domain_entity
      has_outgoing_relationships:
        description: "`DomainRelationship` entities where this entity is the source."
        range: DomainRelationship
        multivalued: true
        inverse: has_source_entity
      has_incoming_relationships:
        description: "`DomainRelationship` entities where this entity is the target."
        range: DomainRelationship
        multivalued: true
        inverse: has_target_entity
      entity_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_domain_entity

  ValueObject:
    comments:
      - "Represents descriptive aspects of the domain with no conceptual identity."
    is_a: NamedEntity
    description: >-
      An immutable domain object defined by its attributes
    attributes:
      has_attributes:
        description: "List of `Attribute` entities defining the value object."
        range: Attribute
        multivalued: true
      mapped_from_structure_vo:
        description: "Back-reference to the `DataStructure` that maps to this value object."
        range: DataStructure
        multivalued: true
        inverse: maps_to_value_object
      belongs_to_aggregate:
        range: Aggregate
        inverse: has_value_objects

  Attribute:
    comments:
      - "Defines the data fields and their characteristics within domain objects."
    is_a: NamedEntity
    description: >-
      A named property of an entity or value object
    attributes:
      category:
        description: "`required`, `optional`, `computed`, `derived`, `transient`."
        range: AttributeCategory
      data_type:
        description: "Data type (string, integer, boolean, date, etc.)."
        range: string
        required: true
      is_identifier:
        description: "Whether this is an identifier attribute."
        range: boolean
      is_indexed:
        description: "Whether this attribute should be indexed."
        range: boolean
      default_value:
        description: "Default value if not specified."
        range: string
      classification:
        description: "Data classification (`public`, `internal`, `confidential`, `pii`, etc.)."
        range: DataClassificationType
      validated_by_rules:
        description: "`Rule` entities that validate this attribute."
        range: Rule
        multivalued: true
        inverse: validates_attributes
      mapped_from_element:
        description: "Back-reference to the `DataElement` that maps to this attribute."
        range: DataElement
        multivalued: true
        inverse: maps_to_attribute

  Resource:
    comments:
      - "Represents the external API representation of domain objects."
    is_a: NamedEntity
    description: >-
      A domain entity or value object exposed for external interaction
    attributes:
      represents_entity:
        description: "The `DomainEntity` this resource represents."
        range: DomainEntity
        inverse: exposes_as_resource
      classified_as_type:
        description: "`ResourceType` classification."
        range: ResourceType
        inverse: classifies_resources
      targeted_by_actions:
        description: "`Action` entities that can target this resource."
        range: Action
        multivalued: true
        inverse: targets_resources
      affected_in_audit:
        description: "Audit trail entries."
        range: AuditEntry
        multivalued: true
        inverse: affects_resource

  ResourceType:
    comments:
      - "Groups similar resources and defines their schema."
    is_a: NamedEntity
    description: >-
      A classification of resources sharing common structure and behavior
    attributes:
      structured_by_schema:
        description: "`Schema` defining the structure."
        range: Schema
        inverse: structures_resource_types
      classifies_resources:
        description: "`Resource` instances of this type."
        range: Resource
        multivalued: true
        inverse: classified_as_type
      governed_by_permissions:
        description: "`Permission` entities that apply."
        range: Permission
        multivalued: true
        inverse: applies_to_resource_types

  # State and Lifecycle
  State:
    comments:
      - "Represents a specific stage in an entity's lifecycle with allowed actions."
    is_a: NamedEntity
    description: >-
      A discrete condition in an entity's lifecycle
    attributes:
      is_initial:
        description: "Whether this is the initial state."
        range: boolean
      is_terminal:
        description: "Whether this is a final/terminal state."
        range: boolean
      allows_actions_in_state:
        description: "`Action` entities allowed in this state."
        range: Action
        multivalued: true
        inverse: allowed_in_states
      current_for_entities:
        description: "`DomainEntity` instances currently in this state."
        range: DomainEntity
        multivalued: true
        inverse: in_state
      source_of_transitions:
        description: "`Transition` entities starting from this state."
        range: Transition
        multivalued: true
        inverse: transitions_from_state
      target_of_transitions:
        description: "`Transition` entities ending in this state."
        range: Transition
        multivalued: true
        inverse: transitions_to_state
      initial_for_lifecycle:
        description: "Back-reference to the `Lifecycle` for which this is the initial state."
        range: Lifecycle
        inverse: starts_with_state

  Transition:
    comments:
      - "Defines allowed state changes and their conditions."
    is_a: NamedEntity
    description: >-
      A valid movement between states
    attributes:
      transitions_from_state:
        description: "Source `State` (required)."
        range: State
        required: true
        inverse: source_of_transitions
      transitions_to_state:
        description: "Target `State` (required)."
        range: State
        required: true
        inverse: target_of_transitions
      triggered_by_events:
        description: "`Event` entities that trigger this transition."
        range: Event
        multivalued: true
        inverse: triggers_transitions
      guarded_by_rules:
        description: "`Rule` entities that must be satisfied."
        range: Rule
        multivalued: true
        inverse: guards_transitions
      executes_actions_on_transition:
        description: "`Action` entities executed during transition."
        range: Action
        multivalued: true
        inverse: executed_during_transition

  Lifecycle:
    comments:
      - "Defines the full state machine governing entity lifecycle."
    is_a: NamedEntity
    description: >-
      The complete set of states and transitions for an entity type
    attributes:
      has_states:
        description: "List of all `State` entities in the lifecycle."
        range: State
        multivalued: true
      has_transitions:
        description: "List of all `Transition` entities."
        range: Transition
        multivalued: true
      starts_with_state:
        description: "Initial `State`."
        range: State
        inverse: initial_for_lifecycle
      governs_entities:
        description: "`DomainEntity` instances following this lifecycle."
        range: DomainEntity
        multivalued: true
        inverse: governed_by_lifecycle

  # SECTION 5: BEHAVIOR AND WORKFLOW

  Action:
    is_a: NamedEntity
    abstract: true
    description: >-
      An atomic operation that can be performed
    attributes:
      category:
        description: "`query` (read-only), `command` (state-changing), `mutation` (data modification)."
        range: ActionCategory
      allowed_by_permissions:
        description: "`Permission` entities required."
        range: Permission
        multivalued: true
        inverse: allows_actions
      performed_by_actor:
        description: "`Actor` performing the action."
        range: Actor
        inverse: performs_actions
      targets_resources:
        description: "`Resource` entities affected."
        range: Resource
        multivalued: true
        inverse: targeted_by_actions
      emits_events_from_action:
        description: "`Event` entities emitted."
        range: Event
        multivalued: true
        inverse: emitted_by_action
      validated_by_action_rules:
        description: "`Rule` entities that validate."
        range: Rule
        multivalued: true
        inverse: validates_actions
      executes_in_transaction:
        description: "`Transaction` context."
        range: Transaction
        inverse: executes_actions
      allowed_in_states:
        description: "Back-reference to `State` entities that allow this action."
        range: State
        multivalued: true
        inverse: allows_actions_in_state
      executed_during_transition:
        description: "Back-reference to `Transition` entities that execute this action."
        range: Transition
        multivalued: true
        inverse: executes_actions_on_transition
      executed_by_operation:
        description: "Back-reference to `Operation` entities that execute this action."
        range: Operation
        multivalued: true
        inverse: executes_operation_actions
      executed_in_step:
        description: "Back-reference to `Step` entities that execute this action."
        range: Step
        multivalued: true
        inverse: executes_actions_in_step
      recorded_in_audit:
        description: "Back-reference to `AuditEntry` entities that record this action."
        range: AuditEntry
        multivalued: true
        inverse: records_action

  Query:
    is_a: Action
    description: A read-only action that retrieves data
    attributes:
      filters:
        description: "Query filters."
        range: string
        multivalued: true
      projections:
        description: "Fields to return."
        range: string
        multivalued: true

  Command:
    is_a: Action
    description: An action that changes system state
    attributes:
      command_type:
        description: "Kind of command."
        range: CommandType
      idempotency_key:
        description: "For idempotent execution."
        range: string

  Operation:
    comments:
      - "Represents a callable operation on a component or service."
    is_a: NamedEntity
    description: >-
      A named, invocable unit of behavior exposed via an interface
    attributes:
      errors:
        description: "Possible error responses."
        range: string
        multivalued: true
      exposed_by_component:
        description: "`Component` providing this operation."
        range: Component
        inverse: exposes_operations
      executes_operation_actions:
        description: "`Action` entities performed."
        range: Action
        multivalued: true
        inverse: executed_by_operation
      accepts_input_schema:
        description: "`Schema` for input."
        range: Schema
        inverse: defines_operation_input
      produces_output_schema:
        description: "`Schema` for output."
        range: Schema
        inverse: defines_operation_output
      implemented_by_callables:
        description: "`CallableUnit` entities that implement this operation."
        range: CallableUnit
        multivalued: true
        inverse: implements_operation
      offered_on_screens:
        description: "`Screen` entities offering this operation."
        range: Screen
        multivalued: true
        inverse: offers_operations
      operation_tested_by_cases:
        description: "`TestCase` entities that test this operation."
        range: TestCase
        multivalued: true
        inverse: tests_operation

  Workflow:
    comments:
      - "Orchestrates multi-step business processes."
    is_a: NamedEntity
    description: >-
      A coordinated sequence of actions achieving a business goal
    attributes:
      workflow_type:
        description: "Coordination pattern."
        range: WorkflowType
      has_steps:
        description: "Ordered list of `Step` entities."
        range: Step
        multivalued: true
      triggered_by_workflow_events:
        description: "`Event` entities that start the workflow."
        range: Event
        multivalued: true
        inverse: triggers_workflows

  Step:
    is_a: NamedEntity
    description: >-
      A discrete stage within a workflow
    attributes:
      order:
        description: "Execution order."
        range: integer
      condition:
        description: "Condition for execution."
        range: string
      timeout_seconds:
        description: "Step timeout."
        range: integer
      executes_actions_in_step:
        description: "`Action` entities executed."
        range: Action
        multivalued: true
        inverse: executed_in_step
      followed_by_steps:
        description: "Next steps in sequence."
        range: Step
        multivalued: true
        inverse: follows_step
      follows_step:
        description: "Previous steps."
        range: Step
        multivalued: true
        inverse: followed_by_steps
      compensated_by_step:
        description: "Compensating step for rollback."
        range: Step
        inverse: compensates_for_step
      compensates_for_step:
        description: "Step this compensates for."
        range: Step
        inverse: compensated_by_step

  Rule:
    is_a: NamedEntity
    description: >-
      A declarative constraint or trigger governing behavior
    attributes:
      category:
        description: "Kind of rule."
        range: RuleCategory
      condition:
        description: "Rule condition expression."
        range: string
      action:
        description: "Action when rule fires."
        range: string
      priority:
        description: "Evaluation priority."
        range: integer
      is_active:
        description: "Whether rule is currently active."
        range: boolean
      validates_attributes:
        description: "Back-reference to `Attribute` entities validated by this rule."
        range: Attribute
        multivalued: true
        inverse: validated_by_rules
      enforces_aggregate_invariants:
        description: "Back-reference to `Aggregate` entities whose invariants this rule enforces."
        range: Aggregate
        multivalued: true
        inverse: enforced_by_invariant_rules
      governs_domain_entities:
        description: "Back-reference to `DomainEntity` entities governed by this rule."
        range: DomainEntity
        multivalued: true
        inverse: governed_by_rules
      validates_actions:
        description: "Back-reference to `Action` entities validated by this rule."
        range: Action
        multivalued: true
        inverse: validated_by_action_rules
      guards_transitions:
        description: "Back-reference to `Transition` entities guarded by this rule."
        range: Transition
        multivalued: true
        inverse: guarded_by_rules

  # Event and Subscription
  Event:
    is_a: NamedEntity
    description: >-
      A notification that something occurred
    attributes:
      category:
        description: "Kind of event."
        range: EventCategory
      correlation_id:
        description: "For tracing related events."
        range: string
      emitted_by_component:
        description: "`Component` that produced the event."
        range: Component
        inverse: emits_events
      event_structured_by_schema:
        description: "`Schema` defining event payload."
        range: Schema
        inverse: structures_events
      emitted_by_action:
        description: "Back-reference to `Action` entities that emit this event."
        range: Action
        multivalued: true
        inverse: emits_events_from_action
      triggers_transitions:
        description: "Back-reference to `Transition` entities triggered by this event."
        range: Transition
        multivalued: true
        inverse: triggered_by_events
      triggers_workflows:
        description: "Back-reference to `Workflow` entities triggered by this event."
        range: Workflow
        multivalued: true
        inverse: triggered_by_workflow_events
      subscribed_by_subscriptions:
        description: "Back-reference to `Subscription` entities that subscribe to this event."
        range: Subscription
        multivalued: true
        inverse: subscribes_to_event_types

  DomainEvent:
    is_a: Event
    description: A significant occurrence in the domain
    attributes:
      produced_by_aggregate:
        description: "Source `Aggregate`."
        range: Aggregate
        inverse: produces_domain_events

  IntegrationEvent:
    is_a: Event
    description: An event for cross-service communication
    attributes:
      targeted_at_services:
        description: "Target `Service` entities."
        range: Service
        multivalued: true
        inverse: receives_integration_events

  Subscription:
    is_a: NamedEntity
    description: >-
      A registration to receive events of a certain type
    attributes:
      filter:
        description: "Filter expression for event selection."
        range: string
      delivery_mode:
        description: "Push or pull delivery."
        range: string
      subscribes_to_event_types:
        description: "`Event` types subscribed to."
        range: Event
        multivalued: true
        inverse: subscribed_by_subscriptions
      subscribed_by_actor:
        description: "`Actor` subscribing."
        range: Actor
        inverse: has_subscriptions
      subscribes_to_interface:
        description: "`EventInterface` for delivery."
        range: EventInterface
        inverse: has_subscriptions

  Transaction:
    is_a: NamedEntity
    description: >-
      A unit of work with ACID or BASE guarantees
    attributes:
      transaction_type:
        description: "Kind of transaction."
        range: TransactionType
      isolation_level:
        description: "Transaction isolation level."
        range: string
      timeout_seconds:
        description: "Transaction timeout."
        range: integer
      executes_actions:
        description: "`Action` entities in this transaction."
        range: Action
        multivalued: true
        inverse: executes_in_transaction

  # SECTION 6: DATA MANAGEMENT

  DataStore:
    is_a: NamedEntity
    description: >-
      A persistence mechanism
    attributes:
      store_type:
        description: "Kind of data store."
        range: DataStoreType
      connection_string:
        description: "Connection configuration."
        range: string
      has_collections:
        description: "List of collections/tables."
        range: Collection
        multivalued: true
      hosted_on_infrastructure:
        description: "`Infrastructure` hosting the data store."
        range: Infrastructure
        inverse: hosts_datastores
      persists_aggregates:
        description: "`Aggregate` entities stored."
        range: Aggregate
        multivalued: true
        inverse: persisted_in_stores
      store_read_by_pipelines:
        description: "`DataPipeline` entities that read from this store."
        range: DataPipeline
        multivalued: true
        inverse: pipeline_reads_from_stores
      store_written_by_pipelines:
        description: "`DataPipeline` entities that write to this store."
        range: DataPipeline
        multivalued: true
        inverse: pipeline_writes_to_stores
      store_file_definitions:
        description: "`FileDefinition` entities associated with this store."
        range: FileDefinition
        multivalued: true
        inverse: persisted_in_store

  Collection:
    is_a: NamedEntity
    description: >-
      A logical grouping of records (table, collection, bucket)
    attributes:
      indexes:
        range: string
        multivalued: true
        description: >-
          Index definitions as strings (DEPRECATED -- use has_indexes)
      collection_structured_by_schema:
        description: "`Schema` defining structure."
        range: Schema
        inverse: structures_collections
      governed_by_retention_policy:
        description: "`RetentionPolicy` for data lifecycle."
        range: RetentionPolicy
        inverse: governs_collections
      stores_records:
        description: "`Record` instances."
        range: Record
        multivalued: true
        inverse: stored_in_collection
      persists_structures:
        description: "Code-level data structures persisted."
        range: DataStructure
        multivalued: true
        inverse: persisted_in_collection
      has_constraints:
        description: "`DatabaseConstraint[]` (inlined) -- constraint definitions for this collection (see Section 27)."
        range: DatabaseConstraint
        multivalued: true
        inlined_as_list: true
        inverse: constraint_on_collection
      has_indexes:
        description: "`DatabaseIndex[]` (inlined) -- index definitions for this collection (see Section 27)."
        range: DatabaseIndex
        multivalued: true
        inlined_as_list: true
        inverse: index_on_collection

  Record:
    is_a: NamedEntity
    description: >-
      A single persisted instance of data
    attributes:
      classifications:
        description: "Data sensitivity classifications."
        range: DataClassificationType
        multivalued: true
      stored_in_collection:
        description: "Parent `Collection`."
        range: Collection
        inverse: stores_records
      conforms_to_schema:
        description: "`Schema` for validation."
        range: Schema
        inverse: validates_records
      has_lineage:
        description: "`DataLineage` tracking origin and transformations."
        range: DataLineage
        inverse: tracks_record
      source_of_lineage:
        description: "Lineage entries where this record is a source."
        range: DataLineage
        multivalued: true
        inverse: derived_from_records

  Schema:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      The structural definition of stored data
    attributes:
      schema_type:
        description: "Kind of schema."
        range: SchemaType
      definition:
        description: "Schema definition (JSON Schema, DDL, etc.)."
        range: string
      has_versions:
        description: "List of `SchemaVersion` entities."
        range: SchemaVersion
        multivalued: true
        inverse: version_of_schema
      structures_resource_types:
        description: "`ResourceType` entities structured by this schema."
        range: ResourceType
        multivalued: true
        inverse: structured_by_schema
      structures_collections:
        description: "`Collection` entities structured by this schema."
        range: Collection
        multivalued: true
        inverse: collection_structured_by_schema
      structures_events:
        description: "`Event` entities structured by this schema."
        range: Event
        multivalued: true
        inverse: event_structured_by_schema
      structures_messages:
        description: "`Message` entities structured by this schema."
        range: Message
        multivalued: true
        inverse: message_structured_by_schema
      defines_operation_input:
        description: "`Operation` entities using this schema as input."
        range: Operation
        multivalued: true
        inverse: accepts_input_schema
      defines_operation_output:
        description: "`Operation` entities using this schema as output."
        range: Operation
        multivalued: true
        inverse: produces_output_schema
      validates_records:
        description: "`Record` entities validated by this schema."
        range: Record
        multivalued: true
        inverse: conforms_to_schema

  SchemaVersion:
    is_a: NamedEntity
    description: >-
      A specific iteration of a schema
    attributes:
      version:
        description: "Semantic version number."
        range: SemanticVersion
      definition:
        description: "Schema at this version."
        range: string
      migration_script:
        description: "Migration from previous version."
        range: string
      is_backward_compatible:
        description: "Compatibility flag."
        range: boolean
      version_of_schema:
        description: "`Schema` that this version belongs to."
        range: Schema
        inverse: has_versions

  DataClassification:
    is_a: NamedEntity
    description: >-
      A sensitivity or handling category
    attributes:
      classification_type:
        description: "Classification level."
        range: DataClassificationType
      handling_requirements:
        description: "Required procedures."
        range: string
        multivalued: true
      encryption_required:
        description: "Encryption flag."
        range: boolean

  RetentionPolicy:
    is_a: NamedEntity
    description: >-
      Rules governing data lifecycle and deletion
    attributes:
      retention_days:
        description: "Days to retain data."
        range: integer
      archive_after_days:
        description: "Days before archiving."
        range: integer
      deletion_strategy:
        description: "How data is deleted (soft delete, hard delete, anonymize)."
        range: string
      governs_collections:
        description: "`Collection` entities governed by this policy."
        range: Collection
        multivalued: true
        inverse: governed_by_retention_policy
      governs_logs:
        description: "`Log` entities governed by this policy."
        range: Log
        multivalued: true
        inverse: log_governed_by_retention
      governs_audit_logs:
        description: "`AuditLog` entities governed by this policy."
        range: AuditLog
        multivalued: true
        inverse: auditlog_governed_by_retention

  DataLineage:
    is_a: NamedEntity
    description: >-
      The origin, transformation history, and movement of data
    attributes:
      source:
        description: "Original data source."
        range: string
      transformations:
        description: "List of transformations applied."
        range: string
        multivalued: true
      derived_from_records:
        description: "Source `Record` entities."
        range: Record
        multivalued: true
        inverse: source_of_lineage
      tracks_record:
        description: "Target `Record` being tracked."
        range: Record
        inverse: has_lineage

  AuditLog:
    is_a: NamedEntity
    description: >-
      A tamper-evident record of system activities
    attributes:
      auditlog_governed_by_retention:
        description: "`RetentionPolicy` for log retention."
        range: RetentionPolicy
        inverse: governs_audit_logs
      contains_entries:
        description: "`AuditEntry[]` (v2.0 back-reference from `AuditEntry.entry_in_audit_log`)."
        range: AuditEntry
        multivalued: true
        inverse: entry_in_audit_log

  AuditEntry:
    is_a: NamedEntity
    description: >-
      A single record within an audit log
    attributes:
      timestamp:
        description: "When the event occurred (required)."
        range: Timestamp
        required: true
      outcome:
        description: "Result of the action (success, failure, error)."
        range: string
      details:
        description: "Additional context."
        range: string
      entry_in_audit_log:
        description: "`AuditLog` that this entry belongs to."
        range: AuditLog
        inverse: contains_entries
      audit_performed_by_actor:
        description: "`Actor` who performed action."
        range: Actor
        inverse: audit_actions_performed
      records_action:
        description: "`Action` that was performed."
        range: Action
        inverse: recorded_in_audit
      affects_resource:
        description: "`Resource` affected."
        range: Resource
        inverse: affected_in_audit

  # SECTION 7: INTEGRATION

  ExternalSystem:
    is_a: NamedEntity
    description: >-
      A system outside this system's boundary
    attributes:
      system_type:
        description: "Category of external system."
        range: ExternalSystemType
      owner:
        description: "System owner or vendor."
        range: string
      sla:
        description: "Service level agreement."
        range: string
      documentation_url:
        description: "API documentation URL."
        range: URI
      integrated_via:
        description: "`Integration[]` connecting to this system."
        range: Integration
        multivalued: true
        inverse: integrates_with_system

  Integration:
    is_a: NamedEntity
    description: >-
      A configured connection to an external system
    attributes:
      integration_type:
        description: "`inbound` (receiving data), `outbound` (sending data), `bidirectional`."
        range: IntegrationType
      protocol:
        description: "Communication protocol (HTTP, GRPC, KAFKA, etc.)."
        range: ProtocolType
      has_messages:
        description: "List of messages exchanged."
        range: Message
        multivalued: true
      integrates_with_system:
        description: "Target `ExternalSystem`."
        range: ExternalSystem
        inverse: integrated_via
      uses_adapter:
        description: "`Adapter` for protocol translation."
        range: Adapter
        inverse: used_by_integrations
      protected_by_breaker:
        description: "`CircuitBreaker` for resilience."
        range: CircuitBreaker
        inverse: protects_integrations
      integration_governed_by_contract:
        description: "`Contract` defining API."
        range: Contract
        inverse: governs_integrations
      belongs_to_system:
        description: "Parent `System`."
        range: System
        inverse: has_integrations
      integration_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_integration

  Message:
    is_a: NamedEntity
    description: >-
      A unit of data exchanged in integration
    attributes:
      message_type:
        description: "Kind of message."
        range: MessageType
      message_structured_by_schema:
        description: "`Schema` defining message structure."
        range: Schema
        inverse: structures_messages
      validated_by_contract:
        description: "`Contract` validating message."
        range: Contract
        inverse: validates_messages

  Contract:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A formal specification of integration behavior
    attributes:
      contract_type:
        description: "Kind of contract."
        range: ContractType
      definition:
        description: "Contract definition."
        range: string
      has_versions:
        description: "List of contract versions."
        range: ContractVersion
        multivalued: true
        inverse: version_of_contract
      defines_interfaces:
        description: "`Interface` entities defined."
        range: Interface
        multivalued: true
        inverse: defined_by_contract
      implemented_by_units:
        description: "`EncapsulationUnit` entities implementing this contract."
        range: EncapsulationUnit
        multivalued: true
        inverse: implements_contracts
      validates_messages:
        description: "`Message` entities validated."
        range: Message
        multivalued: true
        inverse: validated_by_contract
      governs_integrations:
        description: "`Integration` entities governed."
        range: Integration
        multivalued: true
        inverse: integration_governed_by_contract

  ContractVersion:
    is_a: NamedEntity
    description: >-
      A specific iteration of a contract
    attributes:
      version:
        description: "Semantic version number."
        range: SemanticVersion
      definition:
        description: "Contract at this version."
        range: string
      breaking_changes:
        description: "List of breaking changes from previous version."
        range: string
        multivalued: true
      version_of_contract:
        description: "`Contract` that this version belongs to."
        range: Contract
        inverse: has_versions

  Adapter:
    is_a: Component
    description: >-
      A component that translates between system and external protocols
    attributes:
      source_protocol:
        description: "Protocol to translate from."
        range: ProtocolType
      target_protocol:
        description: "Protocol to translate to."
        range: ProtocolType
      transformation:
        description: "Data transformation logic."
        range: string
      used_by_integrations:
        description: "`Integration` entities using this adapter."
        range: Integration
        multivalued: true
        inverse: uses_adapter

  CircuitBreaker:
    is_a: NamedEntity
    description: >-
      A resilience pattern preventing cascade failures
    attributes:
      failure_threshold:
        description: "Number of failures before opening circuit."
        range: integer
      reset_timeout_seconds:
        description: "Seconds before attempting half-open."
        range: integer
      half_open_requests:
        description: "Requests allowed in half-open state."
        range: integer
      protects_integrations:
        description: "`Integration` entities protected."
        range: Integration
        multivalued: true
        inverse: protected_by_breaker

  # SECTION 8: DEPLOYMENT AND OPERATIONS

  Environment:
    is_a: NamedEntity
    description: >-
      A runtime context with specific configuration
    attributes:
      environment_type:
        description: "Kind of environment."
        range: EnvironmentType
      hosts_deployments:
        description: "`Deployment` instances running in this environment."
        range: Deployment
        multivalued: true
        inverse: deployed_in_environment
      env_configured_by:
        description: "`Configuration` entities for this environment."
        range: Configuration
        multivalued: true
        inverse: configures_environments
      uses_infrastructure:
        description: "`Infrastructure` resources used."
        range: Infrastructure
        multivalued: true
        inverse: used_by_environments
      deployed_by_pipelines:
        description: "`BuildPipeline` entities that deploy to this environment."
        range: BuildPipeline
        multivalued: true
        inverse: pipeline_deploys_to_environments

  Deployment:
    is_a: NamedEntity
    description: >-
      An instance of a service running in an environment
    attributes:
      replicas:
        description: "Number of instances/replicas running."
        range: integer
      deploys_service:
        description: "The `Service` being deployed."
        range: Service
        inverse: deployed_as
      deployed_in_environment:
        description: "Target `Environment`."
        range: Environment
        inverse: hosts_deployments
      deploys_unit:
        description: "`DeploymentUnit` being deployed."
        range: DeploymentUnit
        inverse: deployed_in_deployments
      deployment_configured_by:
        description: "`Configuration` entities."
        range: Configuration
        multivalued: true
        inverse: configures_deployments
      deploys_release:
        description: "`Release` version being deployed."
        range: Release
        inverse: deployed_in_deployments_as_release

  DeploymentUnit:
    is_a: NamedEntity
    description: >-
      The packaged artifact being deployed
    attributes:
      unit_type:
        description: "Kind of deployment unit."
        range: DeploymentUnitType
      artifact_uri:
        description: "Location of the deployment artifact."
        range: URI
      checksum:
        description: "Artifact integrity checksum."
        range: string
      deployed_in_deployments:
        description: "`Deployment` entities that deploy this unit."
        range: Deployment
        multivalued: true
        inverse: deploys_unit

  Configuration:
    is_a: NamedEntity
    description: >-
      Runtime parameters for a deployment
    attributes:
      config_type:
        description: "Kind of configuration."
        range: ConfigurationType
      value:
        description: "Configuration value."
        range: string
      is_secret:
        description: "Whether this is sensitive data."
        range: boolean
      source:
        description: "Configuration source (vault, config service, etc.)."
        range: string
      controls_features:
        description: "Features controlled."
        range: Feature
        multivalued: true
        inverse: controlled_by_configs
      configures_environments:
        description: "`Environment` entities configured."
        range: Environment
        multivalued: true
        inverse: env_configured_by
      configures_deployments:
        description: "`Deployment` entities configured."
        range: Deployment
        multivalued: true
        inverse: deployment_configured_by
      setting_for_tenant:
        range: Tenant
        inverse: has_settings

  Infrastructure:
    is_a: NamedEntity
    description: >-
      The underlying compute, storage, and network resources
    attributes:
      infra_type:
        description: "Kind of infrastructure."
        range: InfrastructureType
      provider:
        description: "Cloud or infrastructure provider (AWS, Azure, GCP, on-premise)."
        range: string
      region:
        description: "Geographic region."
        range: string
      specifications:
        description: "Resource specifications (instance type, size, etc.)."
        range: string
      hosts_datastores:
        description: "`DataStore` entities hosted."
        range: DataStore
        multivalued: true
        inverse: hosted_on_infrastructure
      used_by_environments:
        description: "`Environment` entities using this infrastructure."
        range: Environment
        multivalued: true
        inverse: uses_infrastructure
      infrastructure_provisioned_by_iac:
        description: "`IaCDefinition` entities provisioning this infrastructure."
        range: IaCDefinition
        multivalued: true
        inverse: iac_provisions_infrastructure

  Release:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A versioned, deployable package of changes
    attributes:
      version:
        description: "Semantic version number."
        range: SemanticVersion
      changelog:
        description: "Release notes describing changes."
        range: string
      has_artifacts:
        description: "List of `DeploymentUnit` entities."
        range: DeploymentUnit
        multivalued: true
      deployed_in_deployments_as_release:
        description: "`Deployment` entities that deploy this release."
        range: Deployment
        multivalued: true
        inverse: deploys_release

  # SECTION 9: OBSERVABILITY

  Metric:
    is_a: NamedEntity
    description: >-
      A quantitative measurement over time
    attributes:
      metric_type:
        description: "Kind of metric."
        range: MetricType
      unit:
        description: "Unit of measurement (seconds, bytes, requests, etc.)."
        range: string
      labels:
        description: "Metric labels for dimensionality."
        range: string
        multivalued: true
      metric_emitted_by_component:
        description: "`Component` emitting this metric."
        range: Component
        inverse: emits_metric
      monitored_by_alert_rules:
        description: "`AlertRule` entities monitoring this metric."
        range: AlertRule
        multivalued: true
        inverse: monitors_metrics

  Log:
    is_a: NamedEntity
    description: >-
      A timestamped record of discrete events
    attributes:
      log_type:
        description: "Kind of log."
        range: LogType
      log_governed_by_retention:
        description: "`RetentionPolicy` for log retention."
        range: RetentionPolicy
        inverse: governs_logs
      contains_entries:
        description: "List of `LogEntry` records (inverse: `entry_in_log`)."
        range: LogEntry
        multivalued: true
        inverse: entry_in_log

  LogEntry:
    is_a: NamedEntity
    description: >-
      A single record within a log
    attributes:
      timestamp:
        description: "When the event occurred."
        range: Timestamp
      level:
        description: "Log level (DEBUG, INFO, WARN, ERROR)."
        range: string
      message:
        description: "Log message."
        range: string
      context:
        description: "Additional context (trace ID, user ID, etc.)."
        range: string
      entry_in_log:
        description: "Parent log."
        range: Log
        inverse: contains_entries

  Trace:
    comments:
      - "Track requests as they flow through distributed systems."
    is_a: NamedEntity
    description: >-
      A causal chain of operations across services
    attributes:
      trace_id:
        description: "Unique identifier for the entire trace."
        range: string
      starts_with_span:
        description: "Root `Span` of the trace."
        range: Span
        inverse: root_of_trace
      contains_spans:
        description: "List of `Span` entities representing operations (inverse: `belongs_to_trace`)."
        range: Span
        multivalued: true
        inverse: belongs_to_trace

  Span:
    is_a: NamedEntity
    description: >-
      A single unit of work within a trace
    attributes:
      span_id:
        description: "Unique identifier for this span."
        range: string
      operation_name:
        description: "Name of the operation."
        range: string
      start_time:
        description: "Operation start timestamp."
        range: Timestamp
      end_time:
        description: "Operation end timestamp."
        range: Timestamp
      status:
        description: "Span status."
        range: string
      attributes:
        description: "Key-value pairs with additional context."
        range: string
        multivalued: true
      belongs_to_trace:
        description: "Parent trace."
        range: Trace
        inverse: contains_spans
      child_of_span:
        description: "Parent span (for nested operations)."
        range: Span
        inverse: parent_of_spans
      parent_of_spans:
        description: "Child spans."
        range: Span
        multivalued: true
        inverse: child_of_span
      root_of_trace:
        description: "Trace this is the root span of."
        range: Trace
        inverse: starts_with_span

  Alert:
    is_a: NamedEntity
    description: >-
      A notification triggered by metric thresholds or anomalies
    attributes:
      severity:
        description: "Alert severity (critical, warning, info)."
        range: string
      triggered_at:
        description: "When alert was triggered."
        range: Timestamp
      acknowledged_at:
        description: "When alert was acknowledged."
        range: Timestamp
      resolved_at:
        description: "When issue was resolved."
        range: Timestamp
      triggered_by_rule:
        description: "`AlertRule` that triggered this alert."
        range: AlertRule
        inverse: triggers_alerts
      escalates_to_incident:
        description: "`Incident` if escalated."
        range: Incident
        multivalued: true
        inverse: escalated_from_alerts

  AlertRule:
    is_a: Rule
    description: >-
      The condition that triggers an alert
    attributes:
      condition:
        description: "Alert condition expression (e.g., \"error_rate > 5%\")."
        range: string
      threshold:
        description: "Threshold value."
        range: float
      duration_seconds:
        description: "Duration before alerting (avoid flapping)."
        range: integer
      notification_channels:
        description: "Where to send alerts (email, Slack, PagerDuty)."
        range: string
        multivalued: true
      monitors_metrics:
        description: "`Metric` entities being monitored."
        range: Metric
        multivalued: true
        inverse: monitored_by_alert_rules
      triggers_alerts:
        description: "`Alert` entities triggered."
        range: Alert
        multivalued: true
        inverse: triggered_by_rule

  Incident:
    is_a: NamedEntity
    description: >-
      A tracked degradation or outage event
    attributes:
      severity:
        description: "Incident severity (P1-P5 or SEV1-SEV5)."
        range: string
      status:
        description: "Current status (investigating, identified, monitoring, resolved)."
        range: string
      started_at:
        description: "Incident start time."
        range: Timestamp
      resolved_at:
        description: "Resolution time."
        range: Timestamp
      root_cause:
        description: "Root cause analysis."
        range: string
      postmortem_url:
        description: "Link to incident postmortem."
        range: URI
      escalated_from_alerts:
        description: "`Alert` entities that led to incident."
        range: Alert
        multivalued: true
        inverse: escalates_to_incident
      affects_services:
        description: "`Service` entities impacted."
        range: Service
        multivalued: true
        inverse: affected_by_incidents

  HealthCheck:
    is_a: NamedEntity
    description: >-
      A probe verifying service availability
    attributes:
      check_type:
        description: "Kind of health check."
        range: HealthCheckType
      endpoint:
        description: "Health check endpoint URL."
        range: string
      interval_seconds:
        description: "Check frequency."
        range: integer
      timeout_seconds:
        description: "Check timeout."
        range: integer
      success_threshold:
        description: "Successes before marking healthy."
        range: integer
      failure_threshold:
        description: "Failures before marking unhealthy."
        range: integer

  # SECTION 10: GOVERNANCE AND COMPLIANCE

  ComplianceRequirement:
    comments:
      - "Documents requirements from compliance frameworks that the system must satisfy."
    is_a: NamedEntity
    description: >-
      A regulatory or policy obligation
    attributes:
      framework:
        description: "Compliance framework this requirement belongs to."
        range: ComplianceFramework
      has_controls:
        description: "List of `Control` entities implementing this requirement."
        range: Control
        multivalued: true
      effective_date:
        description: "When requirement became effective."
        range: Timestamp
      applies_to_systems:
        description: "`System` entities that must comply."
        range: System
        multivalued: true
        inverse: must_comply_with

  Control:
    comments:
      - "Specific security or compliance controls implemented to satisfy requirements."
    is_a: NamedEntity
    description: >-
      A measure implementing a compliance requirement
    attributes:
      control_id:
        description: "Identifier (e.g., SOC2-CC6.1, ISO27001-A.9.2.1)."
        range: string
      implementation:
        description: "How control is implemented."
        range: string
      has_evidence:
        description: "List of `Evidence` entities demonstrating effectiveness."
        range: Evidence
        multivalued: true
      frequency:
        range: string
      owned_by_actor:
        description: "`Actor` responsible for this control."
        range: Actor
        inverse: owns_controls
      mitigates_risks:
        description: "`RiskAssessment` entities mitigated."
        range: RiskAssessment
        multivalued: true
        inverse: mitigated_by_controls

  Evidence:
    comments:
      - "Demonstrates to auditors that controls are implemented and effective."
    is_a: NamedEntity
    description: >-
      Proof that a control is operating effectively
    attributes:
      evidence_type:
        description: "Type of evidence (screenshot, log export, test result, policy document)."
        range: string
      collected_at:
        description: "Collection timestamp."
        range: Timestamp
      artifact_uri:
        description: "Location of evidence artifact."
        range: URI
      verified_by_actor:
        description: "`Actor` who verified the evidence."
        range: Actor
        inverse: verifies_evidence

  RiskAssessment:
    comments:
      - "Identify, analyze, and prioritize risks to the system."
    is_a: NamedEntity
    description: >-
      An evaluation of threats and vulnerabilities
    attributes:
      assessed_at:
        description: "Assessment date."
        range: Timestamp
      risk_level:
        description: "Overall risk level (e.g., \"low\", \"medium\", \"high\", \"critical\")."
        range: string
      threats:
        description: "List of identified threats."
        range: string
        multivalued: true
      vulnerabilities:
        description: "List of identified vulnerabilities."
        range: string
        multivalued: true
      residual_risk:
        description: "Remaining risk after mitigations."
        range: string
      mitigated_by_controls:
        description: "`Control` entities mitigating risks."
        range: Control
        multivalued: true
        inverse: mitigates_risks
      assesses_system:
        description: "`System` being assessed."
        range: System
        inverse: assessed_by

  # SECTION 11: TESTING

  TestSuite:
    is_a: NamedEntity
    description: >-
      A collection of related test cases
    attributes:
      suite_type:
        description: "Kind of test suite."
        range: TestSuiteType
        required: true
      framework:
        description: "Testing framework."
        range: string
      source_location:
        description: "Source file path."
        range: string
      total_cases:
        description: "Total test cases."
        range: integer
      passing_cases:
        description: "Passing test cases."
        range: integer
      failing_cases:
        description: "Failing test cases."
        range: integer
      skipped_cases:
        description: "Skipped test cases."
        range: integer
      execution_time_ms:
        description: "Total execution time in milliseconds."
        range: integer
      contains_test_cases:
        description: "Test cases in this suite."
        range: TestCase
        multivalued: true
        inverse: belongs_to_suite
      tests_component:
        description: "Component tested."
        range: Component
        inverse: tested_by_suites
      tests_module:
        description: "Module tested."
        range: Module
        inverse: module_tested_by_suites

  TestCase:
    is_a: NamedEntity
    description: >-
      A single test case that validates specific behavior
    attributes:
      status:
        description: "Test status."
        range: TestCaseStatus
      priority:
        description: "Priority level."
        range: string
      is_automated:
        description: "Whether automated."
        range: boolean
      setup_fixture:
        description: "Setup fixture name."
        range: string
      teardown_fixture:
        description: "Teardown fixture name."
        range: string
      line_start:
        description: "Starting line in source."
        range: integer
      line_end:
        description: "Ending line in source."
        range: integer
      has_assertions:
        description: "Assertions."
        range: TestAssertion
        multivalued: true
      belongs_to_suite:
        description: "Parent suite."
        range: TestSuite
        inverse: contains_test_cases
      tests_callable:
        description: "Callable tested."
        range: CallableUnit
        inverse: tested_by_cases
      tests_operation:
        description: "Operation tested."
        range: Operation
        inverse: operation_tested_by_cases

  TestAssertion:
    is_a: NamedEntity
    description: >-
      An individual assertion within a test case
    attributes:
      assertion_type:
        description: "Kind of assertion."
        range: AssertionType
      expected_value:
        description: "Expected value."
        range: string
      line_number:
        description: "Source line number."
        range: integer

  TestCoverage:
    is_a: NamedEntity
    description: >-
      Code coverage metrics for a component or module
    attributes:
      line_coverage_percent:
        description: "Line coverage percentage."
        range: float
      branch_coverage_percent:
        description: "Branch coverage percentage."
        range: float
      function_coverage_percent:
        description: "Function coverage percentage."
        range: float
      statement_coverage_percent:
        description: "Statement coverage percentage."
        range: float
      uncovered_lines:
        description: "Uncovered line numbers."
        range: integer
        multivalued: true
      coverage_tool:
        description: "Coverage tool (Istanbul, JaCoCo, etc.)."
        range: string
      coverage_for_component:
        description: "Component measured."
        range: Component
        inverse: has_coverage
      coverage_for_module:
        description: "Module measured."
        range: Module
        inverse: module_has_coverage

  # SECTION 12: UI/FRONTEND STRUCTURE

  UIComponent:
    is_a: NamedEntity
    description: >-
      A frontend user interface component that renders visual elements.
    attributes:
      component_type:
        description: "Kind of UI component."
        range: UIComponentType
        required: true
      framework:
        description: "Framework (React, Angular, Vue, etc.)."
        range: string
      has_props:
        description: "Component properties."
        range: UIProperty
        multivalued: true
      emitted_events:
        description: "Events this component emits."
        range: string
        multivalued: true
      is_lazy_loaded:
        description: "Whether lazily loaded."
        range: boolean
      is_server_rendered:
        description: "Whether server-side rendered."
        range: boolean
      accessibility_role:
        description: "ARIA role."
        range: string
      source_location:
        description: "Source path."
        range: string
      has_parent_ui_component:
        description: "Parent in component tree."
        range: UIComponent
        inverse: has_child_ui_components
      has_child_ui_components:
        description: "Children in component tree."
        range: UIComponent
        multivalued: true
        inverse: has_parent_ui_component
      renders_on_route:
        description: "Routes rendering this component."
        range: Route
        multivalued: true
        inverse: route_renders_component
      managed_by_state:
        description: "State stores managing this component."
        range: StateStore
        multivalued: true
        inverse: manages_ui_components
      ui_implements_encapsulation_unit:
        description: "Code implementation."
        range: EncapsulationUnit
        inverse: encapsulation_unit_renders_ui

  UIProperty:
    is_a: NamedEntity
    description: >-
      A property (prop) passed to a UI component
    attributes:
      data_type:
        description: "Property data type."
        range: string
      is_required:
        description: "Whether the prop is required."
        range: boolean
      default_value:
        description: "Default value."
        range: string
      is_reactive:
        description: "Whether the prop is reactive."
        range: boolean

  Route:
    is_a: NamedEntity
    description: >-
      A navigation route or URL path in a frontend application.
    attributes:
      path_pattern:
        description: "URL path pattern."
        range: string
        required: true
      route_type:
        description: "Kind of route."
        range: RouteType
      http_methods:
        description: "Allowed HTTP methods."
        range: string
        multivalued: true
      is_dynamic:
        description: "Whether the route has dynamic segments."
        range: boolean
      is_authenticated:
        description: "Whether authentication is required."
        range: boolean
      route_renders_component:
        description: "UI component rendered."
        range: UIComponent
        inverse: renders_on_route
      has_parent_route:
        description: "Parent route."
        range: Route
        inverse: has_child_routes
      has_child_routes:
        description: "Child routes."
        range: Route
        multivalued: true
        inverse: has_parent_route
      route_guarded_by:
        description: "Policies guarding this route."
        range: Policy
        multivalued: true
        inverse: guards_routes

  StateStore:
    is_a: NamedEntity
    description: >-
      A frontend state management store or container.
    attributes:
      management_type:
        description: "Kind of state management."
        range: StateManagementType
        required: true
      framework:
        description: "State management framework (Redux, Vuex, Zustand, etc.)."
        range: string
      has_state_shape:
        description: "Shape of the state tree."
        range: DataStructure
      actions:
        description: "Action names."
        range: string
        multivalued: true
      selectors:
        description: "Selector names."
        range: string
        multivalued: true
      manages_ui_components:
        description: "UI components managed."
        range: UIComponent
        multivalued: true
        inverse: managed_by_state

  # SECTION 13: BUILD AND CI/CD

  BuildPipeline:
    is_a: NamedEntity
    description: >-
      A CI/CD pipeline that automates build, test, and deployment processes.
    attributes:
      pipeline_type:
        description: "Kind of pipeline."
        range: PipelineType
        required: true
      platform:
        description: "CI/CD platform (GitHub Actions, Jenkins, etc.)."
        range: string
      trigger:
        description: "Trigger events."
        range: string
        multivalued: true
      trigger_branches:
        description: "Branches that trigger this pipeline."
        range: string
        multivalued: true
      source_file:
        description: "Pipeline definition file path."
        range: string
      has_stages:
        description: "Pipeline stages."
        range: PipelineStage
        multivalued: true
      timeout_minutes:
        description: "Pipeline timeout."
        range: integer
      is_parallelizable:
        description: "Whether stages can run in parallel."
        range: boolean
      pipeline_deploys_to_environments:
        description: "Target environments."
        range: Environment
        multivalued: true
        inverse: deployed_by_pipelines
      pipeline_produces_artifacts:
        description: "Artifacts produced."
        range: BuildArtifact
        multivalued: true
        inverse: artifact_produced_by_pipeline
      pipeline_uses_iac:
        description: "IaC definitions used."
        range: IaCDefinition
        multivalued: true
        inverse: iac_used_by_pipeline

  PipelineStage:
    is_a: NamedEntity
    description: >-
      A discrete stage within a CI/CD pipeline
    attributes:
      stage_type:
        description: "Kind of stage."
        range: PipelineStageType
        required: true
      order:
        description: "Execution order."
        range: integer
      depends_on_stages:
        description: "Stage dependencies (by name)."
        range: string
        multivalued: true
      condition:
        description: "Execution condition."
        range: string
      runner:
        description: "Runner/agent label."
        range: string
      timeout_minutes:
        description: "Stage timeout."
        range: integer
      environment_variables:
        description: "Environment variables."
        range: string
        multivalued: true
      is_manual:
        description: "Whether manual approval is required."
        range: boolean

  BuildArtifact:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      An artifact produced by a build pipeline
    attributes:
      artifact_type:
        description: "Kind of artifact."
        range: ArtifactType
        required: true
      artifact_uri:
        description: "Artifact location."
        range: URI
      size_bytes:
        description: "Size in bytes."
        range: integer
      checksum:
        description: "Integrity checksum."
        range: string
      build_number:
        description: "Build number or identifier."
        range: string
      artifact_produced_by_pipeline:
        description: "Pipeline that produced this artifact."
        range: BuildPipeline
        inverse: pipeline_produces_artifacts
      artifact_stored_in_registry:
        description: "Registry storing this artifact."
        range: ArtifactRegistry
        inverse: stores_artifacts

  ArtifactRegistry:
    is_a: NamedEntity
    description: >-
      A registry or repository for storing build artifacts.
    attributes:
      registry_type:
        description: "Kind of registry (Docker Hub, Nexus, ECR, etc.)."
        range: string
      base_url:
        description: "Registry base URL."
        range: URI
      is_private:
        description: "Whether the registry is private."
        range: boolean
      stores_artifacts:
        description: "Artifacts stored."
        range: BuildArtifact
        multivalued: true
        inverse: artifact_stored_in_registry

  # SECTION 14: DEPENDENCY MANAGEMENT

  PackageManager:
    is_a: NamedEntity
    description: >-
      A package/dependency management tool
    attributes:
      manager_type:
        description: "Kind of package manager."
        range: PackageManagerType
        required: true
      manifest_file:
        description: "Manifest file name (package.json, pom.xml, etc.)."
        range: string
      lock_file:
        description: "Lock file name."
        range: string
      registry_url:
        description: "Package registry URL."
        range: URI
      manages_dependencies_for_module:
        description: "Modules managed."
        range: Module
        multivalued: true
        inverse: module_managed_by_package_manager

  PackageDependency:
    is_a: NamedEntity
    description: >-
      A declared dependency on an external package or library
    attributes:
      package_name:
        description: "Package name."
        range: string
        required: true
      version_constraint:
        description: "Version constraint (e.g., ^1.2.0)."
        range: string
      resolved_version:
        description: "Resolved version."
        range: string
      scope:
        description: "Dependency scope."
        range: DependencyScope
      is_direct:
        description: "Whether this is a direct dependency."
        range: boolean
      license:
        description: "Package license."
        range: string
      has_known_vulnerabilities:
        description: "Known vulnerabilities."
        range: KnownVulnerability
        multivalued: true
      dependency_of_module:
        description: "Module declaring this dependency."
        range: Module
        inverse: module_has_dependencies
      has_transitive_dependencies:
        description: "Transitive dependencies."
        range: PackageDependency
        multivalued: true
        inverse: transitive_dependency_of
      transitive_dependency_of:
        description: "Packages depending on this transitively."
        range: PackageDependency
        multivalued: true
        inverse: has_transitive_dependencies

  KnownVulnerability:
    is_a: NamedEntity
    description: >-
      A known security vulnerability in a dependency
    attributes:
      cve_id:
        description: "CVE identifier."
        range: string
      severity:
        description: "Severity level."
        range: VulnerabilitySeverity
        required: true
      cvss_score:
        description: "CVSS score."
        range: float
      affected_versions:
        description: "Affected version range."
        range: string
      fixed_version:
        description: "Version with fix."
        range: string
      advisory_url:
        description: "Security advisory URL."
        range: URI

  # SECTION 15: CONCURRENCY

  ConcurrencyPrimitive:
    is_a: NamedEntity
    description: >-
      A low-level synchronization primitive used in concurrent code.
    attributes:
      primitive_type:
        description: "Kind of primitive."
        range: ConcurrencyPrimitiveType
        required: true
      is_reentrant:
        description: "Whether reentrant."
        range: boolean
      timeout_ms:
        description: "Lock timeout."
        range: integer
      line_number:
        description: "Source line."
        range: integer
      used_by_callables:
        description: "Callables using this."
        range: CallableUnit
        multivalued: true
        inverse: uses_concurrency_primitives
      protects_data_elements:
        description: "Data elements guarded."
        range: DataElement
        multivalued: true
        inverse: protected_by_primitive

  ConcurrencyPattern:
    is_a: NamedEntity
    description: >-
      A high-level concurrency pattern used in the system.
    attributes:
      pattern_type:
        description: "Kind of pattern."
        range: ConcurrencyPatternType
        required: true
      max_concurrency:
        description: "Maximum concurrency level."
        range: integer
      framework:
        description: "Framework or library."
        range: string
      shared_resources:
        description: "Shared resources."
        range: string
        multivalued: true
      pattern_used_by_component:
        description: "Components using this pattern."
        range: Component
        multivalued: true
        inverse: component_uses_concurrency_pattern

  # SECTION 16: ML/DATA PIPELINES

  MLModel:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A machine learning model defined, trained, or served by the system
    attributes:
      model_type:
        description: "Kind of ML model."
        range: MLModelType
        required: true
      framework:
        description: "ML framework (TensorFlow, PyTorch, etc.)."
        range: string
      model_format:
        description: "Serialization format (ONNX, SavedModel, etc.)."
        range: string
      model_uri:
        description: "Model artifact location."
        range: URI
      has_input_schema:
        description: "Input data structure."
        range: DataStructure
      has_output_schema:
        description: "Output data structure."
        range: DataStructure
      has_metrics:
        description: "Performance metrics."
        range: MLModelMetric
        multivalued: true
      model_trained_by_pipeline:
        description: "Training pipeline."
        range: DataPipeline
        inverse: pipeline_trains_model
      model_served_by_component:
        description: "Serving component."
        range: Component
        inverse: component_serves_model
      model_uses_feature_store:
        description: "Feature stores used."
        range: FeatureStore
        multivalued: true
        inverse: provides_features_to_models

  MLModelMetric:
    is_a: NamedEntity
    description: >-
      A performance metric for an ML model
    attributes:
      metric_name:
        description: "Metric name (accuracy, F1, RMSE, etc.)."
        range: string
        required: true
      value:
        description: "Metric value."
        range: float
      dataset:
        description: "Evaluation dataset name."
        range: string

  Dataset:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A dataset used for training, evaluation, or inference
    attributes:
      format:
        description: "Data format (CSV, Parquet, etc.)."
        range: string
      storage_uri:
        description: "Storage location."
        range: URI
      row_count:
        description: "Number of rows/records."
        range: integer
      has_schema:
        description: "Dataset schema."
        range: Schema
      classification:
        description: "Data classification."
        range: DataClassificationType
      dataset_used_by_pipeline:
        description: "Pipelines using this dataset."
        range: DataPipeline
        multivalued: true
        inverse: pipeline_uses_dataset

  FeatureStore:
    is_a: NamedEntity
    description: >-
      A centralized store for computed ML features.
    attributes:
      platform:
        description: "Feature store platform (Feast, Tecton, etc.)."
        range: string
      storage_backend:
        description: "Storage backend."
        range: string
      feature_count:
        description: "Number of features."
        range: integer
      provides_features_to_models:
        description: "Models using this feature store."
        range: MLModel
        multivalued: true
        inverse: model_uses_feature_store

  DataPipeline:
    is_a: NamedEntity
    description: >-
      A data processing pipeline for ETL, feature engineering, or model training.
    attributes:
      pipeline_type:
        description: "Kind of pipeline."
        range: DataPipelineType
        required: true
      orchestrator:
        description: "Orchestrator (Airflow, Dagster, etc.)."
        range: string
      schedule:
        description: "Cron expression or schedule."
        range: string
      source_file:
        description: "Pipeline definition file."
        range: string
      has_steps:
        description: "Pipeline steps."
        range: DataPipelineStep
        multivalued: true
      pipeline_reads_from_stores:
        description: "Data stores read from."
        range: DataStore
        multivalued: true
        inverse: store_read_by_pipelines
      pipeline_writes_to_stores:
        description: "Data stores written to."
        range: DataStore
        multivalued: true
        inverse: store_written_by_pipelines
      pipeline_uses_dataset:
        description: "Datasets used."
        range: Dataset
        multivalued: true
        inverse: dataset_used_by_pipeline
      pipeline_trains_model:
        range: MLModel
        multivalued: true
        inverse: model_trained_by_pipeline

  DataPipelineStep:
    is_a: NamedEntity
    description: >-
      A discrete step within a data pipeline
    attributes:
      step_type:
        description: "Kind of step."
        range: DataPipelineStepType
        required: true
      order:
        description: "Execution order."
        range: integer
      depends_on_steps:
        description: "Step dependencies (by name)."
        range: string
        multivalued: true
      transformation_logic:
        description: "Transformation description."
        range: string
      input_schema:
        description: "Input schema."
        range: string
      output_schema:
        description: "Output schema."
        range: string

  # SECTION 17: INFRASTRUCTURE AS CODE

  IaCDefinition:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      An infrastructure-as-code definition that declaratively specifies
      infrastructure resources.
    attributes:
      tool:
        description: "IaC tool."
        range: IaCToolType
        required: true
      source_file:
        description: "Source file path."
        range: string
      provider:
        description: "Cloud provider."
        range: string
      has_resources:
        description: "Resources defined."
        range: IaCResource
        multivalued: true
      iac_provisions_infrastructure:
        description: "Infrastructure provisioned."
        range: Infrastructure
        multivalued: true
        inverse: infrastructure_provisioned_by_iac
      iac_used_by_pipeline:
        description: "Pipelines using this definition."
        range: BuildPipeline
        multivalued: true
        inverse: pipeline_uses_iac

  IaCResource:
    is_a: NamedEntity
    description: >-
      A single infrastructure resource defined in code
    attributes:
      resource_type:
        description: "Kind of resource."
        range: IaCResourceType
        required: true
      provider_resource_type:
        description: "Provider-specific type (e.g., aws_instance, azurerm_storage_account)."
        range: string
      properties:
        description: "Resource properties."
        range: string
        multivalued: true
      depends_on_resources:
        description: "Resource dependencies (by name)."
        range: string
        multivalued: true
      is_managed:
        description: "Whether Terraform/IaC manages lifecycle."
        range: boolean

  IaCModule:
    is_a: NamedEntity
    description: >-
      A reusable module of IaC definitions.
    attributes:
      source:
        description: "Module source (registry path, git URL, etc.)."
        range: string
      input_variables:
        description: "Input variable names."
        range: string
        multivalued: true
      output_values:
        description: "Output value names."
        range: string
        multivalued: true
      has_child_resources:
        description: "Resources within this module."
        range: IaCResource
        multivalued: true

  # SECTION 18: TYPE SYSTEM MODELING

  TypeExpression:
    comments:
      - "Replaces flat `data_type` strings with structured, queryable type information. Enables cross-language type analysis and compatibility checking."
    is_a: NamedEntity
    description: >-
      A recursive type model for expressing complex types (generics, unions,
      pointers, function types, etc.) across all languages.
    attributes:
      type_kind:
        description: "The kind of type expression."
        range: TypeKind
        required: true
      base_type:
        range: string
        description: Base type name (e.g., "List", "int", "String")
      has_type_parameters:
        range: TypeExpression
        multivalued: true
        description: Generic type parameters (e.g., T in List<T>)
      type_constraints:
        range: string
        multivalued: true
        description: Constraints on type parameters
      is_nullable:
        description: "Whether the type permits null values."
        range: boolean
      nullability_model:
        range: string
        description: How nullability is expressed (e.g., "optional", "nullable", "Option<T>")
      pointer_semantics:
        range: string
        description: Pointer/reference semantics (e.g., "raw", "smart", "weak")
      type_of_data_elements:
        description: "Data elements that have this type."
        range: DataElement
        multivalued: true
        inverse: declared_type
      type_of_parameters:
        description: "Parameters that have this type."
        range: Parameter
        multivalued: true
        inverse: has_type
      return_type_of_callables:
        description: "Callables that return this type."
        range: CallableUnit
        multivalued: true
        inverse: has_return_type

  # SECTION 19: ERROR HANDLING MODEL

  ErrorModel:
    comments:
      - "Enables cross-language comparison of error handling strategies and identification of mixed paradigms within a codebase."
    is_a: NamedEntity
    description: >-
      Describes how a module or language handles errors
    attributes:
      strategy:
        description: "The error handling paradigm used."
        range: ErrorHandlingStrategy
        required: true
      checkedness:
        description: "Whether exceptions are checked or unchecked."
        range: ExceptionCheckedness
      modules_using_error_model:
        description: "Modules that use this error model."
        range: EncapsulationUnit
        multivalued: true
        inverse: error_model_for_module
      error_model_for_languages:
        description: "Languages that use this as their default error model."
        range: ProgrammingLanguage
        multivalued: true
        inverse: has_default_error_model

  ExceptionType:
    comments:
      - "Models exception class hierarchies and connects them to the callables that raise or handle them."
    is_a: NamedEntity
    description: >-
      A declared exception or error type in a codebase
    attributes:
      qualified_name:
        range: string
        description: Fully qualified type name
      is_checked:
        description: "Whether this is a checked exception."
        range: boolean
      has_parent_exception:
        description: "Parent in the exception hierarchy."
        range: ExceptionType
        inverse: has_child_exceptions
      has_child_exceptions:
        description: "Children in the exception hierarchy."
        range: ExceptionType
        multivalued: true
        inverse: has_parent_exception
      raised_by_callables:
        description: "Callables that may raise this exception."
        range: CallableUnit
        multivalued: true
        inverse: raises_exception_types
      handled_by_callables:
        description: "Callables that handle this exception."
        range: CallableUnit
        multivalued: true
        inverse: handles_exception_types

  # SECTION 20: FILE I/O DEFINITIONS

  FileDefinition:
    comments:
      - "Captures the physical and logical characteristics of files used by programs, enabling impact analysis when file structures change."
    is_a: NamedEntity
    description: >-
      A file defined for I/O in a program (COBOL SELECT, C fopen, etc.)
    attributes:
      organization:
        description: "Physical organization of the file."
        range: FileOrganization
      access_mode:
        description: "How the file is accessed."
        range: FileAccessMode
      record_format:
        description: "Record format."
        range: RecordFormat
      record_length:
        description: "Record length in bytes."
        range: integer
      block_size:
        description: "Block size in bytes."
        range: integer
      key_fields:
        range: string
        multivalued: true
        description: Key field names for indexed files
      file_status_field:
        range: string
        description: Variable receiving I/O status codes
      external_name:
        range: string
        description: External/physical file name (DD name, path)
      used_by_callables:
        description: "Callables that perform I/O on this file."
        range: CallableUnit
        multivalued: true
        inverse: uses_file_definitions
      file_defined_in_container:
        description: "Container where this file is defined."
        range: CodeContainer
        inverse: has_file_definitions
      persisted_in_store:
        description: "Data store backing this file."
        range: DataStore
        inverse: store_file_definitions
      has_file_operations:
        description: "Operations performed on this file."
        range: FileOperation
        multivalued: true
        inverse: operates_on_file
      mapped_from_dataset_allocations:
        description: "JCL dataset allocations that map to this file."
        range: DatasetAllocation
        multivalued: true
        inverse: maps_to_file_definition

  FileOperation:
    is_a: NamedEntity
    description: >-
      A specific I/O operation on a file definition
    attributes:
      operation_type:
        description: "The type of I/O operation."
        range: FileOperationType
        required: true
      condition_handling:
        range: string
        description: How I/O status conditions are handled
      operates_on_file:
        description: "The file being operated on."
        range: FileDefinition
        inverse: has_file_operations
      performed_in_callable:
        description: "The callable performing the operation."
        range: CallableUnit
        inverse: has_file_operations

  # SECTION 21: SCREEN/TERMINAL INTERACTION

  ScreenDefinition:
    comments:
      - "Captures the layout and structure of character-mode user interfaces, enabling UI-to-program traceability and modernization analysis."
    is_a: NamedEntity
    description: >-
      A terminal screen or map definition for character-mode UIs
    attributes:
      screen_type:
        description: "The type of screen definition."
        range: ScreenType
        required: true
      rows:
        description: "Number of screen rows."
        range: integer
      columns:
        description: "Number of screen columns."
        range: integer
      external_name:
        range: string
        description: External map/display file name
      contains_screen_fields:
        description: "Fields defined on this screen."
        range: ScreenField
        multivalued: true
        inlined_as_list: true
        inverse: field_on_screen
      program_uses_screens:
        description: "Programs that use this screen."
        range: EncapsulationUnit
        multivalued: true
        inverse: screen_used_by_programs
      screen_defined_in_container:
        description: "Container where this screen is defined."
        range: CodeContainer
        inverse: has_screen_definitions

  ScreenField:
    is_a: NamedEntity
    description: >-
      A field on a terminal screen definition
    attributes:
      row:
        description: "Row position on screen."
        range: integer
      column:
        description: "Column position on screen."
        range: integer
      length:
        description: "Field length in characters."
        range: integer
      is_input:
        description: "Whether the user can type into this field."
        range: boolean
      is_protected:
        description: "Whether the field is protected from modification."
        range: boolean
      attribute_byte:
        range: string
        description: Display attribute (bright, dark, protected, etc.)
      initial_value:
        description: "Default display value."
        range: string
      field_on_screen:
        description: "The screen this field belongs to."
        range: ScreenDefinition
        inverse: contains_screen_fields
      maps_to_data_element:
        description: "Data element mapped to this field."
        range: DataElement
        inverse: mapped_from_screen_fields

  # SECTION 22: JOB CONTROL / BATCH ORCHESTRATION

  JobDefinition:
    comments:
      - "Captures the structure and dependencies of batch workflows, enabling scheduling analysis and restart planning."
    is_a: NamedEntity
    description: >-
      A batch job definition (JCL JOB, scheduler entry, cron job)
    attributes:
      job_class:
        description: "Job class or queue assignment."
        range: string
      priority:
        description: "Execution priority."
        range: integer
      restart_point:
        range: string
        description: Step or checkpoint for restart
      scheduling_info:
        range: string
        description: Schedule or trigger criteria
      contains_job_steps:
        description: "Steps within this job."
        range: JobStep
        multivalued: true
        inlined_as_list: true
        inverse: step_in_job
      depends_on_jobs:
        description: "Jobs that must complete before this one."
        range: JobDefinition
        multivalued: true
        inverse: depended_on_by_jobs
      depended_on_by_jobs:
        description: "Jobs that depend on this one."
        range: JobDefinition
        multivalued: true
        inverse: depends_on_jobs

  JobStep:
    is_a: NamedEntity
    description: >-
      A single step within a batch job
    attributes:
      step_type:
        description: "The type of step."
        range: JobStepType
        required: true
      program_name:
        range: string
        description: Name of the program to execute
      condition_code:
        range: string
        description: Condition code checks (e.g., COND=(4,LT))
      region_size:
        range: string
        description: Memory region allocation
      step_in_job:
        description: "The job containing this step."
        range: JobDefinition
        inverse: contains_job_steps
      step_executes_program:
        description: "The program executed by this step."
        range: EncapsulationUnit
        inverse: executed_by_job_steps
      allocates_datasets:
        description: "Datasets allocated for this step."
        range: DatasetAllocation
        multivalued: true
        inlined_as_list: true
        inverse: allocated_in_step

  DatasetAllocation:
    is_a: NamedEntity
    description: >-
      A dataset (DD) allocation within a job step
    attributes:
      dd_name:
        range: string
        description: DD name (logical file reference)
      dataset_name:
        range: string
        description: Physical dataset name (DSN)
      disposition:
        description: "Dataset disposition."
        range: DatasetDisposition
      space_primary:
        description: "Primary space allocation."
        range: string
      space_secondary:
        description: "Secondary space allocation."
        range: string
      record_format:
        description: "Record format (shared enum with Section 20)."
        range: RecordFormat
      allocated_in_step:
        description: "The step where this allocation occurs."
        range: JobStep
        inverse: allocates_datasets
      maps_to_file_definition:
        description: "The file definition this allocation maps to."
        range: FileDefinition
        inverse: mapped_from_dataset_allocations

  # SECTION 23: INTER-PROCESS COMMUNICATION

  IPCConnection:
    comments:
      - "Captures how programs communicate at runtime, enabling dependency analysis across process boundaries."
    is_a: NamedEntity
    description: >-
      A communication link between two programs/processes
    attributes:
      mechanism:
        description: "The IPC mechanism used."
        range: IPCMechanism
        required: true
      is_synchronous:
        description: "Whether the communication is synchronous."
        range: boolean
      transaction_scoped:
        range: boolean
        description: Whether the IPC participates in a transaction boundary
      has_source_program:
        description: "Calling program."
        range: EncapsulationUnit
        inverse: has_outgoing_ipc_connections
      has_target_program:
        description: "Called program."
        range: EncapsulationUnit
        inverse: has_incoming_ipc_connections
      ipc_passes_data:
        description: "Data structures passed."
        range: DataStructure
        multivalued: true
        inverse: passed_via_ipc

  # SECTION 24: PREPROCESSOR / METAPROGRAMMING

  PreprocessorDirective:
    comments:
      - "Captures conditional compilation, macro expansion, and code generation constructs that affect program behavior and structure."
    is_a: NamedEntity
    description: >-
      A preprocessor directive, macro, or metaprogramming construct
    attributes:
      directive_type:
        description: "The type of metaprogramming construct."
        range: MetaprogrammingType
        required: true
      condition:
        range: string
        description: Conditional compilation expression
      expansion:
        range: string
        description: Expanded text or transformation result
      directive_defined_in_container:
        description: "Container where this directive is defined."
        range: CodeContainer
        inverse: has_preprocessor_directives
      directive_affects_encapsulation_units:
        description: "Encapsulation units affected by this directive."
        range: EncapsulationUnit
        multivalued: true
        inverse: affected_by_directives
      directive_affects_callables:
        description: "Callables affected by this directive."
        range: CallableUnit
        multivalued: true
        inverse: callable_affected_by_directives

  # SECTION 25: MEMORY / OWNERSHIP MODEL

  MemoryModel:
    comments:
      - "Enables analysis of memory safety, ownership transfer, and resource management patterns across codebases."
    is_a: NamedEntity
    description: >-
      Describes how a language or module manages memory
    attributes:
      primary_model:
        description: "The primary memory management approach."
        range: OwnershipModel
        required: true
      gc_type:
        range: string
        description: GC algorithm if applicable (e.g., "generational", "mark-sweep")
      supports_unsafe:
        range: boolean
        description: Whether the model allows unsafe/manual memory access
      modules_using_memory_model:
        description: "Modules that use this memory model."
        range: EncapsulationUnit
        multivalued: true
        inverse: memory_model_for_module
      memory_model_for_languages:
        description: "Languages that use this as their default memory model."
        range: ProgrammingLanguage
        multivalued: true
        inverse: has_default_memory_model

  OwnershipAnnotation:
    comments:
      - "Captures fine-grained ownership and lifetime information, particularly for Rust and C++ codebases."
    is_a: NamedEntity
    description: >-
      An ownership/lifetime annotation on a data element
    attributes:
      ownership:
        description: "The ownership model for this element."
        range: OwnershipModel
        required: true
      lifetime:
        description: "The lifetime scope."
        range: LifetimeScope
      lifetime_name:
        range: string
        description: Named lifetime identifier (e.g., 'a in Rust)
      annotates_data_element:
        description: "The data element this annotation applies to."
        range: DataElement
        inverse: has_ownership_annotations

  # SECTION 26: DOMAIN ENTITY RELATIONSHIPS

  DomainRelationship:
    comments:
      - "Explicitly captures how domain entities relate to each other, including cardinality, navigability, and composition semantics."
    is_a: NamedEntity
    description: >-
      A named, typed relationship between two domain entities
      (e.g., Order has many OrderLines, User belongs to Organization)
    attributes:
      cardinality:
        description: "The multiplicity of the relationship."
        range: Cardinality
        required: true
      is_navigable:
        range: boolean
        description: Whether the relationship can be traversed from source to target
      is_bidirectional:
        description: "Whether the relationship can be navigated in both directions."
        range: boolean
      is_composition:
        range: boolean
        description: Whether the target's lifecycle depends on the source (UML composition)
      foreign_key_field:
        range: string
        description: The field implementing this relationship in the data layer
      join_entity:
        range: string
        description: For many-to-many, the name of the join table/entity
      has_source_entity:
        description: "The `DomainEntity` that owns or originates the relationship (inverse: `has_outgoing_relationships` on DomainEntity)."
        range: DomainEntity
        inverse: has_outgoing_relationships
      has_target_entity:
        description: "The `DomainEntity` that is referenced by the relationship (inverse: `has_incoming_relationships` on DomainEntity)."
        range: DomainEntity
        inverse: has_incoming_relationships

  # SECTION 27: DATABASE SCHEMA OBJECTS

  DatabaseConstraint:
    comments:
      - "Captures primary keys, foreign keys, unique constraints, and check constraints for schema analysis, migration planning, and impact assessment."
    is_a: NamedEntity
    description: >-
      A constraint on a database table/collection
    attributes:
      constraint_type:
        description: "The type of constraint."
        range: DatabaseConstraintType
        required: true
      columns:
        description: "Columns involved in the constraint."
        range: string
        multivalued: true
      reference_table:
        range: string
        description: Referenced table for foreign keys
      reference_columns:
        range: string
        multivalued: true
        description: Referenced columns for foreign keys
      expression:
        range: string
        description: Expression for CHECK constraints
      constraint_on_collection:
        description: "The collection this constraint belongs to."
        range: Collection
        inverse: has_constraints

  DatabaseIndex:
    comments:
      - "Captures index definitions for performance analysis and schema management."
    is_a: NamedEntity
    description: >-
      An index on a database table/collection
    attributes:
      index_type:
        description: "The type of index."
        range: IndexType
        required: true
      columns:
        description: "Columns included in the index."
        range: string
        multivalued: true
      is_unique:
        description: "Whether the index enforces uniqueness."
        range: boolean
      is_partial:
        description: "Whether the index is partial/filtered."
        range: boolean
      filter_expression:
        range: string
        description: Filter for partial indexes
      index_on_collection:
        description: "The collection this index belongs to."
        range: Collection
        inverse: has_indexes

  # SECTION 28: PROGRAMMING LANGUAGE AS FIRST-CLASS ENTITY

  ProgrammingLanguage:
    comments:
      - "Enables structured cross-language analysis. Query \"show me all Rust modules\" without resorting to string matching on format or language fields."
    is_a: NamedEntity
    description: >-
      A programming language with its paradigms, type system, and runtime characteristics
    attributes:
      paradigms:
        description: "Programming paradigms supported."
        range: ProgrammingParadigm
        multivalued: true
      type_discipline:
        range: string
        description: Type system characterization (e.g., "static_strong", "dynamic_strong")
      has_preprocessor:
        description: "Whether the language has a preprocessor."
        range: boolean
      has_gc:
        description: "Whether the language has garbage collection."
        range: boolean
      year_introduced:
        description: "Year the language was first released."
        range: integer
      language_used_by_containers:
        description: "Code containers written in this language."
        range: CodeContainer
        multivalued: true
        inverse: written_in_language
      has_default_error_model:
        description: "The default error handling model for this language."
        range: ErrorModel
        inverse: error_model_for_languages
      has_default_memory_model:
        description: "The default memory management model for this language."
        range: MemoryModel
        inverse: memory_model_for_languages

  # SECTION 30: KNOWLEDGE ARTIFACTS

  KnowledgeArtifact:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A knowledge artifact that documents some aspect of the system
    attributes:
      artifact_type:
        range: KnowledgeArtifactType
      status:
        range: KnowledgeArtifactStatus
      uri:
        range: URI
      content:
        range: string
      authored_by:
        range: string
        multivalued: true
      authored_at:
        range: Timestamp
      superseded_by:
        range: KnowledgeArtifact
      supersedes:
        range: KnowledgeArtifact
      documents_system:
        range: System
        inverse: system_documented_by_artifacts
      documents_bounded_context:
        range: BoundedContext
        inverse: context_documented_by_artifacts
      documents_module:
        range: Module
        inverse: module_documented_by_artifacts
      documents_component:
        range: Component
        inverse: component_documented_by_artifacts
      documents_service:
        range: Service
        inverse: service_documented_by_artifacts
      documents_aggregate:
        range: Aggregate
        inverse: aggregate_documented_by_artifacts
      documents_domain_entity:
        range: DomainEntity
        inverse: entity_documented_by_artifacts
      documents_integration:
        range: Integration
        inverse: integration_documented_by_artifacts
      stored_in_container:
        range: CodeContainer
        inverse: contains_knowledge_artifacts

# GLOBAL SLOTS (multi-domain and base identification only)
slots:
  # Base identification slots
  id:
    identifier: true
    range: string
  name:
    range: string
  description:
    range: string
  version:
    range: SemanticVersion
  created_at:
    range: Timestamp
  updated_at:
    range: Timestamp
  tags:
    range: string
    multivalued: true
  is_active:
    range: boolean
  is_optional:
    range: boolean

  # Multi-domain relationship slots
  defined_in_container:
    range: CodeContainer
    inverse: contains_code_elements
    description: Code container where this element is defined
    domain_of:
      - EncapsulationUnit
      - CallableUnit
      - DataStructure

  contains_code_elements:
    description: "All code elements defined in this container."
    domain: CodeContainer
    multivalued: true
    inverse: defined_in_container
    any_of:
      - range: EncapsulationUnit
      - range: CallableUnit
      - range: DataStructure

  contained_in_unit:
    description: "The parent encapsulation unit."
    range: EncapsulationUnit
    inverse: contains_callable_units
    domain_of:
      - CallableUnit
      - DataStructure
      - DataElement

  contains_data_elements:
    description: "Fields or variables contained in this unit or structure."
    range: DataElement
    multivalued: true
    domain_of:
      - EncapsulationUnit
      - DataStructure

  implements_component:
    description: "Architectural component implemented by this code."
    range: Component
    inverse: implemented_by_code
    domain_of:
      - CodeContainer
      - EncapsulationUnit

  implemented_by_code:
    description: "Code implementations of this component."
    domain: Component
    multivalued: true
    inverse: implements_component
    any_of:
      - range: CodeContainer
      - range: EncapsulationUnit

  annotates_element:
    description: "Code elements bearing this annotation."
    domain: Annotation
    inverse: annotated_by
    any_of:
      - range: EncapsulationUnit
      - range: CallableUnit
      - range: DataStructure
      - range: DataElement

  annotated_by:
    description: "Annotations applied to this code element."
    range: Annotation
    multivalued: true
    inverse: annotates_element
    domain_of:
      - EncapsulationUnit
      - CallableUnit
      - DataStructure
      - DataElement

  affects_behavior_of:
    description: "Code elements whose behavior is altered by this annotation."
    domain: Annotation
    multivalued: true
    any_of:
      - range: EncapsulationUnit
      - range: CallableUnit

  imports_symbols:
    description: "Symbols imported by this definition reference."
    domain: DefinitionReference
    multivalued: true
    inverse: imported_via
    any_of:
      - range: EncapsulationUnit
      - range: CallableUnit
      - range: DataStructure

  imported_via:
    description: "Definition references importing this code element."
    range: DefinitionReference
    multivalued: true
    inverse: imports_symbols
    domain_of:
      - EncapsulationUnit
      - CallableUnit
      - DataStructure
