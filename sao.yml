        description: VSAM Entry-Sequenced Data Set
      vsam_rrds:
        description: VSAM Relative Record Data Set
      partitioned_dataset:
        description: Partitioned dataset (PDS/PDSE)
      generation_data_group:
        description: Generation data group (GDG)
      line_sequential: {}
      heap: {}

  FileAccessMode:
    description: How records are accessed during I/O
    permissible_values:
      sequential_access: {}
      random_access: {}
      dynamic_access:
        description: Both sequential and random in same open

  RecordFormat:
    description: Physical record format on storage
    permissible_values:
      fixed: {}
      variable: {}
      undefined: {}
      spanned:
        description: Records spanning multiple blocks
      stream: {}

  FileOperationType:
    description: Types of file I/O operations
    permissible_values:
      read: {}
      write: {}
      rewrite:
        description: Update existing record in place
      delete: {}
      start:
        description: Position cursor for sequential read
      open: {}
      close: {}
      sort: {}
      merge: {}

  # SECTION 21: Screen/Terminal Enumerations
  ScreenType:
    description: Types of terminal/screen definitions
    permissible_values:
      bms_map:
        description: CICS Basic Mapping Support map
      rpg_display_file:
        description: RPG display file (DSPF)
      character_terminal:
        description: Generic character-mode terminal
      tui:
        description: Text User Interface (ncurses, etc.)
      form_based:
        description: Form-based screen definition

  # SECTION 22: Job Control Enumerations
  JobStepType:
    description: Types of job steps in batch processing
    permissible_values:
      exec_program:
        description: Execute a program
      exec_proc:
        description: Execute a cataloged procedure
      utility:
        description: Run a system utility (SORT, IEBCOPY, etc.)
      sort: {}
      file_transfer: {}
      conditional:
        description: Conditional step based on return codes

  DatasetDisposition:
    description: Dataset allocation dispositions (JCL)
    permissible_values:
      new_dataset: {}
      old_dataset: {}
      shared: {}
      modify: {}
      catalog: {}
      delete_disp: {}
      pass:
        description: Pass dataset to next step

  # SECTION 23: IPC Enumerations
  IPCMechanism:
    description: Inter-process communication mechanisms
    permissible_values:
      cics_link:
        description: CICS LINK to another program
      cics_xctl:
        description: CICS XCTL transfer of control
      ims_schedule:
        description: IMS message scheduling
      shared_memory: {}
      pipe: {}
      rmi:
        description: Java Remote Method Invocation
      corba: {}
      database_mediated:
        description: Communication via shared database tables
      message_queue: {}
      socket: {}
      named_pipe: {}
      signal: {}
      semaphore: {}
      dcom: {}
      rest_call:
        description: HTTP-based inter-process call
      grpc_call:
        description: gRPC inter-process call
      event_bus:
        description: Event bus communication

  # SECTION 24: Preprocessor Enumerations
  MetaprogrammingType:
    description: Types of preprocessor/metaprogramming mechanisms
    permissible_values:
      c_preprocessor: {}
      rust_macro_declarative: {}
      rust_macro_procedural: {}
      cobol_copy_replacing:
        description: COBOL COPY ... REPLACING statement
      template_metaprogramming:
        description: C++ template metaprogramming
      python_metaclass: {}
      lisp_macro: {}
      java_annotation_processor: {}
      code_generator: {}

  # SECTION 25: Memory/Ownership Enumerations
  OwnershipModel:
    description: Memory ownership models
    permissible_values:
      owned: {}
      borrowed_shared:
        description: Shared/immutable borrow (Rust &T)
      borrowed_mutable:
        description: Exclusive mutable borrow (Rust &mut T)
      moved: {}
      copied: {}
      reference_counted:
        description: Rc/Arc (Rust), shared_ptr (C++)
      garbage_collected: {}
      manual:
        description: Manual malloc/free
      stack_allocated: {}

  LifetimeScope:
    description: Lifetime/scope of a value
    permissible_values:
      static_lifetime: {}
      function_scope: {}
      block_scope: {}
      named_lifetime:
        description: Rust named lifetime ('a)
      heap_lifetime: {}

  # SECTION 26: Domain Entity Relationship (no new enums, reuses Cardinality)

  # SECTION 27: Database Schema Object Enumerations
  DatabaseConstraintType:
    description: Types of database constraints
    permissible_values:
      primary_key: {}
      foreign_key: {}
      unique: {}
      check: {}
      not_null: {}

  IndexType:
    description: Types of database indexes
    permissible_values:
      btree: {}
      hash: {}
      gin:
        description: Generalized Inverted Index (PostgreSQL)
      fulltext: {}

  # SECTION 29: Architectural Pattern Enumerations
  ArchitecturalPatternType:
    description: Types of architectural patterns
    permissible_values:
      cqrs:
        description: Command Query Responsibility Segregation
      event_sourcing:
        description: Event sourcing pattern
      hexagonal:
        description: Hexagonal (ports and adapters) architecture
      clean_architecture:
        description: Clean architecture (Uncle Bob)
      layered:
        description: Traditional layered architecture
      microservice:
        description: Microservice architecture
      modular_monolith:
        description: Modular monolith architecture
      pipe_and_filter:
        description: Pipe and filter architecture
      saga:
        description: Saga pattern for distributed transactions
      strangler_fig:
        description: Strangler fig migration pattern
      bff:
        description: Backend for Frontend pattern
      api_gateway:
        description: API gateway pattern
      sidecar:
        description: Sidecar pattern
      event_driven:
        description: Event-driven architecture
      batch_sequential:
        description: Batch sequential processing
      transaction_script:
        description: Transaction script pattern
      table_module:
        description: Table module pattern
      domain_model:
        description: Domain model pattern
      repository:
        description: Repository pattern
      plugin:
        description: Plugin architecture

  # SECTION 30: Knowledge Artifact Enumerations
  KnowledgeArtifactType:
    description: Types of knowledge artifacts
    permissible_values:
      adr:
        description: Architecture Decision Record
      readme:
        description: README documentation
      design_doc:
        description: Design document
      runbook:
        description: Operational runbook
      wiki_page:
        description: Wiki page
      api_doc:
        description: API documentation
      onboarding_guide:
        description: Onboarding guide
      postmortem:
        description: Incident postmortem
      changelog:
        description: Changelog
      comment:
        description: Code or review comment
      diagram:
        description: Architecture or design diagram
      rfc:
        description: Request for Comments
      sop:
        description: Standard Operating Procedure

  KnowledgeArtifactStatus:
    description: Status of a knowledge artifact
    permissible_values:
      draft: {}
      published: {}
      accepted: {}
      superseded: {}
      deprecated: {}
      archived: {}

  # SECTION 28: Programming Language Enumerations
  ProgrammingParadigm:
    description: Programming paradigms
    permissible_values:
      object_oriented: {}
      procedural: {}
      functional: {}
      logic: {}
      concatenative: {}
      data_driven: {}
      multi_paradigm: {}

# TYPE DEFINITIONS
types:
  SemanticVersion:
    typeof: string
    description: Semantic version string (e.g., 1.2.3)
    pattern: "^\\d+\\.\\d+\\.\\d+(-[a-zA-Z0-9]+)?$"

  URI:
    typeof: uriorcurie
    description: Universal Resource Identifier

  Timestamp:
    typeof: datetime
    description: ISO 8601 timestamp

# CLASSES
classes:
  # ABSTRACT BASE CLASSES

  NamedEntity:
    abstract: true
    description: >-
      Abstract base class for all named entities in the ontology
    attributes:
      id:
        identifier: true
        range: string
        required: true
      name:
        range: string
        required: true
      description:
        range: string
      tags:
        range: string
        multivalued: true
      metadata:
        range: Metadata
        inlined: true

  Metadata:
    description: Common metadata for entities
    attributes:
      created_at:
        range: Timestamp
      updated_at:
        range: Timestamp
      created_by:
        range: string
      version:
        range: SemanticVersion

  Versionable:
    mixin: true
    description: Mixin for entities that support versioning
    attributes:
      version:
        range: SemanticVersion
      effective_from:
        range: Timestamp
      effective_to:
        range: Timestamp
      is_current:
        range: boolean

  Auditable:
    mixin: true
    description: Mixin for entities requiring audit trails
    attributes:
      audit_log:
        range: AuditLog

  # SECTION 1: STRUCTURAL FOUNDATION

  System:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      Top-level container representing a software product, platform, or application
    attributes:
      contains_bounded_contexts:
        range: BoundedContext
        multivalued: true
        inlined_as_list: true
        inverse: contained_in_system
      has_integrations:
        range: Integration
        multivalued: true
        inverse: belongs_to_system
      enforces_policies:
        range: Policy
        multivalued: true
        inverse: enforced_by_system
      must_comply_with:
        range: ComplianceRequirement
        multivalued: true
        inverse: applies_to_systems
      assessed_by:
        range: RiskAssessment
        multivalued: true
        inverse: assesses_system
      exposes_interfaces:
        range: Interface
        multivalued: true
        inverse: exposed_by_system
      system_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_system

  BoundedContext:
    is_a: NamedEntity
    description: >-
      A semantic boundary within which a domain model applies consistently.
      Corresponds to DDD bounded context concept.
    attributes:
      contained_in_system:
        range: System
        inverse: contains_bounded_contexts
      contains_modules:
        range: Module
        multivalued: true
        inlined_as_list: true
        inverse: contained_in_context
      upstream_from:
        range: BoundedContext
        multivalued: true
        inverse: downstream_from
        description: Contexts upstream from this one (this context depends on them)
      downstream_from:
        range: BoundedContext
        multivalued: true
        inverse: upstream_from
      contains_aggregates:
        range: Aggregate
        multivalued: true
        inlined_as_list: true
        inverse: contained_in_bounded_context
      ubiquitous_language:
        range: string
        multivalued: true
        description: Key terms in the ubiquitous language for this context
      context_map_relationship:
        range: string
        description: Relationship pattern (e.g., Customer-Supplier, Partnership)
      architectural_patterns:
        range: ArchitecturalPatternType
        multivalued: true
      context_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_bounded_context

  Module:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A deployable, cohesive unit of functionality within a bounded context
    attributes:
      contained_in_context:
        range: BoundedContext
        inverse: contains_modules
      contains_components:
        range: Component
        multivalued: true
        inlined_as_list: true
        inverse: contained_in_module
      depends_on_module:
        range: Module
        multivalued: true
        inverse: depended_on_by_module
      depended_on_by_module:
        range: Module
        multivalued: true
        inverse: depends_on_module
      provides_capabilities:
        range: Capability
        multivalued: true
        inverse: provided_by_modules
      runs_as_services:
        range: Service
        multivalued: true
        inverse: runs_module
      dependencies:
        range: Dependency
        multivalued: true
        inlined_as_list: true
      is_optional:
        range: boolean
      required_features:
        range: string
        multivalued: true
      mapped_from_directory:
        range: StorageLocation
        inverse: maps_to_module
      module_tested_by_suites:
        range: TestSuite
        multivalued: true
        inverse: tests_module
      module_has_coverage:
        range: TestCoverage
        inverse: coverage_for_module
      module_managed_by_package_manager:
        range: PackageManager
        inverse: manages_dependencies_for_module
      module_has_dependencies:
        range: PackageDependency
        multivalued: true
        inverse: dependency_of_module
      architectural_patterns:
        range: ArchitecturalPatternType
        multivalued: true
      module_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_module

  Component:
    is_a: NamedEntity
    description: >-
      A logical building block within a module (class, function group, etc.)
    slots:
      - implemented_by_code
    attributes:
      contained_in_module:
        range: Module
        inverse: contains_components
      exposes_operations:
        range: Operation
        multivalued: true
        inverse: exposed_by_component
      emits_events:
        range: Event
        multivalued: true
        inverse: emitted_by_component
      component_type:
        range: string
      language:
        range: string
        description: Implementation language (DEPRECATED -- use written_in_language on CodeContainer)
      source_location:
        range: string
      dependencies:
        range: Dependency
        multivalued: true
        inlined_as_list: true
      emits_metrics:
        range: Metric
        multivalued: true
      generates_logs:
        range: Log
        multivalued: true
      tested_by_suites:
        range: TestSuite
        multivalued: true
        inverse: tests_component
      has_coverage:
        range: TestCoverage
        inverse: coverage_for_component
      emits_metric:
        range: Metric
        multivalued: true
        inverse: metric_emitted_by_component
      component_serves_model:
        range: MLModel
        multivalued: true
        inverse: model_served_by_component
      component_uses_concurrency_pattern:
        range: ConcurrencyPattern
        multivalued: true
        inverse: pattern_used_by_component
      component_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_component

  # CODE STRUCTURE CLASSES

  CodeContainer:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A physical container of source code - may be a file, member in a library,
      or other storage unit depending on the platform.
    slots:
      - implements_component
      - contains_code_elements
    attributes:
      container_path:
        range: string
        required: true
      container_type:
        range: CodeContainerType
      format:
        range: string
        description: >-
          Format or language (DEPRECATED -- use written_in_language relationship)
      size_bytes:
        range: integer
      line_count:
        range: integer
      encoding:
        range: string
      checksum:
        range: string
      contained_in_storage_location:
        range: StorageLocation
        inverse: contains_containers
      contains_encapsulation_units:
        range: EncapsulationUnit
        multivalued: true
      references_containers:
        range: CodeContainer
        multivalued: true
        inverse: referenced_by_containers
      referenced_by_containers:
        range: CodeContainer
        multivalued: true
        inverse: references_containers
      includes_definitions:
        range: CodeContainer
        multivalued: true
        inverse: included_in_containers
      included_in_containers:
        range: CodeContainer
        multivalued: true
        inverse: includes_definitions
      has_references:
        range: DefinitionReference
        multivalued: true
        inverse: referencing_container
      referenced_via:
        range: DefinitionReference
        multivalued: true
        inverse: referenced_container
      written_in_language:
        range: ProgrammingLanguage
        inverse: language_used_by_containers
      container_file_definitions:
        range: FileDefinition
        multivalued: true
        inverse: file_defined_in_container
      container_screen_definitions:
        range: ScreenDefinition
        multivalued: true
        inverse: screen_defined_in_container
      container_preprocessor_directives:
        range: PreprocessorDirective
        multivalued: true
        inverse: directive_defined_in_container
      contains_knowledge_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: stored_in_container

  StorageLocation:
    is_a: NamedEntity
    description: >-
      A logical or physical location for storing code containers.
    attributes:
      location_path:
        range: string
        required: true
      location_type:
        range: StorageLocationType
      parent_location:
        range: StorageLocation
        inverse: contains_locations
      contains_locations:
        range: StorageLocation
        multivalued: true
        inverse: parent_location
      contains_containers:
        range: CodeContainer
        multivalued: true
        inverse: contained_in_storage_location
      maps_to_module:
        range: Module
        inverse: mapped_from_directory

  EncapsulationUnit:
    is_a: NamedEntity
    abstract: true
    description: >-
      A logical boundary that groups related code and data.
      Maps to: Class (OOP), Program (COBOL), Module (functional),
      Package (Java), Namespace (C#), Record module (ML).
    slots:
      - defined_in_container
      - contains_data_elements
      - implements_component
      - annotated_by
      - imported_via
    attributes:
      encapsulation_type:
        range: EncapsulationType
        required: true
      visibility:
        range: VisibilityType
      is_reusable:
        range: boolean
      is_abstract:
        range: boolean
      is_final:
        range: boolean
      qualified_name:
        range: string
      line_start:
        range: integer
      line_end:
        range: integer
      stereotype:
        range: string
        description: Additional stereotype or pattern (e.g., Service, Repository, DTO)
      contains_callable_units:
        range: CallableUnit
        multivalued: true
        inverse: contained_in_unit
      contains_data_structures:
        range: DataStructure
        multivalued: true
      extends_units:
        range: EncapsulationUnit
        multivalued: true
        inverse: extended_by_units
      extended_by_units:
        range: EncapsulationUnit
        multivalued: true
        inverse: extends_units
      implements_contracts:
        range: Contract
        multivalued: true
        inverse: implemented_by_units
      uses_definitions:
        range: DefinitionReference
        multivalued: true
      encapsulation_unit_renders_ui:
        range: UIComponent
        inverse: ui_implements_encapsulation_unit
      error_model_for_module:
        range: ErrorModel
        inverse: modules_using_error_model
      screen_used_by_programs:
        range: ScreenDefinition
        multivalued: true
        inverse: program_uses_screens
      outgoing_ipc_connections:
        range: IPCConnection
        multivalued: true
        inverse: ipc_source_program
      incoming_ipc_connections:
        range: IPCConnection
        multivalued: true
        inverse: ipc_target_program
      affected_by_directives:
        range: PreprocessorDirective
        multivalued: true
        inverse: directive_affects_encapsulation_units
      memory_model_for_module:
        range: MemoryModel
        inverse: modules_using_memory_model
      executed_by_job_steps:
        range: JobStep
        multivalued: true
        inverse: step_executes_program

  CallableUnit:
    is_a: NamedEntity
    description: >-
      A named, invocable unit of code that performs a specific task.
      Maps to: Method (OOP), Function (procedural/functional),
      Paragraph (COBOL), Procedure (SQL), Subroutine (Fortran),
      Lambda (functional).
    slots:
      - contained_in_unit
      - defined_in_container
      - annotated_by
      - imported_via
    attributes:
      callable_type:
        range: CallableType
        required: true
      visibility:
        range: VisibilityType
      callable_category:
        range: CallableCategory
      return_type:
        range: string
      is_async:
        range: boolean
      is_pure:
        range: boolean
        description: Whether function is pure (no side effects)
      is_static:
        range: boolean
      is_virtual:
        range: boolean
      is_override:
        range: boolean
      is_recursive:
        range: boolean
      is_inline:
        range: boolean
      calling_convention:
        range: string
      line_start:
        range: integer
      line_end:
        range: integer
      entry_point_type:
        range: EntryPointType
      documentation:
        range: string
      complexity_score:
        range: integer
        description: Cyclomatic complexity or similar metric
      has_parameters:
        range: Parameter
        multivalued: true
        inverse: parameter_of
      invokes_callables:
        range: CallableUnit
        multivalued: true
        inverse: invoked_by_callables
      invoked_by_callables:
        range: CallableUnit
        multivalued: true
        inverse: invokes_callables
      accesses_data_elements:
        range: DataElement
        multivalued: true
      modifies_data_elements:
        range: DataElement
        multivalued: true
      implements_operation:
        range: Operation
        inverse: implemented_by_callables
      raises_exceptions:
        range: string
        multivalued: true
        description: >-
          Exception names that may be raised (DEPRECATED -- use raises_exception_types)
      handles_exceptions:
        range: string
        multivalued: true
        description: >-
          Exception names handled (DEPRECATED -- use handles_exception_types)
      overrides_callable:
        range: CallableUnit
        inverse: overridden_by_callables
      overridden_by_callables:
        range: CallableUnit
        multivalued: true
        inverse: overrides_callable
      contains_blocks:
        range: CodeBlock
        multivalued: true
        inverse: contained_in_callable
      tested_by_cases:
        range: TestCase
        multivalued: true
        inverse: tests_callable
      uses_concurrency_primitives:
        range: ConcurrencyPrimitive
        multivalued: true
        inverse: used_by_callables
      raises_exception_types:
        range: ExceptionType
        multivalued: true
        inverse: raised_by_callables
      handles_exception_types:
        range: ExceptionType
        multivalued: true
        inverse: handled_by_callables
      return_type_expression:
        range: TypeExpression
        inverse: return_type_of_callables
      uses_file_definitions:
        range: FileDefinition
        multivalued: true
        inverse: used_by_callables
      callable_file_operations:
        range: FileOperation
        multivalued: true
        inverse: performed_in_callable
      callable_affected_by_directives:
        range: PreprocessorDirective
        multivalued: true
        inverse: directive_affects_callables

  DataStructure:
    is_a: NamedEntity
    description: >-
      A composite data type grouping related data elements.
      Maps to: Struct (C), Record (Pascal/COBOL), Class data (OOP),
      Type (Haskell), Dictionary (Python), Hash (Ruby).
    slots:
      - contained_in_unit
      - defined_in_container
      - contains_data_elements
      - annotated_by
      - imported_via
    attributes:
      structure_type:
        range: DataStructureType
        required: true
      structure_category:
        range: DataStructureCategory
      visibility:
        range: VisibilityType
      is_mutable:
        range: boolean
      is_nested:
        range: boolean
      nesting_level:
        range: integer
        description: Nesting depth (for hierarchical structures like COBOL)
      is_packed:
        range: boolean
      alignment:
        range: integer
      size_bytes:
        range: integer
      is_serializable:
        range: boolean
      persistence_type:
        range: PersistenceType
      line_start:
        range: integer
      line_end:
        range: integer
      parent_structure:
        range: DataStructure
        inverse: child_structures
      child_structures:
        range: DataStructure
        multivalued: true
        inverse: parent_structure
      maps_to_domain_entity:
        range: DomainEntity
        inverse: mapped_from_structure
      maps_to_value_object:
        range: ValueObject
        inverse: mapped_from_structure_vo
      persisted_in_collection:
        range: Collection
        inverse: persists_structures
      structure_contains_elements:
        range: DataElement
        multivalued: true
        inverse: contained_in_structure
      passed_via_ipc:
        range: IPCConnection
        multivalued: true
        inverse: ipc_passes_data

  DataElement:
    is_a: NamedEntity
    description: >-
      An individual data field or variable.
      Maps to: Field (OOP), Variable (procedural), Column (database),
      Data item (COBOL), Property (C#), Attribute (Python).
    slots:
      - contained_in_unit
      - annotated_by
    attributes:
      data_type:
        range: string
        required: true
        description: >-
          Data type (DEPRECATED for typed analysis -- use declared_type)
      element_category:
        range: DataElementCategory
      visibility:
        range: VisibilityType
      is_constant:
        range: boolean
      is_nullable:
        range: boolean
      default_value:
        range: string
      size_specification:
        range: string
        description: Size/length specification (e.g., COBOL PIC, array dimensions)
      storage_class:
        range: StorageClass
      classification:
        range: DataClassificationType
      line_number:
        range: integer
      contained_in_structure:
        range: DataStructure
        inverse: structure_contains_elements
      parent_element:
        range: DataElement
        inverse: child_elements
      child_elements:
        range: DataElement
        multivalued: true
        inverse: parent_element
      maps_to_attribute:
        range: Attribute
        inverse: mapped_from_element
      protected_by_primitive:
        range: ConcurrencyPrimitive
        multivalued: true
        inverse: protects_data_elements
      declared_type:
        range: TypeExpression
        inverse: type_of_data_elements
      ownership_annotations:
        range: OwnershipAnnotation
        multivalued: true
        inverse: annotates_data_element
      mapped_from_screen_fields:
        range: ScreenField
        multivalued: true
        inverse: maps_to_data_element

  Parameter:
    is_a: DataElement
    description: >-
      An input/output parameter for a callable unit.
    attributes:
      direction:
        range: ParameterDirection
      position:
        range: integer
      passing_mechanism:
        range: PassingMechanism
      parameter_of:
        range: CallableUnit
        inverse: has_parameters
      parameter_type:
        range: TypeExpression
        inverse: type_of_parameters

  # Code Semantics
  CodeBlock:
    is_a: NamedEntity
    description: >-
      A logical grouping of statements within a callable unit.
    attributes:
      block_type:
        range: CodeBlockType
      line_start:
        range: integer
      line_end:
        range: integer
      contained_in_callable:
        range: CallableUnit
        inverse: contains_blocks
      contains_statements:
        range: Statement
        multivalued: true
        inverse: contained_in_block
      parent_block:
        range: CodeBlock
        inverse: child_blocks
      child_blocks:
        range: CodeBlock
        multivalued: true
        inverse: parent_block

  Statement:
    is_a: NamedEntity
    description: >-
      A single executable instruction or declaration.
    attributes:
      statement_category:
        range: StatementCategory
      line_number:
        range: integer
      is_conditional:
        range: boolean
      text:
        range: string
        description: Source text of statement
      contained_in_block:
        range: CodeBlock
        inverse: contains_statements
      operates_on_elements:
        range: DataElement
        multivalued: true
      invokes_callable:
        range: CallableUnit
      transfers_control_to:
        range: Statement

  DefinitionReference:
    is_a: NamedEntity
    description: >-
      A reference from one code container to shared definitions.
      Maps to: Import (Python/Java), Include (C/C++), COPY (COBOL),
      Using (C#), Require (Ruby), Use (Rust).
    slots:
      - imports_symbols
    attributes:
      reference_type:
        range: ReferenceType
      reference_path:
        range: string
      alias:
        range: string
      is_wildcard:
        range: boolean
      scope:
        range: string
      referencing_container:
        range: CodeContainer
        inverse: has_references
      referenced_container:
        range: CodeContainer
        inverse: referenced_via

  ControlFlow:
    is_a: NamedEntity
    description: >-
      Represents control flow between code elements.
    attributes:
      flow_type:
        range: ControlFlowType
      is_conditional:
        range: boolean
      condition:
        range: string
      source_callable:
        range: CallableUnit
      target_callable:
        range: CallableUnit
      source_statement:
        range: Statement
      target_statement:
        range: Statement

  DataFlow:
    is_a: NamedEntity
    description: >-
      Represents data flow between code elements.
    attributes:
      flow_type:
        range: DataFlowType
      source_element:
        range: DataElement
      target_element:
        range: DataElement
      through_callable:
        range: CallableUnit
      through_statement:
        range: Statement

  # Platform-Specific Extensions
  PlatformExtension:
    is_a: NamedEntity
    abstract: true
    description: >-
      Base class for platform-specific extensions
    attributes:
      platform:
        range: string

  ExecutionEnvironmentDirective:
    is_a: PlatformExtension
    description: >-
      Platform-specific execution directives.
      Maps to: JCL (mainframe), Docker Compose, Kubernetes manifests,
      Shell scripts, Makefiles, build files.
    attributes:
      directive_type:
        range: string
      configuration:
        range: string
      orchestrates_units:
        range: EncapsulationUnit
        multivalued: true
      defines_execution_order:
        range: CallableUnit
        multivalued: true
      allocates_resources:
        range: Infrastructure
        multivalued: true

  Annotation:
    is_a: NamedEntity
    description: >-
      Metadata attached to code elements.
      Maps to: Annotations (Java), Decorators (Python),
      Attributes (C#), Pragmas (C/C++), Compiler directives.
    slots:
      - annotates_element
      - affects_behavior_of
    attributes:
      annotation_syntax:
        range: string
      parameters:
        range: string
        multivalued: true

  Capability:
    is_a: NamedEntity
    description: >-
      A discrete business or technical ability the system provides
    attributes:
      realizes_features:
        range: Feature
        multivalued: true
        inverse: realized_by_capabilities
      requires_permissions:
        range: Permission
        multivalued: true
        inverse: required_by_capabilities
      provided_by_modules:
        range: Module
        multivalued: true
        inverse: provides_capabilities
      enables_features:
        range: Feature
        multivalued: true
        inverse: enabled_by_capabilities

  Feature:
    is_a: NamedEntity
    description: >-
      A user-facing manifestation of one or more capabilities
    attributes:
      category:
        range: FeatureCategory
      enabled_by_capabilities:
        range: Capability
        multivalued: true
        inverse: enables_features
      controlled_by_configs:
        range: Configuration
        multivalued: true
        inverse: controls_features
      accessible_by_roles:
        range: Role
        multivalued: true
        inverse: can_access_features
      realized_by_capabilities:
        range: Capability
        multivalued: true
        inverse: realizes_features

  # Interfaces
  Interface:
    is_a: NamedEntity
    abstract: true
    description: >-
      A contract-defined boundary through which interaction occurs
    attributes:
      category:
        range: InterfaceCategory
      authentication_required:
        range: boolean
      rate_limit:
        range: integer
      defined_by_contract:
        range: Contract
        inverse: defines_interfaces
      exposed_by_system:
        range: System
        inverse: exposes_interfaces

  UserInterface:
    is_a: Interface
    description: User-facing interface
    attributes:
      ui_type:
        range: UserInterfaceType
      screens:
        range: Screen
        multivalued: true
        inlined_as_list: true
      ui_screens:
        range: Screen
        multivalued: true
        inverse: part_of_ui

  Screen:
    is_a: NamedEntity
    description: A single screen or view in a user interface
    attributes:
      route:
        range: string
      part_of_ui:
        range: UserInterface
        inverse: ui_screens
      offers_operations:
        range: Operation
        multivalued: true
        inverse: offered_on_screens

  ProgrammaticInterface:
    is_a: Interface
    description: Machine-to-machine interface
    attributes:
      api_type:
        range: APIType
      base_url:
        range: URI
      has_endpoints:
        range: Endpoint
        multivalued: true
        inlined_as_list: true
        inverse: belongs_to_interface

  EventInterface:
    is_a: Interface
    description: Event-driven interface
    attributes:
      event_type:
        range: EventInterfaceType
      topics:
        range: string
        multivalued: true
      has_subscriptions:
        range: Subscription
        multivalued: true
        inverse: subscribes_to_interface

  # Service
  Service:
    is_a: NamedEntity
    description: >-
      An independently deployable runtime unit
    attributes:
      service_type:
        range: ServiceType
      health_checks:
        range: HealthCheck
        multivalued: true
        inlined_as_list: true
      emits_metrics:
        range: Metric
        multivalued: true
      exposes_endpoints:
        range: Endpoint
        multivalued: true
        inlined_as_list: true
        inverse: exposed_by_service
      depends_on_service:
        range: Service
        multivalued: true
        inverse: depended_on_by_service
      depended_on_by_service:
        range: Service
        multivalued: true
        inverse: depends_on_service
      deployed_as:
        range: Deployment
        multivalued: true
        inverse: deploys_service
      runs_module:
        range: Module
        inverse: runs_as_services
      receives_integration_events:
        range: IntegrationEvent
        multivalued: true
        inverse: targeted_at_services
      affected_by_incidents:
        range: Incident
        multivalued: true
        inverse: affects_services
      service_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_service

  Endpoint:
    is_a: NamedEntity
    description: >-
      A specific addressable entry point on a service
    attributes:
      path:
        range: string
      method:
        range: string
      operations:
        range: Operation
        multivalued: true
      protocol:
        range: ProtocolType
      port:
        range: integer
      exposed_by_service:
        range: Service
        inverse: exposes_endpoints
      belongs_to_interface:
        range: ProgrammaticInterface
        inverse: has_endpoints

  Dependency:
    is_a: NamedEntity
    description: >-
      A lightweight dependency reference between components or services
    attributes:
      dependency_type:
        range: DependencyType
      target:
        range: NamedEntity
      version_constraint:
        range: string
      is_optional:
        range: boolean

  # SECTION 2: ACTORS AND IDENTITY

  Actor:
    is_a: NamedEntity
    abstract: true
    description: >-
      Any entity that can initiate actions
    attributes:
      category:
        range: ActorCategory
      has_identities:
        range: Identity
        multivalued: true
        inverse: represents_actor
      performs_actions:
        range: Action
        multivalued: true
        inverse: performed_by_actor
      audit_actions_performed:
        range: AuditEntry
        multivalued: true
        inverse: audit_performed_by_actor
      actor_subscriptions:
        range: Subscription
        multivalued: true
        inverse: subscribed_by_actor
      owns_controls:
        range: Control
        multivalued: true
        inverse: owned_by_actor
      verifies_evidence:
        range: Evidence
        multivalued: true
        inverse: verified_by_actor

  HumanActor:
    is_a: Actor
    description: A human user of the system
    attributes:
      actor_type:
        range: HumanActorType
      email:
        range: string

  SystemActor:
    is_a: Actor
    description: A system or automated actor
    attributes:
      actor_type:
        range: SystemActorType
      service_account:
        range: string

  Identity:
    is_a: NamedEntity
    description: >-
      A verified representation of an actor
    attributes:
      identity_type:
        range: string
      credentials:
        range: Credential
        multivalued: true
        inlined_as_list: true
      has_roles:
        range: Role
        multivalued: true
        inverse: assigned_to_identities
      belongs_to_tenant:
        range: Tenant
        inverse: contains_identities
      member_of_organizations:
        range: Organization
        multivalued: true
        inverse: has_identity_members
      represents_actor:
        range: Actor
        inverse: has_identities

  Credential:
    is_a: NamedEntity
    description: >-
      Authentication material proving an identity claim
    attributes:
      credential_type:
        range: CredentialType
      expires_at:
        range: Timestamp
      is_active:
        range: boolean

  Tenant:
    is_a: NamedEntity
    description: >-
      An organizational boundary for multi-tenant systems
    attributes:
      organizations:
        range: Organization
        multivalued: true
        inlined_as_list: true
      settings:
        range: Configuration
        multivalued: true
      contains_identities:
        range: Identity
        multivalued: true
        inverse: belongs_to_tenant

  Organization:
    is_a: NamedEntity
    description: >-
      A logical grouping of users and resources within a tenant
    attributes:
      parent:
        range: Organization
      children:
        range: Organization
        multivalued: true
      has_identity_members:
        range: Identity
        multivalued: true
        inverse: member_of_organizations

  # SECTION 3: AUTHORIZATION AND POLICY

  Role:
    is_a: NamedEntity
    description: >-
      A named collection of permissions assignable to actors
    attributes:
      is_system_role:
        range: boolean
      grants_permissions:
        range: Permission
        multivalued: true
        inverse: granted_by_roles
      assigned_to_identities:
        range: Identity
        multivalued: true
        inverse: has_roles
      inherits_from_role:
        range: Role
        inverse: inherited_by_roles
      inherited_by_roles:
        range: Role
        multivalued: true
        inverse: inherits_from_role
      can_access_features:
        range: Feature
        multivalued: true
        inverse: accessible_by_roles

  Permission:
    is_a: NamedEntity
    description: >-
      A specific allowed action on a resource type or instance
    attributes:
      constraints:
        range: Constraint
        multivalued: true
        inlined_as_list: true
      allows_actions:
        range: Action
        multivalued: true
        inverse: allowed_by_permissions
      granted_by_roles:
        range: Role
        multivalued: true
        inverse: grants_permissions
      applies_to_resource_types:
        range: ResourceType
        multivalued: true
        inverse: governed_by_permissions
      limited_by_scope:
        range: Scope
        inverse: limits_permissions
      required_by_capabilities:
        range: Capability
        multivalued: true
        inverse: requires_permissions
      evaluated_by_policies:
        range: Policy
        multivalued: true
        inverse: evaluates_permissions

  Policy:
    is_a: NamedEntity
    description: >-
      A rule set governing access decisions
    attributes:
      policy_type:
        range: PolicyType
      rules:
        range: Rule
        multivalued: true
        inlined_as_list: true
      priority:
        range: integer
      evaluates_permissions:
        range: Permission
        multivalued: true
        inverse: evaluated_by_policies
      enforced_by_system:
        range: System
        inverse: enforces_policies
      guards_routes:
        range: Route
        multivalued: true
        inverse: route_guarded_by

  Scope:
    is_a: NamedEntity
    description: >-
      A boundary limiting where a permission applies
    attributes:
      scope_type:
        range: ScopeType
      resource_pattern:
        range: string
      limits_permissions:
        range: Permission
        multivalued: true
        inverse: limited_by_scope

  Constraint:
    is_a: NamedEntity
    description: >-
      A condition that must be satisfied for authorization
    attributes:
      constraint_type:
        range: ConstraintType
      expression:
        range: string
      parameters:
        range: string
        multivalued: true

  # SECTION 4: DOMAIN MODELING

  Aggregate:
    is_a: NamedEntity
    description: >-
      A cluster of domain entities treated as a single transactional unit.
      Corresponds to DDD aggregate concept.
    attributes:
      value_objects:
        range: ValueObject
        multivalued: true
        inlined_as_list: true
      aggregates_entities:
        range: DomainEntity
        multivalued: true
        inlined_as_list: true
        inverse: aggregated_by
      has_root_entity:
        range: DomainEntity
        required: true
        inverse: is_root_of_aggregate
      enforced_by_invariant_rules:
        range: Rule
        multivalued: true
        inverse: enforces_aggregate_invariants
      persisted_in_stores:
        range: DataStore
        multivalued: true
        inverse: persists_aggregates
      contained_in_bounded_context:
        range: BoundedContext
        inverse: contains_aggregates
      produces_domain_events:
        range: DomainEvent
        multivalued: true
        inverse: produced_by_aggregate
      aggregate_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_aggregate

  DomainEntity:
    is_a: NamedEntity
    mixins:
      - Auditable
    description: >-
      A uniquely identifiable object within the domain
    attributes:
      attributes:
        range: Attribute
        multivalued: true
        inlined_as_list: true
      classifications:
        range: DataClassificationType
        multivalued: true
      aggregated_by:
        range: Aggregate
        inverse: aggregates_entities
      exposes_as_resource:
        range: Resource
        multivalued: true
        inverse: represents_entity
      governed_by_lifecycle:
        range: Lifecycle
        inverse: governs_entities
      in_state:
        range: State
        inverse: current_for_entities
      governed_by_rules:
        range: Rule
        multivalued: true
        inverse: governs_domain_entities
      is_root_of_aggregate:
        range: Aggregate
        inverse: has_root_entity
      mapped_from_structure:
        range: DataStructure
        multivalued: true
        inverse: maps_to_domain_entity
      outgoing_relationships:
        range: DomainRelationship
        multivalued: true
        inverse: source_entity
      incoming_relationships:
        range: DomainRelationship
        multivalued: true
        inverse: target_entity
      entity_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_domain_entity

  ValueObject:
    is_a: NamedEntity
    description: >-
      An immutable domain object defined by its attributes
    attributes:
      attributes:
        range: Attribute
        multivalued: true
        inlined_as_list: true
      mapped_from_structure_vo:
        range: DataStructure
        multivalued: true
        inverse: maps_to_value_object

  Attribute:
    is_a: NamedEntity
    description: >-
      A named property of an entity or value object
    attributes:
      category:
        range: AttributeCategory
      data_type:
        range: string
        required: true
      is_identifier:
        range: boolean
      is_indexed:
        range: boolean
      default_value:
        range: string
      classification:
        range: DataClassificationType
      validated_by_rules:
        range: Rule
        multivalued: true
        inverse: validates_attributes
      mapped_from_element:
        range: DataElement
        multivalued: true
        inverse: maps_to_attribute

  Resource:
    is_a: NamedEntity
    description: >-
      A domain entity or value object exposed for external interaction
    attributes:
      represents_entity:
        range: DomainEntity
        inverse: exposes_as_resource
      classified_as_type:
        range: ResourceType
        inverse: classifies_resources
      targeted_by_actions:
        range: Action
        multivalued: true
        inverse: targets_resources
      affected_in_audit:
        range: AuditEntry
        multivalued: true
        inverse: affects_resource

  ResourceType:
    is_a: NamedEntity
    description: >-
      A classification of resources sharing common structure and behavior
    attributes:
      structured_by_schema:
        range: Schema
        inverse: structures_resource_types
      classifies_resources:
        range: Resource
        multivalued: true
        inverse: classified_as_type
      governed_by_permissions:
        range: Permission
        multivalued: true
        inverse: applies_to_resource_types

  # State and Lifecycle
  State:
    is_a: NamedEntity
    description: >-
      A discrete condition in an entity's lifecycle
    attributes:
      is_initial:
        range: boolean
      is_terminal:
        range: boolean
      allows_actions_in_state:
        range: Action
        multivalued: true
        inverse: allowed_in_states
      current_for_entities:
        range: DomainEntity
        multivalued: true
        inverse: in_state
      source_of_transitions:
        range: Transition
        multivalued: true
        inverse: transitions_from_state
      target_of_transitions:
        range: Transition
        multivalued: true
        inverse: transitions_to_state
      initial_for_lifecycle:
        range: Lifecycle
        inverse: starts_with_state

  Transition:
    is_a: NamedEntity
    description: >-
      A valid movement between states
    attributes:
      transitions_from_state:
        range: State
        required: true
        inverse: source_of_transitions
      transitions_to_state:
        range: State
        required: true
        inverse: target_of_transitions
      triggered_by_events:
        range: Event
        multivalued: true
        inverse: triggers_transitions
      guarded_by_rules:
        range: Rule
        multivalued: true
        inverse: guards_transitions
      executes_actions_on_transition:
        range: Action
        multivalued: true
        inverse: executed_during_transition

  Lifecycle:
    is_a: NamedEntity
    description: >-
      The complete set of states and transitions for an entity type
    attributes:
      states:
        range: State
        multivalued: true
        inlined_as_list: true
      transitions:
        range: Transition
        multivalued: true
        inlined_as_list: true
      starts_with_state:
        range: State
        inverse: initial_for_lifecycle
      governs_entities:
        range: DomainEntity
        multivalued: true
        inverse: governed_by_lifecycle

  # SECTION 5: BEHAVIOR AND WORKFLOW

  Action:
    is_a: NamedEntity
    abstract: true
    description: >-
      An atomic operation that can be performed
    attributes:
      category:
        range: ActionCategory
      allowed_by_permissions:
        range: Permission
        multivalued: true
        inverse: allows_actions
      performed_by_actor:
        range: Actor
        inverse: performs_actions
      targets_resources:
        range: Resource
        multivalued: true
        inverse: targeted_by_actions
      emits_events_from_action:
        range: Event
        multivalued: true
        inverse: emitted_by_action
      validated_by_action_rules:
        range: Rule
        multivalued: true
        inverse: validates_actions
      executes_in_transaction:
        range: Transaction
        inverse: executes_actions
      allowed_in_states:
        range: State
        multivalued: true
        inverse: allows_actions_in_state
      executed_during_transition:
        range: Transition
        multivalued: true
        inverse: executes_actions_on_transition
      executed_by_operation:
        range: Operation
        multivalued: true
        inverse: executes_operation_actions
      executed_in_step:
        range: Step
        multivalued: true
        inverse: executes_actions_in_step
      recorded_in_audit:
        range: AuditEntry
        multivalued: true
        inverse: records_action

  Query:
    is_a: Action
    description: A read-only action that retrieves data
    attributes:
      filters:
        range: string
        multivalued: true
      projections:
        range: string
        multivalued: true

  Command:
    is_a: Action
    description: An action that changes system state
    attributes:
      command_type:
        range: CommandType
      idempotency_key:
        range: string

  Operation:
    is_a: NamedEntity
    description: >-
      A named, invocable unit of behavior exposed via an interface
    attributes:
      errors:
        range: string
        multivalued: true
      exposed_by_component:
        range: Component
        inverse: exposes_operations
      executes_operation_actions:
        range: Action
        multivalued: true
        inverse: executed_by_operation
      accepts_input_schema:
        range: Schema
        inverse: defines_operation_input
      produces_output_schema:
        range: Schema
        inverse: defines_operation_output
      implemented_by_callables:
        range: CallableUnit
        multivalued: true
        inverse: implements_operation
      offered_on_screens:
        range: Screen
        multivalued: true
        inverse: offers_operations
      operation_tested_by_cases:
        range: TestCase
        multivalued: true
        inverse: tests_operation

  Workflow:
    is_a: NamedEntity
    description: >-
      A coordinated sequence of actions achieving a business goal
    attributes:
      workflow_type:
        range: WorkflowType
      steps:
        range: Step
        multivalued: true
        inlined_as_list: true
      triggered_by_workflow_events:
        range: Event
        multivalued: true
        inverse: triggers_workflows

  Step:
    is_a: NamedEntity
    description: >-
      A discrete stage within a workflow
    attributes:
      order:
        range: integer
      condition:
        range: string
      timeout_seconds:
        range: integer
      executes_actions_in_step:
        range: Action
        multivalued: true
        inverse: executed_in_step
      followed_by_steps:
        range: Step
        multivalued: true
        inverse: follows_step
      follows_step:
        range: Step
        multivalued: true
        inverse: followed_by_steps
      compensated_by_step:
        range: Step
        inverse: compensates_for_step
      compensates_for_step:
        range: Step
        inverse: compensated_by_step

  Rule:
    is_a: NamedEntity
    description: >-
      A declarative constraint or trigger governing behavior
    attributes:
      category:
        range: RuleCategory
      condition:
        range: string
      action:
        range: string
      priority:
        range: integer
      is_active:
        range: boolean
      validates_attributes:
        range: Attribute
        multivalued: true
        inverse: validated_by_rules
      enforces_aggregate_invariants:
        range: Aggregate
        multivalued: true
        inverse: enforced_by_invariant_rules
      governs_domain_entities:
        range: DomainEntity
        multivalued: true
        inverse: governed_by_rules
      validates_actions:
        range: Action
        multivalued: true
        inverse: validated_by_action_rules
      guards_transitions:
        range: Transition
        multivalued: true
        inverse: guarded_by_rules

  # Event and Subscription
  Event:
    is_a: NamedEntity
    description: >-
      A notification that something occurred
    attributes:
      category:
        range: EventCategory
      correlation_id:
        range: string
      emitted_by_component:
        range: Component
        inverse: emits_events
      event_structured_by_schema:
        range: Schema
        inverse: structures_events
      emitted_by_action:
        range: Action
        multivalued: true
        inverse: emits_events_from_action
      triggers_transitions:
        range: Transition
        multivalued: true
        inverse: triggered_by_events
      triggers_workflows:
        range: Workflow
        multivalued: true
        inverse: triggered_by_workflow_events
      subscribed_by_subscriptions:
        range: Subscription
        multivalued: true
        inverse: subscribes_to_event_types

  DomainEvent:
    is_a: Event
    description: A significant occurrence in the domain
    attributes:
      produced_by_aggregate:
        range: Aggregate
        inverse: produces_domain_events

  IntegrationEvent:
    is_a: Event
    description: An event for cross-service communication
    attributes:
      targeted_at_services:
        range: Service
        multivalued: true
        inverse: receives_integration_events

  Subscription:
    is_a: NamedEntity
    description: >-
      A registration to receive events of a certain type
    attributes:
      filter:
        range: string
      delivery_mode:
        range: string
      subscribes_to_event_types:
        range: Event
        multivalued: true
        inverse: subscribed_by_subscriptions
      subscribed_by_actor:
        range: Actor
        inverse: actor_subscriptions
      subscribes_to_interface:
        range: EventInterface
        inverse: has_subscriptions

  Transaction:
    is_a: NamedEntity
    description: >-
      A unit of work with ACID or BASE guarantees
    attributes:
      transaction_type:
        range: TransactionType
      isolation_level:
        range: string
      timeout_seconds:
        range: integer
      executes_actions:
        range: Action
        multivalued: true
        inverse: executes_in_transaction

  # SECTION 6: DATA MANAGEMENT

  DataStore:
    is_a: NamedEntity
    description: >-
      A persistence mechanism
    attributes:
      store_type:
        range: DataStoreType
      connection_string:
        range: string
      collections:
        range: Collection
        multivalued: true
        inlined_as_list: true
      hosted_on_infrastructure:
        range: Infrastructure
        inverse: hosts_datastores
      persists_aggregates:
        range: Aggregate
        multivalued: true
        inverse: persisted_in_stores
      store_read_by_pipelines:
        range: DataPipeline
        multivalued: true
        inverse: pipeline_reads_from_stores
      store_written_by_pipelines:
        range: DataPipeline
        multivalued: true
        inverse: pipeline_writes_to_stores
      store_file_definitions:
        range: FileDefinition
        multivalued: true
        inverse: persisted_in_store

  Collection:
    is_a: NamedEntity
    description: >-
      A logical grouping of records (table, collection, bucket)
    attributes:
      indexes:
        range: string
        multivalued: true
        description: >-
          Index definitions as strings (DEPRECATED -- use has_indexes)
      collection_structured_by_schema:
        range: Schema
        inverse: structures_collections
      governed_by_retention_policy:
        range: RetentionPolicy
        inverse: governs_collections
      stores_records:
        range: Record
        multivalued: true
        inverse: stored_in_collection
      persists_structures:
        range: DataStructure
        multivalued: true
        inverse: persisted_in_collection
      has_constraints:
        range: DatabaseConstraint
        multivalued: true
        inlined_as_list: true
        inverse: constraint_on_collection
      has_indexes:
        range: DatabaseIndex
        multivalued: true
        inlined_as_list: true
        inverse: index_on_collection

  Record:
    is_a: NamedEntity
    description: >-
      A single persisted instance of data
    attributes:
      classifications:
        range: DataClassificationType
        multivalued: true
      stored_in_collection:
        range: Collection
        inverse: stores_records
      conforms_to_schema:
        range: Schema
        inverse: validates_records
      has_lineage:
        range: DataLineage
        inverse: tracks_record
      source_of_lineage:
        range: DataLineage
        multivalued: true
        inverse: derived_from_records

  Schema:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      The structural definition of stored data
    attributes:
      schema_type:
        range: SchemaType
      definition:
        range: string
      schema_versions:
        range: SchemaVersion
        multivalued: true
        inlined_as_list: true
        inverse: version_of_schema
      structures_resource_types:
        range: ResourceType
        multivalued: true
        inverse: structured_by_schema
      structures_collections:
        range: Collection
        multivalued: true
        inverse: collection_structured_by_schema
      structures_events:
        range: Event
        multivalued: true
        inverse: event_structured_by_schema
      structures_messages:
        range: Message
        multivalued: true
        inverse: message_structured_by_schema
      defines_operation_input:
        range: Operation
        multivalued: true
        inverse: accepts_input_schema
      defines_operation_output:
        range: Operation
        multivalued: true
        inverse: produces_output_schema
      validates_records:
        range: Record
        multivalued: true
        inverse: conforms_to_schema

  SchemaVersion:
    is_a: NamedEntity
    description: >-
      A specific iteration of a schema
    attributes:
      version:
        range: SemanticVersion
      definition:
        range: string
      migration_script:
        range: string
      is_backward_compatible:
        range: boolean
      version_of_schema:
        range: Schema
        inverse: schema_versions

  DataClassification:
    is_a: NamedEntity
    description: >-
      A sensitivity or handling category
    attributes:
      classification_type:
        range: DataClassificationType
      handling_requirements:
        range: string
        multivalued: true
      encryption_required:
        range: boolean

  RetentionPolicy:
    is_a: NamedEntity
    description: >-
      Rules governing data lifecycle and deletion
    attributes:
      retention_days:
        range: integer
      archive_after_days:
        range: integer
      deletion_strategy:
        range: string
      governs_collections:
        range: Collection
        multivalued: true
        inverse: governed_by_retention_policy
      governs_logs:
        range: Log
        multivalued: true
        inverse: log_governed_by_retention
      governs_audit_logs:
        range: AuditLog
        multivalued: true
        inverse: auditlog_governed_by_retention

  DataLineage:
    is_a: NamedEntity
    description: >-
      The origin, transformation history, and movement of data
    attributes:
      source:
        range: string
      transformations:
        range: string
        multivalued: true
      derived_from_records:
        range: Record
        multivalued: true
        inverse: source_of_lineage
      tracks_record:
        range: Record
        inverse: has_lineage

  AuditLog:
    is_a: NamedEntity
    description: >-
      A tamper-evident record of system activities
    attributes:
      entries:
        range: AuditEntry
        multivalued: true
      auditlog_governed_by_retention:
        range: RetentionPolicy
        inverse: governs_audit_logs
      audit_log_entries:
        range: AuditEntry
        multivalued: true
        inverse: entry_in_audit_log

  AuditEntry:
    is_a: NamedEntity
    description: >-
      A single record within an audit log
    attributes:
      timestamp:
        range: Timestamp
        required: true
      outcome:
        range: string
      details:
        range: string
      entry_in_audit_log:
        range: AuditLog
        inverse: audit_log_entries
      audit_performed_by_actor:
        range: Actor
        inverse: audit_actions_performed
      records_action:
        range: Action
        inverse: recorded_in_audit
      affects_resource:
        range: Resource
        inverse: affected_in_audit

  # SECTION 7: INTEGRATION

  ExternalSystem:
    is_a: NamedEntity
    description: >-
      A system outside this system's boundary
    attributes:
      system_type:
        range: ExternalSystemType
      owner:
        range: string
      sla:
        range: string
      documentation_url:
        range: URI
      integrated_via:
        range: Integration
        multivalued: true
        inverse: integrates_with_system

  Integration:
    is_a: NamedEntity
    description: >-
      A configured connection to an external system
    attributes:
      integration_type:
        range: IntegrationType
      protocol:
        range: ProtocolType
      messages:
        range: Message
        multivalued: true
        inlined_as_list: true
      integrates_with_system:
        range: ExternalSystem
        inverse: integrated_via
      uses_adapter:
        range: Adapter
        inverse: used_by_integrations
      protected_by_breaker:
        range: CircuitBreaker
        inverse: protects_integrations
      integration_governed_by_contract:
        range: Contract
        inverse: governs_integrations
      belongs_to_system:
        range: System
        inverse: has_integrations
      integration_documented_by_artifacts:
        range: KnowledgeArtifact
        multivalued: true
        inverse: documents_integration

  Message:
    is_a: NamedEntity
    description: >-
      A unit of data exchanged in integration
    attributes:
      message_type:
        range: MessageType
      message_structured_by_schema:
        range: Schema
        inverse: structures_messages
      validated_by_contract:
        range: Contract
        inverse: validates_messages

  Contract:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A formal specification of integration behavior
    attributes:
      contract_type:
        range: ContractType
      definition:
        range: string
      contract_versions:
        range: ContractVersion
        multivalued: true
        inlined_as_list: true
        inverse: version_of_contract
      defines_interfaces:
        range: Interface
        multivalued: true
        inverse: defined_by_contract
      implemented_by_units:
        range: EncapsulationUnit
        multivalued: true
        inverse: implements_contracts
      validates_messages:
        range: Message
        multivalued: true
        inverse: validated_by_contract
      governs_integrations:
        range: Integration
        multivalued: true
        inverse: integration_governed_by_contract

  ContractVersion:
    is_a: NamedEntity
    description: >-
      A specific iteration of a contract
    attributes:
      version:
        range: SemanticVersion
      definition:
        range: string
      breaking_changes:
        range: string
        multivalued: true
      version_of_contract:
        range: Contract
        inverse: contract_versions

  Adapter:
    is_a: Component
    description: >-
      A component that translates between system and external protocols
    attributes:
      source_protocol:
        range: ProtocolType
      target_protocol:
        range: ProtocolType
      transformation:
        range: string
      used_by_integrations:
        range: Integration
        multivalued: true
        inverse: uses_adapter

  CircuitBreaker:
    is_a: NamedEntity
    description: >-
      A resilience pattern preventing cascade failures
    attributes:
      failure_threshold:
        range: integer
      reset_timeout_seconds:
        range: integer
      half_open_requests:
        range: integer
      protects_integrations:
        range: Integration
        multivalued: true
        inverse: protected_by_breaker

  # SECTION 8: DEPLOYMENT AND OPERATIONS

  Environment:
    is_a: NamedEntity
    description: >-
      A runtime context with specific configuration
    attributes:
      environment_type:
        range: EnvironmentType
      hosts_deployments:
        range: Deployment
        multivalued: true
        inverse: deployed_in_environment
      env_configured_by:
        range: Configuration
        multivalued: true
        inverse: configures_environments
      uses_infrastructure:
        range: Infrastructure
        multivalued: true
        inverse: used_by_environments
      deployed_by_pipelines:
        range: BuildPipeline
        multivalued: true
        inverse: pipeline_deploys_to_environments

  Deployment:
    is_a: NamedEntity
    description: >-
      An instance of a service running in an environment
    attributes:
      replicas:
        range: integer
      deploys_service:
        range: Service
        inverse: deployed_as
      deployed_in_environment:
        range: Environment
        inverse: hosts_deployments
      deploys_unit:
        range: DeploymentUnit
        inverse: deployed_in_deployments
      deployment_configured_by:
        range: Configuration
        multivalued: true
        inverse: configures_deployments
      deploys_release:
        range: Release
        inverse: deployed_in_deployments_as_release

  DeploymentUnit:
    is_a: NamedEntity
    description: >-
      The packaged artifact being deployed
    attributes:
      unit_type:
        range: DeploymentUnitType
      artifact_uri:
        range: URI
      checksum:
        range: string
      deployed_in_deployments:
        range: Deployment
        multivalued: true
        inverse: deploys_unit

  Configuration:
    is_a: NamedEntity
    description: >-
      Runtime parameters for a deployment
    attributes:
      config_type:
        range: ConfigurationType
      value:
        range: string
      is_secret:
        range: boolean
      source:
        range: string
      controls_features:
        range: Feature
        multivalued: true
        inverse: controlled_by_configs
      configures_environments:
        range: Environment
        multivalued: true
        inverse: env_configured_by
      configures_deployments:
        range: Deployment
        multivalued: true
        inverse: deployment_configured_by

  Infrastructure:
    is_a: NamedEntity
    description: >-
      The underlying compute, storage, and network resources
    attributes:
      infra_type:
        range: InfrastructureType
      provider:
        range: string
      region:
        range: string
      specifications:
        range: string
      hosts_datastores:
        range: DataStore
        multivalued: true
        inverse: hosted_on_infrastructure
      used_by_environments:
        range: Environment
        multivalued: true
        inverse: uses_infrastructure
      infrastructure_provisioned_by_iac:
        range: IaCDefinition
        multivalued: true
        inverse: iac_provisions_infrastructure

  Release:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A versioned, deployable package of changes
    attributes:
      version:
        range: SemanticVersion
      changelog:
        range: string
      artifacts:
        range: DeploymentUnit
        multivalued: true
      deployed_in_deployments_as_release:
        range: Deployment
        multivalued: true
        inverse: deploys_release

  # SECTION 9: OBSERVABILITY

  Metric:
    is_a: NamedEntity
    description: >-
      A quantitative measurement over time
    attributes:
      metric_type:
        range: MetricType
      unit:
        range: string
      labels:
        range: string
        multivalued: true
      metric_emitted_by_component:
        range: Component
        inverse: emits_metric
      monitored_by_alert_rules:
        range: AlertRule
        multivalued: true
        inverse: monitors_metrics

  Log:
    is_a: NamedEntity
    description: >-
      A timestamped record of discrete events
    attributes:
      log_type:
        range: LogType
      entries:
        range: LogEntry
        multivalued: true
      log_governed_by_retention:
        range: RetentionPolicy
        inverse: governs_logs
      log_entries:
        range: LogEntry
        multivalued: true
        inverse: entry_in_log

  LogEntry:
    is_a: NamedEntity
    description: >-
      A single record within a log
    attributes:
      timestamp:
        range: Timestamp
      level:
        range: string
      message:
        range: string
      context:
        range: string
      entry_in_log:
        range: Log
        inverse: log_entries

  Trace:
    is_a: NamedEntity
    description: >-
      A causal chain of operations across services
    attributes:
      trace_id:
        range: string
      spans:
        range: Span
        multivalued: true
        inlined_as_list: true
      starts_with_span:
        range: Span
        inverse: root_of_trace
      trace_spans:
        range: Span
        multivalued: true
        inverse: belongs_to_trace

  Span:
    is_a: NamedEntity
    description: >-
      A single unit of work within a trace
    attributes:
      span_id:
        range: string
      operation_name:
        range: string
      start_time:
        range: Timestamp
      end_time:
        range: Timestamp
      status:
        range: string
      attributes:
        range: string
        multivalued: true
      belongs_to_trace:
        range: Trace
        inverse: trace_spans
      child_of_span:
        range: Span
        inverse: parent_of_spans
      parent_of_spans:
        range: Span
        multivalued: true
        inverse: child_of_span
      root_of_trace:
        range: Trace
        inverse: starts_with_span

  Alert:
    is_a: NamedEntity
    description: >-
      A notification triggered by metric thresholds or anomalies
    attributes:
      severity:
        range: string
      triggered_at:
        range: Timestamp
      acknowledged_at:
        range: Timestamp
      resolved_at:
        range: Timestamp
      triggered_by_rule:
        range: AlertRule
        inverse: triggers_alerts
      escalates_to_incident:
        range: Incident
        multivalued: true
        inverse: escalated_from_alerts

  AlertRule:
    is_a: Rule
    description: >-
      The condition that triggers an alert
    attributes:
      condition:
        range: string
      threshold:
        range: float
      duration_seconds:
        range: integer
      notification_channels:
        range: string
        multivalued: true
      monitors_metrics:
        range: Metric
        multivalued: true
        inverse: monitored_by_alert_rules
      triggers_alerts:
        range: Alert
        multivalued: true
        inverse: triggered_by_rule

  Incident:
    is_a: NamedEntity
    description: >-
      A tracked degradation or outage event
    attributes:
      severity:
        range: string
      status:
        range: string
      started_at:
        range: Timestamp
      resolved_at:
        range: Timestamp
      root_cause:
        range: string
      postmortem_url:
        range: URI
      escalated_from_alerts:
        range: Alert
        multivalued: true
        inverse: escalates_to_incident
      affects_services:
        range: Service
        multivalued: true
        inverse: affected_by_incidents

  HealthCheck:
    is_a: NamedEntity
    description: >-
      A probe verifying service availability
    attributes:
      check_type:
        range: HealthCheckType
      endpoint:
        range: string
      interval_seconds:
        range: integer
      timeout_seconds:
        range: integer
      success_threshold:
        range: integer
      failure_threshold:
        range: integer

  # SECTION 10: GOVERNANCE AND COMPLIANCE

  ComplianceRequirement:
    is_a: NamedEntity
    description: >-
      A regulatory or policy obligation
    attributes:
      framework:
        range: ComplianceFramework
      controls:
        range: Control
        multivalued: true
        inlined_as_list: true
      effective_date:
        range: Timestamp
      applies_to_systems:
        range: System
        multivalued: true
        inverse: must_comply_with

  Control:
    is_a: NamedEntity
    description: >-
      A measure implementing a compliance requirement
    attributes:
      control_id:
        range: string
      implementation:
        range: string
      evidence:
        range: Evidence
        multivalued: true
        inlined_as_list: true
      frequency:
        range: string
      owned_by_actor:
        range: Actor
        inverse: owns_controls
      mitigates_risks:
        range: RiskAssessment
        multivalued: true
        inverse: mitigated_by_controls

  Evidence:
    is_a: NamedEntity
    description: >-
      Proof that a control is operating effectively
    attributes:
      evidence_type:
        range: string
      collected_at:
        range: Timestamp
      artifact_uri:
        range: URI
      verified_by_actor:
        range: Actor
        inverse: verifies_evidence

  RiskAssessment:
    is_a: NamedEntity
    description: >-
      An evaluation of threats and vulnerabilities
    attributes:
      assessed_at:
        range: Timestamp
      risk_level:
        range: string
      threats:
        range: string
        multivalued: true
      vulnerabilities:
        range: string
        multivalued: true
      residual_risk:
        range: string
      mitigated_by_controls:
        range: Control
        multivalued: true
        inverse: mitigates_risks
      assesses_system:
        range: System
        inverse: assessed_by

  # SECTION 11: TESTING

  TestSuite:
    is_a: NamedEntity
    description: >-
      A collection of related test cases
    attributes:
      suite_type:
        range: TestSuiteType
        required: true
      framework:
        range: string
      source_location:
        range: string
      total_cases:
        range: integer
      passing_cases:
        range: integer
      failing_cases:
        range: integer
      skipped_cases:
        range: integer
      execution_time_ms:
        range: integer
      contains_test_cases:
        range: TestCase
        multivalued: true
        inverse: belongs_to_suite
      tests_component:
        range: Component
        inverse: tested_by_suites
      tests_module:
        range: Module
        inverse: module_tested_by_suites

  TestCase:
    is_a: NamedEntity
    description: >-
      A single test case that validates specific behavior
    attributes:
      status:
        range: TestCaseStatus
      priority:
        range: string
      is_automated:
        range: boolean
      setup_fixture:
        range: string
      teardown_fixture:
        range: string
      line_start:
        range: integer
      line_end:
        range: integer
      assertions:
        range: TestAssertion
        multivalued: true
        inlined_as_list: true
      belongs_to_suite:
        range: TestSuite
        inverse: contains_test_cases
      tests_callable:
        range: CallableUnit
        inverse: tested_by_cases
      tests_operation:
        range: Operation
        inverse: operation_tested_by_cases

  TestAssertion:
    is_a: NamedEntity
    description: >-
      An individual assertion within a test case
    attributes:
      assertion_type:
        range: AssertionType
      expected_value:
        range: string
      line_number:
        range: integer

  TestCoverage:
    is_a: NamedEntity
    description: >-
      Code coverage metrics for a component or module
    attributes:
      line_coverage_percent:
        range: float
      branch_coverage_percent:
        range: float
      function_coverage_percent:
        range: float
      statement_coverage_percent:
        range: float
      uncovered_lines:
        range: integer
        multivalued: true
      coverage_tool:
        range: string
      coverage_for_component:
        range: Component
        inverse: has_coverage
      coverage_for_module:
        range: Module
        inverse: module_has_coverage

  # SECTION 12: UI/FRONTEND STRUCTURE

  UIComponent:
    is_a: NamedEntity
    description: >-
      A frontend user interface component that renders visual elements.
    attributes:
      component_type:
        range: UIComponentType
        required: true
      framework:
        range: string
      props:
        range: UIProperty
        multivalued: true
        inlined_as_list: true
      emitted_events:
        range: string
        multivalued: true
      is_lazy_loaded:
        range: boolean
      is_server_rendered:
        range: boolean
      accessibility_role:
        range: string
      source_location:
        range: string
      parent_ui_component:
        range: UIComponent
        inverse: child_ui_components
      child_ui_components:
        range: UIComponent
        multivalued: true
        inverse: parent_ui_component
      renders_on_route:
        range: Route
        multivalued: true
        inverse: route_renders_component
      managed_by_state:
        range: StateStore
        multivalued: true
        inverse: manages_ui_components
      ui_implements_encapsulation_unit:
        range: EncapsulationUnit
        inverse: encapsulation_unit_renders_ui

  UIProperty:
    is_a: NamedEntity
    description: >-
      A property (prop) passed to a UI component
    attributes:
      data_type:
        range: string
      is_required:
        range: boolean
      default_value:
        range: string
      is_reactive:
        range: boolean

  Route:
    is_a: NamedEntity
    description: >-
      A navigation route or URL path in a frontend application.
    attributes:
      path_pattern:
        range: string
        required: true
      route_type:
        range: RouteType
      http_methods:
        range: string
        multivalued: true
      is_dynamic:
        range: boolean
      is_authenticated:
        range: boolean
      route_renders_component:
        range: UIComponent
        inverse: renders_on_route
      parent_route:
        range: Route
        inverse: child_routes
      child_routes:
        range: Route
        multivalued: true
        inverse: parent_route
      route_guarded_by:
        range: Policy
        multivalued: true
        inverse: guards_routes

  StateStore:
    is_a: NamedEntity
    description: >-
      A frontend state management store or container.
    attributes:
      management_type:
        range: StateManagementType
        required: true
      framework:
        range: string
      state_shape:
        range: DataStructure
      actions:
        range: string
        multivalued: true
      selectors:
        range: string
        multivalued: true
      manages_ui_components:
        range: UIComponent
        multivalued: true
        inverse: managed_by_state

  # SECTION 13: BUILD AND CI/CD

  BuildPipeline:
    is_a: NamedEntity
    description: >-
      A CI/CD pipeline that automates build, test, and deployment processes.
    attributes:
      pipeline_type:
        range: PipelineType
        required: true
      platform:
        range: string
      trigger:
        range: string
        multivalued: true
      trigger_branches:
        range: string
        multivalued: true
      source_file:
        range: string
      stages:
        range: PipelineStage
        multivalued: true
        inlined_as_list: true
      timeout_minutes:
        range: integer
      is_parallelizable:
        range: boolean
      pipeline_deploys_to_environments:
        range: Environment
        multivalued: true
        inverse: deployed_by_pipelines
      pipeline_produces_artifacts:
        range: BuildArtifact
        multivalued: true
        inverse: artifact_produced_by_pipeline
      pipeline_trains_model:
        range: MLModel
        multivalued: true
        inverse: model_trained_by_pipeline
      pipeline_uses_iac:
        range: IaCDefinition
        multivalued: true
        inverse: iac_used_by_pipeline

  PipelineStage:
    is_a: NamedEntity
    description: >-
      A discrete stage within a CI/CD pipeline
    attributes:
      stage_type:
        range: PipelineStageType
        required: true
      order:
        range: integer
      depends_on_stages:
        range: string
        multivalued: true
      condition:
        range: string
      runner:
        range: string
      timeout_minutes:
        range: integer
      environment_variables:
        range: string
        multivalued: true
      is_manual:
        range: boolean

  BuildArtifact:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      An artifact produced by a build pipeline
    attributes:
      artifact_type:
        range: ArtifactType
        required: true
      artifact_uri:
        range: URI
      size_bytes:
        range: integer
      checksum:
        range: string
      build_number:
        range: string
      artifact_produced_by_pipeline:
        range: BuildPipeline
        inverse: pipeline_produces_artifacts
      artifact_stored_in_registry:
        range: ArtifactRegistry
        inverse: stores_artifacts

  ArtifactRegistry:
    is_a: NamedEntity
    description: >-
      A registry or repository for storing build artifacts.
    attributes:
      registry_type:
        range: string
      base_url:
        range: URI
      is_private:
        range: boolean
      stores_artifacts:
        range: BuildArtifact
        multivalued: true
        inverse: artifact_stored_in_registry

  # SECTION 14: DEPENDENCY MANAGEMENT

  PackageManager:
    is_a: NamedEntity
    description: >-
      A package/dependency management tool
    attributes:
      manager_type:
        range: PackageManagerType
        required: true
      manifest_file:
        range: string
      lock_file:
        range: string
      registry_url:
        range: URI
      manages_dependencies_for_module:
        range: Module
        multivalued: true
        inverse: module_managed_by_package_manager

  PackageDependency:
    is_a: NamedEntity
    description: >-
      A declared dependency on an external package or library
    attributes:
      package_name:
        range: string
        required: true
      version_constraint:
        range: string
      resolved_version:
        range: string
      scope:
        range: DependencyScope
      is_direct:
        range: boolean
      license:
        range: string
      known_vulnerabilities:
        range: KnownVulnerability
        multivalued: true
        inlined_as_list: true
      dependency_of_module:
        range: Module
        inverse: module_has_dependencies
      has_transitive_dependencies:
        range: PackageDependency
        multivalued: true
        inverse: transitive_dependency_of
      transitive_dependency_of:
        range: PackageDependency
        multivalued: true
        inverse: has_transitive_dependencies

  KnownVulnerability:
    is_a: NamedEntity
    description: >-
      A known security vulnerability in a dependency
    attributes:
      cve_id:
        range: string
      severity:
        range: VulnerabilitySeverity
        required: true
      cvss_score:
        range: float
      affected_versions:
        range: string
      fixed_version:
        range: string
      advisory_url:
        range: URI

  # SECTION 15: CONCURRENCY

  ConcurrencyPrimitive:
    is_a: NamedEntity
    description: >-
      A low-level synchronization primitive used in concurrent code.
    attributes:
      primitive_type:
        range: ConcurrencyPrimitiveType
        required: true
      is_reentrant:
        range: boolean
      timeout_ms:
        range: integer
      line_number:
        range: integer
      used_by_callables:
        range: CallableUnit
        multivalued: true
        inverse: uses_concurrency_primitives
      protects_data_elements:
        range: DataElement
        multivalued: true
        inverse: protected_by_primitive

  ConcurrencyPattern:
    is_a: NamedEntity
    description: >-
      A high-level concurrency pattern used in the system.
    attributes:
      pattern_type:
        range: ConcurrencyPatternType
        required: true
      max_concurrency:
        range: integer
      framework:
        range: string
      shared_resources:
        range: string
        multivalued: true
      pattern_used_by_component:
        range: Component
        multivalued: true
        inverse: component_uses_concurrency_pattern

  # SECTION 16: ML/DATA PIPELINES

  MLModel:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A machine learning model defined, trained, or served by the system
    attributes:
      model_type:
        range: MLModelType
        required: true
      framework:
        range: string
      model_format:
        range: string
      model_uri:
        range: URI
      input_schema:
        range: DataStructure
      output_schema:
        range: DataStructure
      metrics:
        range: MLModelMetric
        multivalued: true
        inlined_as_list: true
      model_trained_by_pipeline:
        range: DataPipeline
        inverse: pipeline_trains_model
      model_served_by_component:
        range: Component
        inverse: component_serves_model
      model_uses_feature_store:
        range: FeatureStore
        multivalued: true
        inverse: provides_features_to_models

  MLModelMetric:
    is_a: NamedEntity
    description: >-
      A performance metric for an ML model
    attributes:
      metric_name:
        range: string
        required: true
      value:
        range: float
      dataset:
        range: string

  Dataset:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A dataset used for training, evaluation, or inference
    attributes:
      format:
        range: string
      storage_uri:
        range: URI
      row_count:
        range: integer
      schema:
        range: Schema
      classification:
        range: DataClassificationType
      dataset_used_by_pipeline:
        range: DataPipeline
        multivalued: true
        inverse: pipeline_uses_dataset

  FeatureStore:
    is_a: NamedEntity
    description: >-
      A centralized store for computed ML features.
    attributes:
      platform:
        range: string
      storage_backend:
        range: string
      feature_count:
        range: integer
      provides_features_to_models:
        range: MLModel
        multivalued: true
        inverse: model_uses_feature_store

  DataPipeline:
    is_a: NamedEntity
    description: >-
      A data processing pipeline for ETL, feature engineering, or model training.
    attributes:
      pipeline_type:
        range: DataPipelineType
        required: true
      orchestrator:
        range: string
      schedule:
        range: string
      source_file:
        range: string
      steps:
        range: DataPipelineStep
        multivalued: true
        inlined_as_list: true
      pipeline_reads_from_stores:
        range: DataStore
        multivalued: true
        inverse: store_read_by_pipelines
      pipeline_writes_to_stores:
        range: DataStore
        multivalued: true
        inverse: store_written_by_pipelines
      pipeline_uses_dataset:
        range: Dataset
        multivalued: true
        inverse: dataset_used_by_pipeline

  DataPipelineStep:
    is_a: NamedEntity
    description: >-
      A discrete step within a data pipeline
    attributes:
      step_type:
        range: DataPipelineStepType
        required: true
      order:
        range: integer
      depends_on_steps:
        range: string
        multivalued: true
      transformation_logic:
        range: string
      input_schema:
        range: string
      output_schema:
        range: string

  # SECTION 17: INFRASTRUCTURE AS CODE

  IaCDefinition:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      An infrastructure-as-code definition that declaratively specifies
      infrastructure resources.
    attributes:
      tool:
        range: IaCToolType
        required: true
      source_file:
        range: string
      provider:
        range: string
      resources:
        range: IaCResource
        multivalued: true
        inlined_as_list: true
      iac_provisions_infrastructure:
        range: Infrastructure
        multivalued: true
        inverse: infrastructure_provisioned_by_iac
      iac_used_by_pipeline:
        range: BuildPipeline
        multivalued: true
        inverse: pipeline_uses_iac

  IaCResource:
    is_a: NamedEntity
    description: >-
      A single infrastructure resource defined in code
    attributes:
      resource_type:
        range: IaCResourceType
        required: true
      provider_resource_type:
        range: string
      properties:
        range: string
        multivalued: true
      depends_on_resources:
        range: string
        multivalued: true
      is_managed:
        range: boolean

  IaCModule:
    is_a: NamedEntity
    description: >-
      A reusable module of IaC definitions.
    attributes:
      source:
        range: string
      input_variables:
        range: string
        multivalued: true
      output_values:
        range: string
        multivalued: true
      child_resources:
        range: IaCResource
        multivalued: true
        inlined_as_list: true

  # SECTION 18: TYPE SYSTEM MODELING

  TypeExpression:
    is_a: NamedEntity
    description: >-
      A recursive type model for expressing complex types (generics, unions,
      pointers, function types, etc.) across all languages.
    attributes:
      type_kind:
        range: TypeKind
        required: true
      base_type:
        range: string
        description: Base type name (e.g., "List", "int", "String")
      type_parameters:
        range: TypeExpression
        multivalued: true
        inlined_as_list: true
        description: Generic type parameters (e.g., T in List<T>)
      type_constraints:
        range: string
        multivalued: true
        description: Constraints on type parameters
      is_nullable:
        range: boolean
      nullability_model:
        range: string
        description: How nullability is expressed (e.g., "optional", "nullable", "Option<T>")
      pointer_semantics:
        range: string
        description: Pointer/reference semantics (e.g., "raw", "smart", "weak")
      type_of_data_elements:
        range: DataElement
        multivalued: true
        inverse: declared_type
      type_of_parameters:
        range: Parameter
        multivalued: true
        inverse: parameter_type
      return_type_of_callables:
        range: CallableUnit
        multivalued: true
        inverse: return_type_expression

  # SECTION 19: ERROR HANDLING MODEL

  ErrorModel:
    is_a: NamedEntity
    description: >-
      Describes how a module or language handles errors
    attributes:
      strategy:
        range: ErrorHandlingStrategy
        required: true
      checkedness:
        range: ExceptionCheckedness
      modules_using_error_model:
        range: EncapsulationUnit
        multivalued: true
        inverse: error_model_for_module
      error_model_for_languages:
        range: ProgrammingLanguage
        multivalued: true
        inverse: default_error_model

  ExceptionType:
    is_a: NamedEntity
    description: >-
      A declared exception or error type in a codebase
    attributes:
      qualified_name:
        range: string
        description: Fully qualified type name
      is_checked:
        range: boolean
      parent_exception:
        range: ExceptionType
        inverse: child_exceptions
      child_exceptions:
        range: ExceptionType
        multivalued: true
        inverse: parent_exception
      raised_by_callables:
        range: CallableUnit
        multivalued: true
        inverse: raises_exception_types
      handled_by_callables:
        range: CallableUnit
        multivalued: true
        inverse: handles_exception_types

  # SECTION 20: FILE I/O DEFINITIONS

  FileDefinition:
    is_a: NamedEntity
    description: >-
      A file defined for I/O in a program (COBOL SELECT, C fopen, etc.)
    attributes:
      organization:
        range: FileOrganization
      access_mode:
        range: FileAccessMode
      record_format:
        range: RecordFormat
      record_length:
        range: integer
      block_size:
        range: integer
      key_fields:
        range: string
        multivalued: true
        description: Key field names for indexed files
      file_status_field:
        range: string
        description: Variable receiving I/O status codes
      external_name:
        range: string
        description: External/physical file name (DD name, path)
      used_by_callables:
        range: CallableUnit
        multivalued: true
        inverse: uses_file_definitions
      file_defined_in_container:
        range: CodeContainer
        inverse: container_file_definitions
      persisted_in_store:
        range: DataStore
        inverse: store_file_definitions
      file_operations:
        range: FileOperation
        multivalued: true
        inverse: operates_on_file
      mapped_from_dataset_allocations:
        range: DatasetAllocation
        multivalued: true
        inverse: maps_to_file_definition

  FileOperation:
    is_a: NamedEntity
    description: >-
      A specific I/O operation on a file definition
    attributes:
      operation_type:
        range: FileOperationType
        required: true
      condition_handling:
        range: string
        description: How I/O status conditions are handled
      operates_on_file:
        range: FileDefinition
        inverse: file_operations
      performed_in_callable:
        range: CallableUnit
        inverse: callable_file_operations

  # SECTION 21: SCREEN/TERMINAL INTERACTION

  ScreenDefinition:
    is_a: NamedEntity
    description: >-
      A terminal screen or map definition for character-mode UIs
    attributes:
      screen_type:
        range: ScreenType
        required: true
      rows:
        range: integer
      columns:
        range: integer
      external_name:
        range: string
        description: External map/display file name
      contains_screen_fields:
        range: ScreenField
        multivalued: true
        inlined_as_list: true
        inverse: field_on_screen
      program_uses_screens:
        range: EncapsulationUnit
        multivalued: true
        inverse: screen_used_by_programs
      screen_defined_in_container:
        range: CodeContainer
        inverse: container_screen_definitions

  ScreenField:
    is_a: NamedEntity
    description: >-
      A field on a terminal screen definition
    attributes:
      row:
        range: integer
      column:
        range: integer
      length:
        range: integer
      is_input:
        range: boolean
      is_protected:
        range: boolean
      attribute_byte:
        range: string
        description: Display attribute (bright, dark, protected, etc.)
      initial_value:
        range: string
      field_on_screen:
        range: ScreenDefinition
        inverse: contains_screen_fields
      maps_to_data_element:
        range: DataElement
        inverse: mapped_from_screen_fields

  # SECTION 22: JOB CONTROL / BATCH ORCHESTRATION

  JobDefinition:
    is_a: NamedEntity
    description: >-
      A batch job definition (JCL JOB, scheduler entry, cron job)
    attributes:
      job_class:
        range: string
      priority:
        range: integer
      restart_point:
        range: string
        description: Step or checkpoint for restart
      scheduling_info:
        range: string
        description: Schedule or trigger criteria
      contains_job_steps:
        range: JobStep
        multivalued: true
        inlined_as_list: true
        inverse: step_in_job
      depends_on_jobs:
        range: JobDefinition
        multivalued: true
        inverse: depended_on_by_jobs
      depended_on_by_jobs:
        range: JobDefinition
        multivalued: true
        inverse: depends_on_jobs

  JobStep:
    is_a: NamedEntity
    description: >-
      A single step within a batch job
    attributes:
      step_type:
        range: JobStepType
        required: true
      program_name:
        range: string
        description: Name of the program to execute
      condition_code:
        range: string
        description: Condition code checks (e.g., COND=(4,LT))
      region_size:
        range: string
        description: Memory region allocation
      step_in_job:
        range: JobDefinition
        inverse: contains_job_steps
      step_executes_program:
        range: EncapsulationUnit
        inverse: executed_by_job_steps
      allocates_datasets:
        range: DatasetAllocation
        multivalued: true
        inlined_as_list: true
        inverse: allocated_in_step

  DatasetAllocation:
    is_a: NamedEntity
    description: >-
      A dataset (DD) allocation within a job step
    attributes:
      dd_name:
        range: string
        description: DD name (logical file reference)
      dataset_name:
        range: string
        description: Physical dataset name (DSN)
      disposition:
        range: DatasetDisposition
      space_primary:
        range: string
      space_secondary:
        range: string
      record_format:
        range: RecordFormat
      allocated_in_step:
        range: JobStep
        inverse: allocates_datasets
      maps_to_file_definition:
        range: FileDefinition
        inverse: mapped_from_dataset_allocations

  # SECTION 23: INTER-PROCESS COMMUNICATION

  IPCConnection:
    is_a: NamedEntity
    description: >-
      A communication link between two programs/processes
    attributes:
      mechanism:
        range: IPCMechanism
        required: true
      is_synchronous:
        range: boolean
      transaction_scoped:
        range: boolean
        description: Whether the IPC participates in a transaction boundary
      ipc_source_program:
        range: EncapsulationUnit
        inverse: outgoing_ipc_connections
      ipc_target_program:
        range: EncapsulationUnit
        inverse: incoming_ipc_connections
      ipc_passes_data:
        range: DataStructure
        multivalued: true
        inverse: passed_via_ipc

  # SECTION 24: PREPROCESSOR / METAPROGRAMMING

  PreprocessorDirective:
    is_a: NamedEntity
    description: >-
      A preprocessor directive, macro, or metaprogramming construct
    attributes:
      directive_type:
        range: MetaprogrammingType
        required: true
      condition:
        range: string
        description: Conditional compilation expression
      expansion:
        range: string
        description: Expanded text or transformation result
      directive_defined_in_container:
        range: CodeContainer
        inverse: container_preprocessor_directives
      directive_affects_encapsulation_units:
        range: EncapsulationUnit
        multivalued: true
        inverse: affected_by_directives
      directive_affects_callables:
        range: CallableUnit
        multivalued: true
        inverse: callable_affected_by_directives

  # SECTION 25: MEMORY / OWNERSHIP MODEL

  MemoryModel:
    is_a: NamedEntity
    description: >-
      Describes how a language or module manages memory
    attributes:
      primary_model:
        range: OwnershipModel
        required: true
      gc_type:
        range: string
        description: GC algorithm if applicable (e.g., "generational", "mark-sweep")
      supports_unsafe:
        range: boolean
        description: Whether the model allows unsafe/manual memory access
      modules_using_memory_model:
        range: EncapsulationUnit
        multivalued: true
        inverse: memory_model_for_module
      memory_model_for_languages:
        range: ProgrammingLanguage
        multivalued: true
        inverse: default_memory_model

  OwnershipAnnotation:
    is_a: NamedEntity
    description: >-
      An ownership/lifetime annotation on a data element
    attributes:
      ownership:
        range: OwnershipModel
        required: true
      lifetime:
        range: LifetimeScope
      lifetime_name:
        range: string
        description: Named lifetime identifier (e.g., 'a in Rust)
      annotates_data_element:
        range: DataElement
        inverse: ownership_annotations

  # SECTION 26: DOMAIN ENTITY RELATIONSHIPS

  DomainRelationship:
    is_a: NamedEntity
    description: >-
      A named, typed relationship between two domain entities
      (e.g., Order has many OrderLines, User belongs to Organization)
    attributes:
      cardinality:
        range: Cardinality
        required: true
      is_navigable:
        range: boolean
        description: Whether the relationship can be traversed from source to target
      is_bidirectional:
        range: boolean
      is_composition:
        range: boolean
        description: Whether the target's lifecycle depends on the source (UML composition)
      foreign_key_field:
        range: string
        description: The field implementing this relationship in the data layer
      join_entity:
        range: string
        description: For many-to-many, the name of the join table/entity
      source_entity:
        range: DomainEntity
        inverse: outgoing_relationships
      target_entity:
        range: DomainEntity
        inverse: incoming_relationships

  # SECTION 27: DATABASE SCHEMA OBJECTS

  DatabaseConstraint:
    is_a: NamedEntity
    description: >-
      A constraint on a database table/collection
    attributes:
      constraint_type:
        range: DatabaseConstraintType
        required: true
      columns:
        range: string
        multivalued: true
      reference_table:
        range: string
        description: Referenced table for foreign keys
      reference_columns:
        range: string
        multivalued: true
        description: Referenced columns for foreign keys
      expression:
        range: string
        description: Expression for CHECK constraints
      constraint_on_collection:
        range: Collection
        inverse: has_constraints

  DatabaseIndex:
    is_a: NamedEntity
    description: >-
      An index on a database table/collection
    attributes:
      index_type:
        range: IndexType
        required: true
      columns:
        range: string
        multivalued: true
      is_unique:
        range: boolean
      is_partial:
        range: boolean
      filter_expression:
        range: string
        description: Filter for partial indexes
      index_on_collection:
        range: Collection
        inverse: has_indexes

  # SECTION 28: PROGRAMMING LANGUAGE AS FIRST-CLASS ENTITY

  ProgrammingLanguage:
    is_a: NamedEntity
    description: >-
      A programming language with its paradigms, type system, and runtime characteristics
    attributes:
      paradigms:
        range: ProgrammingParadigm
        multivalued: true
      type_discipline:
        range: string
        description: Type system characterization (e.g., "static_strong", "dynamic_strong")
      has_preprocessor:
        range: boolean
      has_gc:
        range: boolean
      year_introduced:
        range: integer
      language_used_by_containers:
        range: CodeContainer
        multivalued: true
        inverse: written_in_language
      default_error_model:
        range: ErrorModel
        inverse: error_model_for_languages
      default_memory_model:
        range: MemoryModel
        inverse: memory_model_for_languages

  # SECTION 30: KNOWLEDGE ARTIFACTS

  KnowledgeArtifact:
    is_a: NamedEntity
    mixins:
      - Versionable
    description: >-
      A knowledge artifact that documents some aspect of the system
    attributes:
      artifact_type:
        range: KnowledgeArtifactType
      status:
        range: KnowledgeArtifactStatus
      uri:
        range: URI
      content:
        range: string
      authored_by:
        range: string
        multivalued: true
      authored_at:
        range: Timestamp
      superseded_by:
        range: KnowledgeArtifact
      supersedes:
        range: KnowledgeArtifact
      documents_system:
        range: System
        inverse: system_documented_by_artifacts
      documents_bounded_context:
        range: BoundedContext
        inverse: context_documented_by_artifacts
      documents_module:
        range: Module
        inverse: module_documented_by_artifacts
      documents_component:
        range: Component
        inverse: component_documented_by_artifacts
      documents_service:
        range: Service
        inverse: service_documented_by_artifacts
      documents_aggregate:
        range: Aggregate
        inverse: aggregate_documented_by_artifacts
      documents_domain_entity:
        range: DomainEntity
        inverse: entity_documented_by_artifacts
      documents_integration:
        range: Integration
        inverse: integration_documented_by_artifacts
      stored_in_container:
        range: CodeContainer
        inverse: contains_knowledge_artifacts

# GLOBAL SLOTS (multi-domain and base identification only)
slots:
  # Base identification slots
  id:
    identifier: true
    range: string
  name:
    range: string
  description:
    range: string
  version:
    range: SemanticVersion
  created_at:
    range: Timestamp
  updated_at:
    range: Timestamp
  tags:
    range: string
    multivalued: true
  is_active:
    range: boolean
  is_optional:
    range: boolean

  # Multi-domain relationship slots
  defined_in_container:
    range: CodeContainer
    inverse: contains_code_elements
    description: Code container where this element is defined
    domain_of:
      - EncapsulationUnit
